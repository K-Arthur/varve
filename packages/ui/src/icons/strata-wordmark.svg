<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 308 128">
  <!--
    Strata wordmark — horizontal lockup.
    Icon (64px) + "Strata" in Geist Variable, the brand display font.
    Clear space: cap height around the entire lockup.
  -->
  <g font-family="'Geist Variable','Geist',ui-sans-serif,system-ui,sans-serif" font-weight="600" font-size="64" letter-spacing="-0.03em">
    <rect x="0" y="30" width="48" height="8" rx="1" fill="#52d1c5"/>
    <rect x="0" y="44" width="54" height="8" rx="1" fill="#39d0c6"/>
    <rect x="0" y="58" width="48" height="8" rx="1" fill="#26a69e"/>
    <rect x="0" y="72" width="54" height="8" rx="1" fill="#1d807b"/>
    <text x="80" y="90" fill="#10151f">Strata</text>
  </g>
</svg>
