<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Varve GPU effects harness</title>
  </head>
  <body>
    <pre id="result">pending</pre>
    <script src="/home/kevina/CodingProjects/varve/packages/compositor/dist/effects-harness.js"></script>
    <script>
      // Auto-run only when ?effects= is given (standalone use). The CDP
      // verifier loads the page bare and drives the run explicitly, so the
      // two never race.
      var params = new URLSearchParams(window.location.search);
      var effects = params.get('effects');
      if (!effects) return;
      window.__effectsHarness
        .run(effects.split(','))
        .then(function (r) {
          document.getElementById('result').textContent = 'HARNESS_OK ' + JSON.stringify(r);
        })
        .catch(function (e) {
          document.getElementById('result').textContent =
            'HARNESS_ERR ' + (e && e.message ? e.message : String(e));
        });
    </script>
  </body>
</html>
