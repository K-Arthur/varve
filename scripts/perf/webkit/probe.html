<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Varve WebKitGTK OffscreenCanvas probe</title>
  </head>
  <body>
    <canvas id="target" width="320" height="240"></canvas>
    <pre id="out">running…</pre>
    <script>
      const RESULT = { steps: [], env: {}, verdict: 'incomplete' };
      window.__probeDone = false;

      function step(name, ok, detail) {
        RESULT.steps.push({ name, ok, ...(detail || {}) });
      }

      function pct(arr, p) {
        if (!arr.length) return null;
        const s = [...arr].sort((a, b) => a - b);
        return s[Math.min(s.length - 1, Math.floor((p / 100) * s.length))];
      }

      function makeWorker(kind) {
        return kind === 'module'
          ? new Worker('probe-worker.js', { type: 'module' })
          : new Worker('probe-worker.js');
      }

      /** One request/response round-trip with a timeout so a hang is recorded, not hung on. */
      function ask(worker, msg, timeoutMs = 15000) {
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            cleanup();
            reject(new Error('timeout waiting for ' + msg.type));
          }, timeoutMs);
          function onMessage(e) {
            if (e.data && e.data.type === 'ready') return;
            cleanup();
            resolve({ data: e.data, ports: e.ports });
          }
          function onError(err) {
            cleanup();
            reject(new Error('worker error: ' + (err.message || 'unknown')));
          }
          function cleanup() {
            clearTimeout(timer);
            worker.removeEventListener('message', onMessage);
            worker.removeEventListener('error', onError);
          }
          worker.addEventListener('message', onMessage);
          worker.addEventListener('error', onError);
          worker.postMessage(msg);
        });
      }

      function waitReady(worker, timeoutMs = 15000) {
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => reject(new Error('worker never signalled ready')), timeoutMs);
          worker.addEventListener('message', function onMsg(e) {
            if (e.data && e.data.type === 'ready') {
              clearTimeout(timer);
              worker.removeEventListener('message', onMsg);
              resolve();
            }
          });
          worker.addEventListener('error', (err) => {
            clearTimeout(timer);
            reject(new Error('worker error during startup: ' + (err.message || 'unknown')));
          });
        });
      }

      /** Read back 4 quadrant samples from a canvas that received the bitmap. */
      function sampleQuadrants(ctx, w, h) {
        const at = (x, y) => {
          const d = ctx.getImageData(x, y, 1, 1).data;
          return [d[0], d[1], d[2], d[3]];
        };
        return [
          at(Math.floor(w * 0.25), Math.floor(h * 0.25)),
          at(Math.floor(w * 0.75), Math.floor(h * 0.25)),
          at(Math.floor(w * 0.25), Math.floor(h * 0.75)),
          at(Math.floor(w * 0.75), Math.floor(h * 0.75)),
        ];
      }

      const EXPECTED = [
        [255, 0, 0, 255],
        [0, 255, 0, 255],
        [0, 0, 255, 255],
        [255, 255, 0, 255],
      ];

      function samplesMatch(actual) {
        return actual.every((px, i) =>
          px.every((c, j) => Math.abs(c - EXPECTED[i][j]) <= 2),
        );
      }

      /** Same representative replay as the worker, for a main-thread comparison. */
      function replayRepresentative(c, w, h, seed) {
        c.save();
        c.clearRect(0, 0, w, h);
        c.fillStyle = '#101418';
        c.fillRect(0, 0, w, h);
        for (let i = 0; i < 40; i++) {
          c.fillStyle = i % 2 ? '#2ec4b6' : '#e71d36';
          c.fillRect((i * 37 + seed) % w, (i * 53) % h, 24, 18);
        }
        c.save();
        c.translate(w / 2, h / 2);
        c.rotate((seed % 360) * (Math.PI / 180));
        c.beginPath();
        c.moveTo(-60, -40);
        c.bezierCurveTo(-20, -90, 40, 60, 70, -10);
        c.lineWidth = 4;
        c.lineJoin = 'round';
        c.strokeStyle = '#ffd166';
        c.stroke();
        c.restore();
        const g = c.createLinearGradient(0, 0, w, h);
        g.addColorStop(0, 'rgba(46,196,182,0.7)');
        g.addColorStop(1, 'rgba(231,29,54,0.2)');
        c.fillStyle = g;
        c.fillRect(w * 0.1, h * 0.6, w * 0.5, h * 0.25);
        c.globalAlpha = 0.6;
        c.globalCompositeOperation = 'multiply';
        c.fillStyle = '#118ab2';
        c.fillRect(w * 0.3, h * 0.1, w * 0.3, h * 0.3);
        c.globalCompositeOperation = 'source-over';
        c.globalAlpha = 1;
        c.fillStyle = '#f8f9fa';
        c.font = '16px sans-serif';
        c.fillText('varve probe ' + seed, 12, 24);
        c.restore();
      }

      async function main() {
        const W = 640;
        const H = 480;
        const target = document.getElementById('target');
        target.width = W;
        target.height = H;
        const tctx = target.getContext('2d', { willReadFrequently: true });

        // ── 1. Main-thread environment ───────────────────────────────────────
        RESULT.env = {
          userAgent: navigator.userAgent,
          hardwareConcurrency: navigator.hardwareConcurrency,
          deviceMemory: navigator.deviceMemory ?? null,
          devicePixelRatio: window.devicePixelRatio,
          hasWorker: typeof Worker !== 'undefined',
          hasSharedWorker: typeof SharedWorker !== 'undefined',
          hasOffscreenCanvasMain: typeof OffscreenCanvas !== 'undefined',
          hasCreateImageBitmap: typeof createImageBitmap === 'function',
          hasImageBitmapRenderingContext: (() => {
            try {
              return !!document.createElement('canvas').getContext('bitmaprenderer');
            } catch {
              return false;
            }
          })(),
          hasWebGL: (() => {
            try {
              const gl = document.createElement('canvas').getContext('webgl');
              if (gl) gl.getExtension('WEBGL_lose_context')?.loseContext();
              return !!gl;
            } catch {
              return false;
            }
          })(),
          hasWebGL2: (() => {
            try {
              return !!document.createElement('canvas').getContext('webgl2');
            } catch {
              return false;
            }
          })(),
          hasWebGPU: 'gpu' in navigator,
          hasRequestAnimationFrame: typeof requestAnimationFrame === 'function',
          // Main-thread OffscreenCanvas construction is a separate question
          // from worker-side construction; both are recorded.
          mainThreadOffscreenConstructs: (() => {
            try {
              const oc = new OffscreenCanvas(8, 8);
              const c = oc.getContext('2d');
              if (!c) return 'no-2d-context';
              c.fillStyle = 'rgb(1,2,3)';
              c.fillRect(0, 0, 8, 8);
              const d = c.getImageData(0, 0, 1, 1).data;
              return d[0] === 1 && d[1] === 2 && d[2] === 3 ? 'ok' : 'wrong-pixels';
            } catch (e) {
              return 'threw: ' + String(e);
            }
          })(),
          transferControlToOffscreen:
            typeof HTMLCanvasElement !== 'undefined' &&
            typeof HTMLCanvasElement.prototype.transferControlToOffscreen === 'function',
        };
        step('main-thread-env', true, {});

        // ── 2. Worker construction (classic + module) ────────────────────────
        const workerKinds = {};
        for (const kind of ['classic', 'module']) {
          let w = null;
          try {
            w = makeWorker(kind);
            await waitReady(w);
            workerKinds[kind] = { constructed: true };
            const env = await ask(w, { type: 'env' });
            workerKinds[kind].workerEnv = env.data;
          } catch (e) {
            workerKinds[kind] = { constructed: false, error: String(e.message || e) };
          } finally {
            if (w) w.terminate();
          }
        }
        RESULT.workerKinds = workerKinds;
        step('worker-construction', workerKinds.module?.constructed === true, {
          classic: workerKinds.classic?.constructed === true,
          module: workerKinds.module?.constructed === true,
        });

        // Varve creates its render worker as a MODULE worker. If that fails,
        // the classic result is informational only.
        const kindForRest = workerKinds.module?.constructed
          ? 'module'
          : workerKinds.classic?.constructed
            ? 'classic'
            : null;
        RESULT.kindUsedForRest = kindForRest;
        if (!kindForRest) {
          RESULT.verdict = 'worker-unavailable';
          finish();
          return;
        }

        const worker = makeWorker(kindForRest);
        await waitReady(worker);

        try {
          // ── 3. OffscreenCanvas construction inside the worker ─────────────
          const constructed = await ask(worker, { type: 'construct', width: W, height: H });
          RESULT.construct = constructed.data;
          step('worker-offscreen-construct', constructed.data.ok === true, {
            error: constructed.data.error,
          });
          if (!constructed.data.ok) {
            RESULT.verdict = 'offscreen-api-present-but-broken';
            finish();
            return;
          }

          // ── 4. Known-pixel draw verified inside the worker ────────────────
          const known = await ask(worker, { type: 'knownPixels', width: W, height: H });
          RESULT.knownPixels = known.data;
          const workerPixelsOk =
            known.data.ok && known.data.workerSamples && samplesMatch(known.data.workerSamples);
          step('worker-draw-known-pixels', !!workerPixelsOk, {
            samples: known.data.workerSamples,
            error: known.data.error,
          });

          // ── 5. transferToImageBitmap + transfer back + main-thread verify ─
          // The single most important gate: pixels drawn in the worker must
          // arrive intact on the main thread and composite correctly.
          const transferred = await ask(worker, { type: 'transferKnown', width: W, height: H });
          const d = transferred.data;
          RESULT.transfer = {
            ok: d.ok,
            bitmapWidth: d.bitmapWidth,
            bitmapHeight: d.bitmapHeight,
            bitmapArrived: !!d.bitmap,
            bitmapCtor: d.bitmap ? d.bitmap.constructor.name : null,
            error: d.error,
          };
          step('worker-transfer-to-image-bitmap', d.ok === true, { error: d.error });
          step('bitmap-arrives-on-main-thread', !!d.bitmap, {});

          if (d.bitmap) {
            tctx.setTransform(1, 0, 0, 1, 0, 0);
            tctx.clearRect(0, 0, W, H);
            tctx.drawImage(d.bitmap, 0, 0);
            const mainSamples = sampleQuadrants(tctx, W, H);
            RESULT.transfer.mainSamples = mainSamples;
            RESULT.transfer.pixelsCorrect = samplesMatch(mainSamples);
            step('transferred-pixels-correct', samplesMatch(mainSamples), {
              samples: mainSamples,
            });
            d.bitmap.close();
          }
        } catch (e) {
          RESULT.fatal = String(e.message || e);
          step('fatal', false, { error: RESULT.fatal });
        }

        // ── 6. Repeated frames + timing (worker) ────────────────────────────
        const FRAMES = 120;
        try {
          const frames = await ask(worker, { type: 'frames', width: W, height: H, count: FRAMES }, 60000);
          const d = frames.data;
          RESULT.workerFrames = {
            ok: d.ok,
            count: d.count,
            totalMs: d.totalMs,
            replayP50: pct(d.replayTimes || [], 50),
            replayP95: pct(d.replayTimes || [], 95),
            bitmapP50: pct(d.bitmapTimes || [], 50),
            bitmapP95: pct(d.bitmapTimes || [], 95),
            error: d.error,
          };
          step('worker-repeated-frames', d.ok === true, { count: d.count, error: d.error });
        } catch (e) {
          RESULT.workerFrames = { ok: false, error: String(e.message || e) };
          step('worker-repeated-frames', false, { error: RESULT.workerFrames.error });
        }

        // ── 7. Resize behaviour ─────────────────────────────────────────────
        try {
          const r = await ask(worker, { type: 'resize', width: 800, height: 600 });
          RESULT.resize = {
            ok: r.data.ok,
            surfaceState: r.data.surfaceState,
            bitmapWidth: r.data.bitmapWidth,
            bitmapHeight: r.data.bitmapHeight,
            error: r.data.error,
          };
          step(
            'worker-resize',
            r.data.ok === true && r.data.bitmapWidth === 800 && r.data.bitmapHeight === 600,
            { error: r.data.error },
          );
        } catch (e) {
          RESULT.resize = { ok: false, error: String(e.message || e) };
          step('worker-resize', false, { error: RESULT.resize.error });
        }

        worker.terminate();

        // ── 8. Main-thread comparison for the same representative replay ────
        const mainTimes = [];
        for (let i = 0; i < FRAMES; i++) {
          const a = performance.now();
          replayRepresentative(tctx, W, H, i);
          mainTimes.push(performance.now() - a);
        }
        RESULT.mainThreadFrames = {
          count: FRAMES,
          replayP50: pct(mainTimes, 50),
          replayP95: pct(mainTimes, 95),
        };
        step('main-thread-frames', true, {});

        RESULT.verdict = 'complete';
        finish();
      }

      function finish() {
        window.__probeResult = RESULT;
        window.__probeDone = true;
        document.getElementById('out').textContent = JSON.stringify(RESULT, null, 2);
      }

      main().catch((e) => {
        RESULT.fatal = String((e && e.stack) || e);
        RESULT.verdict = 'fatal';
        finish();
      });
    </script>
  </body>
</html>
