<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Website visual baselines are captured on ubuntu-latest, which does not
     ship Cascadia / JetBrains / SF Mono. Those families sit ahead of generic
     monospace in --font-mono, so a local snapshot taken with them visible is
     shorter than CI (download-dark was 6434 vs 6447). Include the system
     config, then reject only those optional families. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/truetype/cascadia/*</glob>
      <glob>/usr/share/fonts/truetype/jetbrains-mono/*</glob>
      <glob>/usr/share/fonts/opentype/jetbrains-mono/*</glob>
      <pattern>
        <patelt name="family"><string>Cascadia Code</string></patelt>
      </pattern>
      <pattern>
        <patelt name="family"><string>Cascadia Mono</string></patelt>
      </pattern>
      <pattern>
        <patelt name="family"><string>Cascadia Code PL</string></patelt>
      </pattern>
      <pattern>
        <patelt name="family"><string>Cascadia Mono PL</string></patelt>
      </pattern>
      <pattern>
        <patelt name="family"><string>JetBrains Mono</string></patelt>
      </pattern>
      <pattern>
        <patelt name="family"><string>SF Mono</string></patelt>
      </pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
