<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Varve</title>
    <meta name="theme-color" content="#10151f" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* Brand-fixed dark splash — ignores in-app light/dark/HC theme. */
        color-scheme: dark;
        background: #10151f;
        font-family: system-ui, sans-serif;
      }

      .splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        width: 100%;
        min-height: 100%;
        background: #10151f;
      }

      .splash__logo-wrap {
        position: relative;
        width: 160px;
        height: 160px;
        transform: translateY(6%);
      }

      .splash__logo-wrap::before {
        content: '';
        position: absolute;
        inset: -36%;
        border-radius: 50%;
        background: radial-gradient(circle, rgb(255 255 255 / 0.1) 0%, transparent 65%);
        pointer-events: none;
        z-index: 0;
        animation: varve-logo-luminosity 3.6s ease-in-out infinite;
      }

      .splash__logo {
        position: relative;
        z-index: 1;
        display: block;
        width: 160px;
        height: 160px;
        color: #ffffff;
        filter:
          drop-shadow(-1.25px 0 0 rgb(57 208 198 / 0.7))
          drop-shadow(1.25px 0 0 rgb(255 110 140 / 0.55))
          drop-shadow(0 0 10px rgb(255 255 255 / 0.14));
      }

      @keyframes varve-logo-luminosity {
        0%,
        100% {
          opacity: 0.45;
        }
        50% {
          opacity: 0.9;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash__logo-wrap::before {
          animation: none;
          opacity: 0.55;
        }
        .splash__logo {
          filter:
            drop-shadow(-1px 0 0 rgb(57 208 198 / 0.55))
            drop-shadow(1px 0 0 rgb(255 110 140 / 0.4))
            drop-shadow(0 0 6px rgb(255 255 255 / 0.1));
        }
      }

      .splash__sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main aria-label="Varve startup">
      <h1 class="splash__sr-only">Varve</h1>
      <div class="splash" role="status" aria-live="polite" aria-label="Starting Varve">
        <div class="splash__logo-wrap">
          <svg
            class="splash__logo"
            viewBox="0 0 16 16"
            fill="currentColor"
            aria-hidden="true"
          >
            <polygon points="1,1.5 10,1.5 11,4.5 2,4.5" />
            <polygon points="3,5.5 12,5.5 13,8.5 4,8.5" />
            <polygon points="5,9.5 14,9.5 15,12.5 6,12.5" />
          </svg>
        </div>
      </div>
    </main>
  </body>
</html>
