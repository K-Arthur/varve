<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Strata</title>
    <meta name="theme-color" content="#10151f" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #10151f;
        font-family: system-ui, sans-serif;
      }

      .splash {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
      }

      .splash__logo-wrap {
        position: relative;
        width: 80px;
        height: 80px;
      }

      .splash__logo {
        position: absolute;
        inset: 0;
        width: 80px;
        height: 80px;
        color: #ffffff;
        mix-blend-mode: screen;
      }

      .splash__logo--red {
        color: #ff0000;
        animation: ca-red 3s infinite ease-in-out;
      }

      .splash__logo--green {
        color: #00ff00;
        animation: ca-green 3s infinite ease-in-out;
      }

      .splash__logo--blue {
        color: #0000ff;
        animation: ca-blue 3s infinite ease-in-out;
      }

      .splash__logo--white {
        color: #ffffff;
        mix-blend-mode: normal;
      }

      @keyframes ca-red {
        0%,
        100% {
          transform: translate(0, 0);
          opacity: 0.8;
        }
        25% {
          transform: translate(-1px, -0.5px);
          opacity: 1;
        }
        50% {
          transform: translate(0.5px, 0.5px);
          opacity: 0.8;
        }
        75% {
          transform: translate(-0.5px, 1px);
          opacity: 1;
        }
      }

      @keyframes ca-green {
        0%,
        100% {
          transform: translate(0, 0);
          opacity: 0.8;
        }
        33% {
          transform: translate(1px, 0.5px);
          opacity: 1;
        }
        66% {
          transform: translate(-0.5px, -0.5px);
          opacity: 0.8;
        }
      }

      @keyframes ca-blue {
        0%,
        100% {
          transform: translate(0, 0);
          opacity: 0.8;
        }
        20% {
          transform: translate(0.5px, -1px);
          opacity: 1;
        }
        40% {
          transform: translate(-1px, 0.5px);
          opacity: 0.8;
        }
        60% {
          transform: translate(1px, 1px);
          opacity: 1;
        }
        80% {
          transform: translate(-0.5px, -0.5px);
          opacity: 0.8;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash__logo--red,
        .splash__logo--green,
        .splash__logo--blue {
          animation: none;
          opacity: 0.3;
        }
        .splash__logo--red {
          transform: translate(-0.5px, -0.25px);
        }
        .splash__logo--green {
          transform: translate(0.5px, 0.25px);
        }
        .splash__logo--blue {
          transform: translate(0, 0.5px);
        }
      }

      .splash__sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main aria-label="Strata startup">
      <h1 class="splash__sr-only">Strata</h1>
      <div class="splash" role="status" aria-live="polite" aria-label="Starting Strata">
        <div class="splash__logo-wrap">
          <svg class="splash__logo splash__logo--red" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <rect x="1" y="2" width="9" height="3" rx="1" />
            <rect x="3" y="7" width="9" height="3" rx="1" />
            <rect x="5" y="12" width="9" height="3" rx="1" />
          </svg>
          <svg class="splash__logo splash__logo--green" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <rect x="1" y="2" width="9" height="3" rx="1" />
            <rect x="3" y="7" width="9" height="3" rx="1" />
            <rect x="5" y="12" width="9" height="3" rx="1" />
          </svg>
          <svg class="splash__logo splash__logo--blue" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <rect x="1" y="2" width="9" height="3" rx="1" />
            <rect x="3" y="7" width="9" height="3" rx="1" />
            <rect x="5" y="12" width="9" height="3" rx="1" />
          </svg>
          <svg class="splash__logo splash__logo--white" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <rect x="1" y="2" width="9" height="3" rx="1" />
            <rect x="3" y="7" width="9" height="3" rx="1" />
            <rect x="5" y="12" width="9" height="3" rx="1" />
          </svg>
        </div>
      </div>
    </main>
  </body>
</html>
