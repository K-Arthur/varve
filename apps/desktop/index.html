<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Strata</title>
    <meta name="theme-color" content="#10151f" />
    <meta name="application-name" content="Strata" />
    <link rel="icon" type="image/svg+xml" href="/icons/strata-icon.svg" />
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Performance mark: first HTML content renders before any JS executes. -->
    <script>
      if (typeof performance !== 'undefined' && performance.mark) {
        performance.mark('strata-html-paint');
      }
    </script>
    <!-- Pre-JS boot fallback: paints before the bundle downloads (browser target only). -->
    <style id="strata-boot-fallback-style">
      #strata-boot-fallback {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #10151f;
        z-index: 2147483646;
      }
      #strata-boot-fallback .boot-logo-wrap {
        position: relative;
        width: 64px;
        height: 64px;
      }
      #strata-boot-fallback .boot-logo {
        position: absolute;
        inset: 0;
        width: 64px;
        height: 64px;
        color: #fff;
        mix-blend-mode: screen;
      }
      #strata-boot-fallback .boot-logo--red {
        color: #f00;
        transform: translate(-0.5px, -0.25px);
        opacity: 0.35;
      }
      #strata-boot-fallback .boot-logo--green {
        color: #0f0;
        transform: translate(0.5px, 0.25px);
        opacity: 0.35;
      }
      #strata-boot-fallback .boot-logo--blue {
        color: #00f;
        transform: translate(0, 0.5px);
        opacity: 0.35;
      }
      #strata-boot-fallback .boot-logo--white {
        color: #fff;
        mix-blend-mode: normal;
      }
      @media (prefers-reduced-motion: reduce) {
        #strata-boot-fallback .boot-logo--red,
        #strata-boot-fallback .boot-logo--green,
        #strata-boot-fallback .boot-logo--blue {
          opacity: 0.25;
        }
      }
    </style>
  </head>
  <body>
    <div id="strata-boot-fallback" role="status" aria-live="polite" aria-label="Loading Strata">
      <div class="boot-logo-wrap" aria-hidden="true">
        <svg class="boot-logo boot-logo--red" viewBox="0 0 16 16" fill="currentColor">
          <!-- Three cascading parallelograms matching the Strata brand mark -->
          <polygon points="1,1.5 10,1.5 11,4.5 2,4.5" />
          <polygon points="3,5.5 12,5.5 13,8.5 4,8.5" />
          <polygon points="5,9.5 14,9.5 15,12.5 6,12.5" />
        </svg>
        <svg class="boot-logo boot-logo--green" viewBox="0 0 16 16" fill="currentColor">
          <polygon points="1,1.5 10,1.5 11,4.5 2,4.5" />
          <polygon points="3,5.5 12,5.5 13,8.5 4,8.5" />
          <polygon points="5,9.5 14,9.5 15,12.5 6,12.5" />
        </svg>
        <svg class="boot-logo boot-logo--blue" viewBox="0 0 16 16" fill="currentColor">
          <polygon points="1,1.5 10,1.5 11,4.5 2,4.5" />
          <polygon points="3,5.5 12,5.5 13,8.5 4,8.5" />
          <polygon points="5,9.5 14,9.5 15,12.5 6,12.5" />
        </svg>
        <svg class="boot-logo boot-logo--white" viewBox="0 0 16 16" fill="currentColor">
          <polygon points="1,1.5 10,1.5 11,4.5 2,4.5" />
          <polygon points="3,5.5 12,5.5 13,8.5 4,8.5" />
          <polygon points="5,9.5 14,9.5 15,12.5 6,12.5" />
        </svg>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
