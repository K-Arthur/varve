<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Strata</title>
    <meta name="theme-color" content="#10151f" />
    <meta name="application-name" content="Strata" />
    <link rel="icon" type="image/svg+xml" href="/icons/strata-icon.svg" />
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      if (typeof performance !== 'undefined' && performance.mark) {
        performance.mark('strata-html-paint');
      }
    </script>
    <style id="strata-boot-fallback-style">
      #strata-boot-fallback {
        /* Brand-fixed dark splash — ignores in-app light/dark/HC theme. */
        color-scheme: dark;
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #10151f;
        color: #ffffff;
        z-index: 2147483646;
      }
      #strata-boot-fallback .boot-logo-wrap {
        position: relative;
        width: 136px;
        height: 136px;
        transform: translateY(6%);
      }
      #strata-boot-fallback .boot-logo-wrap::before {
        content: '';
        position: absolute;
        inset: -36%;
        border-radius: 50%;
        background: radial-gradient(circle, rgb(255 255 255 / 0.1) 0%, transparent 65%);
        pointer-events: none;
        z-index: 0;
        animation: strata-logo-luminosity 3.6s ease-in-out infinite;
      }
      #strata-boot-fallback .boot-logo {
        position: relative;
        z-index: 1;
        display: block;
        width: 136px;
        height: 136px;
        color: #fff;
        filter:
          drop-shadow(-1.25px 0 0 rgb(57 208 198 / 0.7))
          drop-shadow(1.25px 0 0 rgb(255 110 140 / 0.55))
          drop-shadow(0 0 10px rgb(255 255 255 / 0.14));
      }
      @keyframes strata-logo-luminosity {
        0%,
        100% {
          opacity: 0.45;
        }
        50% {
          opacity: 0.9;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #strata-boot-fallback .boot-logo-wrap::before {
          animation: none;
          opacity: 0.55;
        }
        #strata-boot-fallback .boot-logo {
          filter:
            drop-shadow(-1px 0 0 rgb(57 208 198 / 0.55))
            drop-shadow(1px 0 0 rgb(255 110 140 / 0.4))
            drop-shadow(0 0 6px rgb(255 255 255 / 0.1));
        }
      }
    </style>
  </head>
  <body>
    <div id="strata-boot-fallback" role="status" aria-live="polite" aria-label="Loading Strata">
      <div class="boot-logo-wrap" aria-hidden="true">
        <svg class="boot-logo" viewBox="0 0 16 16" fill="currentColor">
          <polygon points="1,1.5 10,1.5 11,4.5 2,4.5" />
          <polygon points="3,5.5 12,5.5 13,8.5 4,8.5" />
          <polygon points="5,9.5 14,9.5 15,12.5 6,12.5" />
        </svg>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
