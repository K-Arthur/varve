<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Varve</title>
    <meta name="theme-color" content="#10151f" />
    <meta name="application-name" content="Varve" />
    <link rel="icon" type="image/svg+xml" href="/icons/varve-icon.svg" />
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      // Apply saved theme BEFORE React mounts so CSS custom properties
      // resolve to the correct theme from the first paint.
      (function () {
        var saved = localStorage.getItem('varve-theme') ||
                    localStorage.getItem('strata-theme');
        if (saved && /^(light|dark|high-contrast)$/.test(saved)) {
          document.documentElement.dataset.theme = saved;
        }
      })();
    </script>
    <script>
      if (typeof performance !== 'undefined' && performance.mark) {
        performance.mark('varve-html-paint');
      }

      // Surface startup failures on screen.
      //
      // If the module bundle throws before React mounts, nothing removes the
      // boot fallback and the app sits on the logo forever with no way to see
      // why — there is no console in a packaged build. These handlers run from
      // plain inline script, so they work even when the bundle never executes,
      // which is exactly the case that used to be invisible.
        (function () {
        var reported = false;
        function showBootError(kind, message, detail) {
          if (reported) return;
          reported = true;
          var host = document.getElementById('varve-boot-fallback');
          if (!host) return;
          var box = document.createElement('div');
          box.className = 'boot-error';
          box.setAttribute('role', 'alert');
          var text =
            '<h1>Varve could not start</h1>' +
            '<p class="boot-error-kind"></p>' +
            '<pre class="boot-error-message"></pre>' +
            '<p class="boot-error-hint">Please report this with the text above at ' +
            '<a class="boot-error-link" href="https://github.com/K-Arthur/varve/issues" ' +
            'target="_blank" rel="noopener noreferrer">github.com/K-Arthur/varve/issues</a></p>' +
            '<button type="button" class="boot-error-reload" autofocus>Reload</button>';
          box.innerHTML = text;
          // textContent, not innerHTML — an error message can contain markup
          // from untrusted document content.
          box.querySelector('.boot-error-kind').textContent = kind;
          box.querySelector('.boot-error-message').textContent =
            String(message) + (detail ? '\n\n' + detail : '');
          box.querySelector('.boot-error-reload').addEventListener('click', function () {
            location.reload();
          });
          host.textContent = '';
          host.appendChild(box);
        }

        window.addEventListener('error', function (event) {
          showBootError(
            'Script error',
            event.message || 'Unknown error',
            event.filename ? event.filename + ':' + event.lineno : '',
          );
        });
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          showBootError(
            'Unhandled promise rejection',
            (reason && (reason.message || reason)) || 'Unknown',
            (reason && reason.stack) || '',
          );
        });

        // Nothing threw, but React never mounted either — a silently-failing
        // module graph. Report that too rather than spinning forever.
        window.setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.children.length === 0) {
            showBootError(
              'Startup timed out',
              'The application bundle loaded but never rendered.',
              'This usually means a script failed to evaluate in this WebView.',
            );
          }
        }, 20000);
      })();
    </script>
    <style id="varve-boot-fallback-style">
      #varve-boot-fallback {
        /* Brand-fixed dark splash — ignores in-app light/dark/HC theme. */
        color-scheme: dark;
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #10151f;
        color: #ffffff;
        z-index: 2147483646;
      }
      #varve-boot-fallback .boot-logo-wrap {
        position: relative;
        width: 136px;
        height: 136px;
        transform: translateY(6%);
      }
      #varve-boot-fallback .boot-logo-wrap::before {
        content: '';
        position: absolute;
        inset: -36%;
        border-radius: 50%;
        background: radial-gradient(circle, rgb(255 255 255 / 0.1) 0%, transparent 65%);
        pointer-events: none;
        z-index: 0;
        animation: varve-logo-luminosity 3.6s ease-in-out infinite;
      }
      #varve-boot-fallback .boot-logo {
        position: relative;
        z-index: 1;
        display: block;
        width: 136px;
        height: 136px;
        color: #fff;
        filter:
          drop-shadow(-1.25px 0 0 rgb(57 208 198 / 0.7))
          drop-shadow(1.25px 0 0 rgb(255 110 140 / 0.55))
          drop-shadow(0 0 10px rgb(255 255 255 / 0.14));
      }
      @keyframes varve-logo-luminosity {
        0%,
        100% {
          opacity: 0.45;
        }
        50% {
          opacity: 0.9;
        }
      }
      #varve-boot-fallback .boot-error {
        max-width: 44rem;
        padding: 2rem;
        font:
          14px/1.5 system-ui,
          sans-serif;
        text-align: left;
      }
      #varve-boot-fallback .boot-error h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 600;
      }
      #varve-boot-fallback .boot-error-kind {
        margin: 0 0 1rem;
        color: #ff8fa3;
        font-weight: 500;
      }
      #varve-boot-fallback .boot-error-message {
        margin: 0 0 1rem;
        padding: 1rem;
        max-height: 40vh;
        overflow: auto;
        border-radius: 6px;
        background: rgb(255 255 255 / 0.06);
        white-space: pre-wrap;
        word-break: break-word;
        font:
          12px/1.5 ui-monospace,
          monospace;
        -webkit-user-select: text;
        user-select: text;
      }
      #varve-boot-fallback .boot-error-hint {
        margin: 0;
        color: rgb(255 255 255 / 0.65);
      }
      #varve-boot-fallback .boot-error-link {
        color: #4adecc;
      }
      #varve-boot-fallback .boot-error-link:focus-visible {
        outline: 2px solid #4adecc;
        outline-offset: 2px;
      }
      #varve-boot-fallback .boot-error-reload {
        margin-top: 1.25rem;
        padding: 0.5rem 1.25rem;
        border: none;
        border-radius: 6px;
        background: #39d0c6;
        color: #10151f;
        font: 600 14px/1 system-ui, sans-serif;
        cursor: pointer;
      }
      #varve-boot-fallback .boot-error-reload:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
      #varve-boot-fallback .boot-error-reload:hover {
        background: #4adecc;
      }
      #varve-boot-fallback .boot-error-reload:active {
        background: #2ab5ac;
      }
      @media (prefers-reduced-motion: reduce) {
        #varve-boot-fallback .boot-logo-wrap::before {
          animation: none;
          opacity: 0.55;
        }
        #varve-boot-fallback .boot-logo {
          filter:
            drop-shadow(-1px 0 0 rgb(57 208 198 / 0.55))
            drop-shadow(1px 0 0 rgb(255 110 140 / 0.4))
            drop-shadow(0 0 6px rgb(255 255 255 / 0.1));
        }
      }
    </style>
  </head>
  <body>
    <div id="varve-boot-fallback" role="status" aria-live="polite" aria-label="Loading Varve">
      <div class="boot-logo-wrap" aria-hidden="true">
        <svg class="boot-logo" viewBox="0 0 16 16" fill="currentColor">
          <polygon points="1,1.5 10,1.5 11,4.5 2,4.5" />
          <polygon points="3,5.5 12,5.5 13,8.5 4,8.5" />
          <polygon points="5,9.5 14,9.5 15,12.5 6,12.5" />
        </svg>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
