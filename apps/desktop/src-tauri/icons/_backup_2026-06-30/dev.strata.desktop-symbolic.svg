<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!--
    Strata symbolic icon — monochrome single-color variant.
    Designed for Linux symbolic icon themes (GNOME/KDE/elementary).
    Fill is #000000; the desktop environment recolors via CSS / -gtk-icon-filter.
    Same geometry as the full-color mark but unified fill.
  -->
  <g fill="#000000">
    <rect x="16" y="26" width="96" height="16" rx="2"/>
    <rect x="0" y="46" width="108" height="16" rx="2"/>
    <rect x="16" y="66" width="96" height="16" rx="2"/>
    <rect x="0" y="86" width="108" height="16" rx="2"/>
  </g>
</svg>
