[package]
name = "strata-desktop"
version = "0.0.0"
description = "Strata desktop app (Tauri 2) — native engine backend."
edition = "2021"
license = "FSL-1.1-MIT"

# Standalone workspace so the Tauri app is isolated from the engine workspace
# (it has OS-specific build needs and tauri::generate_context! macro concerns).
[workspace]

[lib]
name = "strata_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
strata-core = { path = "../../../crates/strata-core" }
strata-engine = { path = "../../../crates/strata-engine" }
notify = "6"
font-enumeration = "0.9"
strata-sync = { path = "../../../crates/strata-sync" }
strata-print = { path = "../../../crates/strata-print" }
strata-bridge = { path = "../../../crates/strata-bridge" }
strata-bgremove = { path = "../../../crates/strata-bgremove" }
strata-trace = { path = "../../../crates/strata-trace" }
strata-upscale = { path = "../../../crates/strata-upscale" }
image = "0.25"
arboard = { version = "3", features = ["wayland-data-control"] }
tauri-plugin-fs = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
# WDIO testing plugins (debug-only, excluded from release builds)
tauri-plugin-wdio = { version = "=1.2.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.2.0", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
# Wayland/KDE icon matching: g_set_prgname must equal the .desktop filename stem.
glib = "0.20"

[features]
default = ["ai"]
custom-protocol = ["tauri/custom-protocol"]
# Native ONNX inference (ort crate, load-dynamic — no compile-time linkage,
# see crates/strata-bgremove/Cargo.toml). Default-on because it's the safer
# alternative to bare-WASM BiRefNet, which can crash with std::bad_alloc on
# GPU-less hosts (docs/audits/background-removal-wasm-memory-hardening-
# 2026-07-18.md). Safe to leave default even when the bundled onnxruntime
# dylib (scripts/fetch-onnxruntime.mjs) is missing for a given platform:
# nothing is linked at build time, and runtime.rs's native_ai_ready() will
# correctly report unavailable so the app falls back to WASM/heuristic.
ai = ["strata-bgremove/ai", "strata-upscale/ai"]
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
