[package]
name = "strata-desktop"
version = "0.0.0"
description = "Strata desktop app (Tauri 2) — native engine backend."
edition = "2021"

# Standalone workspace so the Tauri app is isolated from the engine workspace
# (it has OS-specific build needs and tauri::generate_context! macro concerns).
[workspace]

[lib]
name = "strata_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strata-core = { path = "../../../crates/strata-core" }
strata-engine = { path = "../../../crates/strata-engine" }
strata-sync = { path = "../../../crates/strata-sync" }
strata-print = { path = "../../../crates/strata-print" }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
