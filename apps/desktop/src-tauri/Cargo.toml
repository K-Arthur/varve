[package]
name = "varve-desktop"
version = "0.2.1"
description = "Varve desktop app (Tauri 2) — native engine backend."
edition = "2021"
license = "FSL-1.1-MIT"

# Standalone workspace so the Tauri app is isolated from the engine workspace
# (it has OS-specific build needs and tauri::generate_context! macro concerns).
[workspace]

[lib]
name = "varve_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
varve-core = { path = "../../../crates/varve-core" }
varve-engine = { path = "../../../crates/varve-engine" }
notify = "8"
font-enumeration = "0.9"
varve-sync = { path = "../../../crates/varve-sync" }
varve-print = { path = "../../../crates/varve-print" }
varve-bridge = { path = "../../../crates/varve-bridge" }
varve-bgremove = { path = "../../../crates/varve-bgremove" }
varve-trace = { path = "../../../crates/varve-trace" }
varve-upscale = { path = "../../../crates/varve-upscale" }
varve-effects = { path = "../../../crates/varve-effects" }
varve-media = { path = "../../../crates/varve-media" }
image = "0.25"
arboard = { version = "3", features = ["wayland-data-control"] }
tauri-plugin-fs = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
sha2 = "0.11"
base64 = "0.23"
# WDIO testing plugins (debug-only, excluded from release builds)
tauri-plugin-wdio = { version = "=1.2.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.2.0", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
# Wayland/KDE icon matching: g_set_prgname must equal the .desktop filename stem.
glib = "0.22"
# Reaching the raw WebKitGTK view to intercept its touchpad pinch page-zoom.
# Pinned to the exact version wry links against so both share one GObject type
# registry — a mismatched copy would hand back a foreign, unusable WebView.
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[features]
default = ["ai"]
custom-protocol = ["tauri/custom-protocol"]
# Native ONNX inference (ort crate, load-dynamic — no compile-time linkage,
# see crates/varve-bgremove/Cargo.toml). Default-on because it's the safer
# alternative to bare-WASM BiRefNet, which can crash with std::bad_alloc on
# GPU-less hosts (docs/audits/background-removal-wasm-memory-hardening-
# 2026-07-18.md). Safe to leave default even when the bundled onnxruntime
# dylib (scripts/fetch-onnxruntime.mjs) is missing for a given platform:
# nothing is linked at build time, and runtime.rs's native_ai_ready() will
# correctly report unavailable so the app falls back to WASM/heuristic.
ai = ["varve-bgremove/ai", "varve-upscale/ai"]
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
