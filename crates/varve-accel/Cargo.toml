[package]
name = "varve-accel"
description = "Native acceleration: device discovery, capability reporting, and wgpu compute kernels for live effects."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
authors.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
varve-effects = { path = "../varve-effects" }

# Native GPU compute is desktop-only. The capability model (CPU features,
# report types) compiles everywhere so web builds and tests can share it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "vulkan", "metal", "dx12"] }
pollster = "0.4"

[dev-dependencies]
varve-upscale = { path = "../varve-upscale" }
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
