[package]
name = "strata-colour"
description = "Colour-science crate: ICC transforms via tintbox, analytical colour conversion, WASM bindings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
strata-core = { path = "../strata-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tintbox = "0.4"
wasm-bindgen = "0.2"

[features]
default = []
wasm = []

[dev-dependencies]
proptest = "1"

[lints]
workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
