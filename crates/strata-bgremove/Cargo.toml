[package]
name = "strata-bgremove"
description = "Background removal: heuristic non-AI methods and optional ONNX inference for AI-powered matting."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
strata-core = { path = "../strata-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = "0.25"
dirs-next = "2.0"
fastrand = "2.0"

# AI feature requires ONNX Runtime
ort = { version = "2.0.0-rc.12", optional = true, default-features = false, features = ["load-dynamic"] }

[features]
default = []
ai = ["ort"]

[lints]
workspace = true
