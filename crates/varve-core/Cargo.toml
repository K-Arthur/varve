[package]
name = "varve-core"
description = "Core geometry, scene graph primitives, and hit-testing for Varve."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# kurbo: linebender 2D geometry (Point, Rect, Affine, Beziers). The de-facto
# standard, shared with the vello/lyon ecosystem we adopt in task 0.6/0.7.
# no_std-friendly -> compiles to wasm32 unchanged. Research basis: kurbo docs.
kurbo = { version = "0.13", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
