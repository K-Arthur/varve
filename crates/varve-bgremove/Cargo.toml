[package]
name = "varve-bgremove"
description = "Background removal: heuristic non-AI methods and optional ONNX inference for AI-powered matting."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
image = "0.25"
dirs-next = "2.0"

# AI feature requires ONNX Runtime
# Pinned to rc.11: rc.12 has a known upstream regression where the Vitis AI
# EP's `register()` accesses `SessionOptionsAppendExecutionProvider_VitisAI`
# unconditionally under `load-dynamic`, but that OrtApi field is gated behind
# the `api-18` feature (which `load-dynamic` does not enable) — breaks the
# build on Linux x86_64 (our desktop target), not just Android.
# https://github.com/pykeio/ort/issues/547
ort = { version = "=2.0.0-rc.11", optional = true, default-features = false, features = ["load-dynamic"] }
sha2 = "0.11"

[features]
default = []
ai = ["ort"]

[lints]
workspace = true
