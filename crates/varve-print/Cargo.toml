[package]
name = "varve-print"
description = "Print pipeline: font outlining, CMYK via ICC, PDF/X-1a & PDF/X-4 export."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
varve-core = { path = "../varve-core" }
varve-colour = { path = "../varve-colour" }
lopdf = { version = "0.44", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ab_glyph = "0.2"
font-subset = "0.1"
rustybuzz = "0.20"
ttf-parser = "0.25"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
