[package]
name = "strata-wasm"
description = "wasm-bindgen glue for strata-engine (web IR build + hit test)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
strata-bridge = { path = "../strata-bridge" }
strata-core = { path = "../strata-core" }
strata-engine = { path = "../strata-engine" }
wasm-bindgen = "0.2"
serde_json = "1"

[lints]
workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = "-O3"

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
