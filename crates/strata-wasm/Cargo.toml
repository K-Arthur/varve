[package]
name = "strata-wasm"
description = "wasm-bindgen glue for strata-engine (web IR build + hit test)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
strata-bridge = { path = "../strata-bridge" }
strata-core = { path = "../strata-core" }
strata-engine = { path = "../strata-engine" }
strata-trace = { path = "../strata-trace", features = ["wasm"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

[package.metadata.wasm-pack.profile.release]
# wasm-pack's bundled wasm-opt binary in this environment doesn't validate
# bulk-memory ops emitted by the current Rust toolchain (fails with
# "Bulk memory operations require bulk memory [--enable-bulk-memory]").
# Disabled here; `just wasm-build` runs a separate manual wasm-opt pass
# (skipped gracefully if no system wasm-opt is on PATH) instead of relying
# on wasm-pack's bundled one.
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
