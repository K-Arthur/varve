[package]
name = "varve-trace"
description = "Raster-to-vector auto-tracing (Potrace/vtracer-class: contour + centerline)."
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
authors.workspace = true
repository.workspace = true

[features]
default = ["rayon"]
wasm = []

[dependencies]
varve-core = { path = "../varve-core" }
rayon = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.151"
