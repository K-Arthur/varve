packages:
  # apps/web removed 2026-07-12 — was a Next.js scaffold with no meaningful code (task 0.9 deferred indefinitely).
  - "apps/desktop"
  - "apps/website"
  - "packages/*"

overrides:
  # astro-language-server 2.16.13 regressed .json module resolution in
  # `astro check` (Cannot find module 'release-manifest.json'); 2.16.11 is
  # the last good release. Revisit when a fixed release ships.
  "@astrojs/language-server": 2.16.11
  # tauri-service 1.3.0 imports this API, but its published dependency range
  # resolves 2.4.0, where the export is absent. Keep this exact and covered by
  # scripts/desktop/compatibility.test.mjs.
  "@wdio/native-utils": 2.5.0
  # --- Transitive security remediations (2026-10-02) ---
  # Each override pins the audited dependency graph to a patched line. Review
  # the paths again when updating parent packages and remove overrides once
  # the parents provide the fixes themselves.
  # fast-uri advisories affect the ajv/stryker and yaml-language-server chains.
  "fast-uri": 3.1.8
  # qs advisories affect typed-rest-client in the Stryker tool chain.
  "qs": 6.16.0
  # GHSA-5c6j-r48x-rmvq / GHSA-qj8w-gfj5-8c6v: serialize-javascript RCE/DoS
  # in mocha (wdio) worker-pool serializer. 7.x output remains valid for
  # mocha's eval-based deserialization of options objects.
  "serialize-javascript": 7.1.0
  # brace-expansion DoS advisories affect the WDIO/Stryker minimatch chains.
  "brace-expansion@1": 1.1.21
  "brace-expansion@2": 2.1.7
  # GHSA-ggr8-5vv4-36mx: deepmerge-ts stack exhaustion on recursive object
  # graphs. WDIO currently declares ^7, but its usage is compatible with the
  # patched 8.x API. Keep this override until WDIO widens its own range.
  "deepmerge-ts": 8.0.0
  "brace-expansion@5": 5.0.12
  # adm-zip archive allocation/path vulnerabilities affect onnxruntime-node.
  "adm-zip": 0.6.1
  # Patched minor lines for the remaining reported dependency paths.
  "colord": 2.10.0
  "devalue@5": 5.9.4
  "js-yaml@4": 4.3.2
  "svgo@4": 4.1.0
  "ip-address": 10.7.1
  # The upstream parents resolve three supported undici majors. Keep each on
  # its own patched line instead of forcing one major across all consumers.
  "undici@6": 6.29.0
  "undici@7": 7.30.0
  "undici@8": 8.11.2
  # basic-ftp only enters through the local WDIO/Puppeteer tooling graph; the
  # vulnerable 5.x line has no patched release, so use the fixed 6.x line.
  "basic-ftp": 6.2.1
  # GHSA-28wg-ghj8-5hjv / GHSA-2v37-7h3g-55p8: nanoid 3.x indefinite loop in
  # postcss (astro/stylelint chains). postcss@8 override dedupes onto
  # 8.5.26; nanoid pin is belt-and-braces for any other 3.x consumer.
  "nanoid@3": 3.3.18
  "postcss@8": 8.5.26
  # Astro's default Sharp service depends on libheif; keep its optional Sharp
  # dependency on the patched 0.35 line. Sharp install scripts remain blocked.
  "sharp": 0.35.5

# pnpm 11 build-script approval (replaces the removed onlyBuiltDependencies).
# esbuild (used by vitest + biome) ships/verifies its platform binary via
# postinstall; approve it explicitly. strictDepBuilds defaults to true.
allowBuilds:
  edgedriver: true
  esbuild: true
  geckodriver: true
  onnxruntime-node: true
  protobufjs: true
  sharp: false

minimumReleaseAgeExclude:
  - '@testing-library/jest-dom@7.0.1'

patchedDependencies:
  extract-zip@2.0.1: patches/extract-zip@2.0.1.patch
  jsdom@30.0.1: patches/jsdom@30.0.1.patch

# These are narrow, tested compatibility allowances. Madge declares TypeScript
# 5 as an optional peer; the architecture audit was exercised against this
# repository's TypeScript 6 graph, including the large editor graph. Astro's
# Tailwind 3 integration is deprecated and its peer range stops at Astro 5,
# but remains in use to retain Tailwind 3 browser support. Keep both narrow
# allowances explicit and revalidate them when upgrading their consumers.
peerDependencyRules:
  allowedVersions:
    "madge>typescript": "6.0.3"
    "@astrojs/tailwind>astro": "~7.2.10"
