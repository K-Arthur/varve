name: E2E Keyboard Nav

on:
  push:
    branches: [master]
    paths:
      - 'packages/editor/src/Menubar.tsx'
      - 'packages/editor/src/CanvasArea.tsx'
      - 'packages/editor/src/shortcuts/**'
      - 'packages/editor/src/panels/AuditKeyboardNav.tsx'
      - 'packages/ui/src/utils/menuTypeAhead.ts'
      - 'packages/ui/src/components/Menu.tsx'
      - 'tests/e2e/menus/**'
      - 'tests/e2e/canvas/keyboard-nav.spec.ts'
      - 'tests/e2e/helpers/menu-helpers.ts'
      - '.github/workflows/e2e-keyboard-nav.yml'
  pull_request:
    paths:
      - 'packages/editor/src/Menubar.tsx'
      - 'packages/editor/src/CanvasArea.tsx'
      - 'packages/editor/src/shortcuts/**'
      - 'packages/editor/src/panels/AuditKeyboardNav.tsx'
      - 'packages/ui/src/utils/menuTypeAhead.ts'
      - 'packages/ui/src/components/Menu.tsx'
      - 'tests/e2e/menus/**'
      - 'tests/e2e/canvas/keyboard-nav.spec.ts'
      - 'tests/e2e/helpers/menu-helpers.ts'
  schedule:
    - cron: '0 6 * * 1' # Every Monday 06:00 UTC

# Run full matrix weekly; path-filtered on push/PR.

jobs:
  menu-keyboard-nav:
    name: Menu KB nav (${{ matrix.os }} / ${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        browser: [chromium, firefox, webkit]
        include:
          - os: ubuntu-latest
            dev-command: xvfb-run --auto-servernum pnpm --filter @strata/desktop dev
          - os: macos-latest
            dev-command: pnpm --filter @strata/desktop dev
          - os: windows-latest
            dev-command: pnpm --filter @strata/desktop dev
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@a5ac7e51b41094c92402da3b243b9e2b7c2e1d6f
      - uses: pnpm/action-setup@v4.0.0
        with:
          version: 11
      - uses: actions/setup-node@1a4442cda7143948ae1d52f1a60fd880ff95df6a
        with:
          node-version: 26
          cache: pnpm
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify toolchain
        run: just check-env
      - name: Run menu E2E tests
        run: |
          npx playwright test tests/e2e/menus \
            --project=${{ matrix.browser }} \
            --reporter=list
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0bbc538f
        with:
          name: menu-e2e-artifacts-${{ matrix.os }}-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  canvas-keyboard-nav:
    name: Canvas KB nav (${{ matrix.os }} / ${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        browser: [chromium]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@a5ac7e51b41094c92402da3b243b9e2b7c2e1d6f
      - uses: pnpm/action-setup@v4.0.0
        with:
          version: 11
      - uses: actions/setup-node@1a4442cda7143948ae1d52f1a60fd880ff95df6a
        with:
          node-version: 26
          cache: pnpm
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run canvas E2E tests
        run: |
          npx playwright test tests/e2e/canvas/keyboard-nav.spec.ts \
            --project=chromium \
            --reporter=list
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0bbc538f
        with:
          name: canvas-e2e-artifacts-${{ matrix.os }}
          path: test-results/
          retention-days: 7
