name: E2E Keyboard Nav

permissions:
  contents: read
  actions: read
  checks: read

on:
  push:
    branches: [master]
    paths:
      - 'packages/editor/src/Menubar.tsx'
      - 'packages/editor/src/CanvasArea.tsx'
      - 'packages/editor/src/shortcuts/**'
      - 'packages/editor/src/panels/AuditKeyboardNav.tsx'
      - 'packages/ui/src/utils/menuTypeAhead.ts'
      - 'packages/ui/src/components/Menu.tsx'
      - 'tests/e2e/menus/**'
      - 'tests/e2e/canvas/keyboard-nav.spec.ts'
      - 'tests/e2e/helpers/menu-helpers.ts'
      - '.github/workflows/e2e-keyboard-nav.yml'
  pull_request:
    paths:
      - 'packages/editor/src/Menubar.tsx'
      - 'packages/editor/src/CanvasArea.tsx'
      - 'packages/editor/src/shortcuts/**'
      - 'packages/editor/src/panels/AuditKeyboardNav.tsx'
      - 'packages/ui/src/utils/menuTypeAhead.ts'
      - 'packages/ui/src/components/Menu.tsx'
      - 'tests/e2e/menus/**'
      - 'tests/e2e/canvas/keyboard-nav.spec.ts'
      - 'tests/e2e/helpers/menu-helpers.ts'
  schedule:
    - cron: '0 6 * * 1' # Every Monday 06:00 UTC

# Full matrix weekly; path-filtered on push/PR.
#
# On push/PR the matrix collapses to a single Linux/Chromium cell per job
# (2 jobs total instead of 12). The full 3-OS x 3-browser matrix runs on the
# weekly schedule and manual dispatch. This is deliberate queue-pressure
# control: every push to master already fires CI (3-OS) + Build + Package
# (3-OS) + Website Deploy + model workflows; an extra 12 jobs per push is what
# starves the hosted runner pool during Actions incidents (2026-08-06).

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo 'matrix={"os":["ubuntu-latest","macos-latest","windows-latest"],"browser":["chromium","firefox","webkit"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"os":["ubuntu-latest"],"browser":["chromium"]}' >> "$GITHUB_OUTPUT"
          fi

  menu-keyboard-nav:
    name: Menu KB nav (${{ matrix.os }} / ${{ matrix.browser }})
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify toolchain
        run: |
          node --version
          pnpm --version
          test -f pnpm-lock.yaml && echo "lockfile present"
      - name: Run menu E2E tests
        shell: bash
        run: |
          npx playwright test tests/e2e/menus \
            --project=${{ matrix.browser }} \
            --reporter=list
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: menu-e2e-artifacts-${{ matrix.os }}-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
      - name: Automated failure debug
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci-debug.mjs --run-id ${{ github.run_id }} --output ci-debug-report.md || true
      - name: Upload debug report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: menu-e2e-debug-${{ matrix.os }}-${{ matrix.browser }}
          path: ci-debug-report.md
          if-no-files-found: ignore
      - name: Post debug report to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pr-debug-comment.mjs --run-id ${{ github.run_id }} --repo ${{ github.repository }} --report ci-debug-report.md || true

  canvas-keyboard-nav:
    name: Canvas KB nav (${{ matrix.os }} / ${{ matrix.browser }})
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.matrix).os }}
        browser: [chromium]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run canvas E2E tests
        shell: bash
        run: |
          npx playwright test tests/e2e/canvas/keyboard-nav.spec.ts \
            --project=chromium \
            --reporter=list
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: canvas-e2e-artifacts-${{ matrix.os }}
          path: test-results/
          retention-days: 7
      - name: Automated failure debug
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci-debug.mjs --run-id ${{ github.run_id }} --output ci-debug-report.md || true
      - name: Upload debug report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: canvas-e2e-debug-${{ matrix.os }}
          path: ci-debug-report.md
          if-no-files-found: ignore
      - name: Post debug report to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pr-debug-comment.mjs --run-id ${{ github.run_id }} --repo ${{ github.repository }} --report ci-debug-report.md || true
