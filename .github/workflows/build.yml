name: Build + Package

on:
  push:
    branches: [main, master, feat/*]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wasm:
    name: Build WASM engine (base + SIMD)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@a5ac7e51b41094c92402da3b243b9e2b7c2e1d6f
      - uses: dtolnay/rust-toolchain@a2758e4818c2e4f4493a1d255f4662f19b65acf2
      - uses: Swatinem/rust-cache@f74c8cc5f54c0e3f1e043d6a4685b8489aee9c1b
      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi
      - name: wasm build (base + simd)
        run: just wasm-build-all
      - name: Upload wasm artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0bbc538f
        with:
          name: strata-wasm-release
          path: apps/desktop/public/wasm/

  build:
    name: Build (${{ matrix.os }})
    needs: build-wasm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@a5ac7e51b41094c92402da3b243b9e2b7c2e1d6f

      - uses: pnpm/action-setup@v4.0.0
        with:
          version: 11.9.0

      - uses: actions/setup-node@1a4442cda7143948ae1d52f1a60fd880ff95df6a
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@a2758e4818c2e4f4493a1d255f4662f19b65acf2
        with:
          components: rustfmt, clippy

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libfontconfig1-dev libglib2.0-dev libsoup-3.0-dev \
            libgdk-pixbuf2.0-dev libcairo2-dev libpango1.0-dev \
            cmake pkg-config patchelf

      - name: Install macOS Rust targets
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Install Windows Rust target
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@f74c8cc5f54c0e3f1e043d6a4685b8489aee9c1b

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (JS)
        run: pnpm lint

      - name: Lint (Rust)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: JS tests
        run: pnpm test

      - name: Rust tests
        run: cargo test --workspace --all-targets

      - name: Rust tests (desktop)
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --features custom-protocol

      - name: Token gate
        if: runner.os == 'Linux'
        run: pnpm audit:tokens

      - name: Emoji gate
        if: runner.os == 'Linux'
        run: pnpm audit:emoji

      - name: Download wasm artifact
        uses: actions/download-artifact@65a9edc535144f24f5bb5979b6c2cd39a097d35d
        with:
          name: strata-wasm-release
          path: apps/desktop/public/wasm/

      - name: Build frontend
        run: pnpm build
        working-directory: apps/desktop

      - name: Tauri build (release)
        run: pnpm tauri build --ci --features custom-protocol
        working-directory: apps/desktop

      - name: Build test binary (debug + wdio features)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: pnpm tauri build --debug --no-bundle --config src-tauri/tauri.test.conf.json --features wdio,custom-protocol

      - name: Automated failure debug
        if: failure()
        run: node scripts/ci-debug.mjs --run-id ${{ github.run_id }} --output ci-debug-report.md || true

      - name: Upload debug report
        if: failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0bbc538f
        with:
          name: strata-debug-${{ matrix.os }}-${{ github.run_id }}
          path: ci-debug-report.md
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0bbc538f
        with:
          name: strata-${{ matrix.os }}
          path: apps/desktop/src-tauri/target/release/bundle/
          if-no-files-found: warn
