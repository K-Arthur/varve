# Microsoft Store MSIX packaging.
#
# Independent of release.yml. It never drafts, publishes, or replaces GitHub
# Release assets. Dispatch any existing release tag (default: latest published
# release) to package that tagged source — including v0.5.0 — as MSIX.
#
# Partner Center identity is read from repository variables when set. Otherwise
# the package uses the CI test identity and is labeled not Store-submittable.
name: Microsoft Store MSIX

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to package (e.g. v0.5.0). Empty = latest published GitHub release.'
        required: false
        default: ''
        type: string
      sign_mode:
        description: 'unsigned (Store upload) or test-signed (sideload)'
        required: false
        default: 'unsigned'
        type: choice
        options: [unsigned, test-signed]
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

concurrency:
  group: msix-${{ github.event_name == 'workflow_dispatch' && (inputs.tag || 'latest') || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  PNPM_VERSION: '11.9.0'
  NODE_VERSION: '26.10.0'

jobs:
  resolve:
    name: Resolve source tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      sign_mode: ${{ steps.resolve.outputs.sign_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/release/msix/resolve-tag.mjs

      - name: Resolve latest published release
        id: latest
        if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Resolve source tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
          SIGN_MODE: ${{ inputs.sign_mode || 'unsigned' }}
        run: |
          set -euo pipefail
          tag="$(node --input-type=module -e '
            import { assertReleaseTag, resolveMsixSourceTag } from "./scripts/release/msix/resolve-tag.mjs";
            const tag = resolveMsixSourceTag({
              eventName: process.env.EVENT_NAME,
              dispatchTag: process.env.DISPATCH_TAG,
              refName: process.env.REF_NAME,
              latestReleaseTag: process.env.LATEST_TAG,
            });
            process.stdout.write(assertReleaseTag(tag));
          ')"
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sign_mode=${SIGN_MODE}" >> "$GITHUB_OUTPUT"
          echo "Packaging ${tag} as MSIX (${SIGN_MODE}). This does not modify GitHub Release assets."

  package:
    name: Package (${{ matrix.name }})
    needs: resolve
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            arch_slug: x86_64
            rust_target: x86_64-pc-windows-msvc
          - name: windows-aarch64
            os: windows-11-arm
            arch_slug: aarch64
            rust_target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      VARVE_PRIVATE_TEST_CANARY: VARVE_PRIVATE_TEST_CANARY_DO_NOT_SHIP
      VITE_VARVE_ANALYTICS_DOMAIN: 'varve.studio'
      TAURI_TARGET_DIR: apps/desktop/src-tauri/target/${{ matrix.rust_target }}
    steps:
      - name: Checkout tagged application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Checkout current MSIX tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: msix-tooling
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /packaging/msix
            /scripts/release/msix
            /scripts/release/write-updater-config.mjs
            /scripts/release/toolchains/windows-aarch64.cmake
            /scripts/release/toolchains/verify-windows-aarch64.ps1
            /apps/desktop/src-tauri/tauri.microsoftstore.conf.json

      - name: Overlay Store packaging onto the tagged source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packaging scripts/release apps/desktop/src-tauri
          cp -R msix-tooling/packaging/msix packaging/msix
          cp -R msix-tooling/scripts/release/msix scripts/release/msix
          cp msix-tooling/scripts/release/write-updater-config.mjs scripts/release/write-updater-config.mjs
          cp msix-tooling/apps/desktop/src-tauri/tauri.microsoftstore.conf.json \
            apps/desktop/src-tauri/tauri.microsoftstore.conf.json

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Verify native Windows ARM64 Clang toolchain
        id: arm64-compiler
        if: matrix.name == 'windows-aarch64'
        shell: pwsh
        run: ./msix-tooling/scripts/release/toolchains/verify-windows-aarch64.ps1

      - name: Verify native Rust linker from build shell
        if: matrix.name == 'windows-aarch64'
        shell: bash
        env:
          ARM64_COMPILER_PROBE: ${{ steps.arm64-compiler.outputs.probe_dir }}
        run: cargo run --offline --locked --release
          --manifest-path "$ARM64_COMPILER_PROBE/rust/Cargo.toml"

      - name: Add Rust target
        run: rustup target add ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: msix-${{ matrix.name }}-${{ needs.resolve.outputs.tag }}
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
          cache-on-failure: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST WindowsSDKVersion VCToolsInstallDir VARVE_WINDOWS_ARM64_CLANG

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Prepare inactive updater configuration
        shell: bash
        run: |
          node scripts/release/write-updater-config.mjs \
            --channel stable \
            --mode manual-only \
            --output apps/desktop/src-tauri/tauri.update.channel.json

      - name: Tauri build (Store, no NSIS bundle)
        shell: bash
        env:
          NO_STRIP: '1'
          VARVE_UPDATER_MODE: manual-only
          VARVE_DISTRIBUTION: msix
          VARVE_UPDATE_CHANNEL: stable
        run: |
          pnpm tauri build --target ${{ matrix.rust_target }} --no-bundle --ci \
            --config "${GITHUB_WORKSPACE}/apps/desktop/src-tauri/tauri.update.channel.json" \
            --config "${GITHUB_WORKSPACE}/apps/desktop/src-tauri/tauri.microsoftstore.conf.json"
        working-directory: apps/desktop

      - name: Stage MSIX layout
        shell: bash
        env:
          VARVE_STORE_PACKAGE_NAME: ${{ vars.VARVE_STORE_PACKAGE_NAME }}
          VARVE_STORE_PUBLISHER_CN: ${{ vars.VARVE_STORE_PUBLISHER_CN }}
          VARVE_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.VARVE_STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          node scripts/release/msix/stage.mjs \
            --release-dir "${TAURI_TARGET_DIR}/release" \
            --output-dir dist/msix/${{ matrix.arch_slug }}/layout \
            --version '${{ needs.resolve.outputs.version }}' \
            --architecture ${{ matrix.arch_slug }} \
            --sign-mode '${{ needs.resolve.outputs.sign_mode }}'

      - name: Pack MSIX
        shell: pwsh
        run: |
          ./scripts/release/msix/pack.ps1 `
            -LayoutDir dist/msix/${{ matrix.arch_slug }}/layout `
            -OutputMsix dist/msix/Varve-${{ needs.resolve.outputs.version }}-windows-${{ matrix.arch_slug }}.msix `
            -SignMode '${{ needs.resolve.outputs.sign_mode }}'

      - name: Write package notes
        shell: bash
        run: |
          cat > dist/msix/PACKAGE-NOTES.txt <<EOF
          Source tag: ${{ needs.resolve.outputs.tag }}
          Sign mode: ${{ needs.resolve.outputs.sign_mode }}
          This artifact is a workflow upload only. It is not attached to the
          GitHub Release and does not replace the unsigned NSIS .exe.
          Only a Microsoft Store install is re-signed by Microsoft after
          certification. Direct .exe downloads remain unsigned.
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-msix-${{ needs.resolve.outputs.tag }}-${{ matrix.name }}
          path: |
            dist/msix/*.msix
            dist/msix/PACKAGE-NOTES.txt
            dist/msix/${{ matrix.arch_slug }}/layout/msix-identity.json
            dist/msix/wack-report.xml
          if-no-files-found: error
          retention-days: 30

  bundle:
    name: Bundle architectures
    needs: [resolve, package]
    if: success()
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout packer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/release/msix/pack.ps1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: downloaded

      - name: Create msixbundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/msix/bundle | Out-Null
          Get-ChildItem -Recurse downloaded -Filter *.msix | ForEach-Object {
            Copy-Item -Force $_.FullName (Join-Path 'dist/msix/bundle' $_.Name)
          }
          $packages = Get-ChildItem dist/msix/bundle -Filter *.msix
          if ($packages.Count -lt 1) { throw 'No MSIX packages downloaded for the bundle' }
          ./scripts/release/msix/pack.ps1 `
            -BundleOnly `
            -BundleDir dist/msix/bundle `
            -OutputBundle dist/msix/Varve-${{ needs.resolve.outputs.version }}-windows.msixbundle

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-msixbundle-${{ needs.resolve.outputs.tag }}
          path: dist/msix/*.msixbundle
          if-no-files-found: warn
          retention-days: 30
