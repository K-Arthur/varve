name: Model Supply Chain Validation

permissions:
  contents: read

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/desktop/public/models/**'
      - 'packages/engine/src/backgroundRemoval/modelContract.ts'
      - 'packages/engine/src/inference/types.ts'
      - 'packages/engine/src/inference/manifest.ts'
      - 'packages/engine/src/inference/modelCatalog.ts'
      - '.github/workflows/model-validation.yml'
  pull_request:
    paths:
      - 'apps/desktop/public/models/**'
      - 'packages/engine/src/backgroundRemoval/modelContract.ts'
      - 'packages/engine/src/inference/types.ts'
  schedule:
    # Weekly full validation including downloaded models
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      full_validation:
        description: 'Run full validation with model downloads'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast PR gate: manifest schema + contract structure ───────────────────
  manifest-contract-verify:
    name: Manifest & contract verification
    # 10 -> 25 min: on 2026-08-06 the job exceeded its 10-min budget while
    # GitHub's action-download service returned "Service Unavailable" and
    # "Failed to resolve action download info" (Actions incident). The job is
    # setup-heavy (checkout + pnpm + node + install) and needs headroom for
    # slow action resolution during incidents.
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.9.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate manifest v3 schema
        run: node scripts/models/validate-manifest.mjs

      - name: Verify bundled model files exist
        run: node scripts/models/validate-manifest.mjs --check-files

      - name: Run contract integrity tests
        run: pnpm exec vitest run packages/engine/src/inference/__tests__/manifestContracts.test.ts packages/engine/src/inference/__tests__/catalogTrust.test.ts packages/engine/src/inference/__tests__/corpusValidation.test.ts --reporter=verbose

  # ── ONNX graph inspection (scheduled or dispatch only) ───────────────────
  graph-inspection:
    name: ONNX graph inspection
    needs: [manifest-contract-verify]
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install ONNX tools
        run: pip install onnx onnxruntime

      - name: Verify bundled model graphs
        run: |
          python3 scripts/verify-model-contracts.py --all --output graph-inspection-report.json

      - name: Upload graph inspection report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: graph-inspection-report
          path: graph-inspection-report.json

  # ── Corpus validation ────────────────────────────────────────────────────
  corpus-validate:
    name: Corpus metadata validation
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true

      - name: Validate corpus manifest
        run: |
          node -e "
          const fs = require('fs');
          const corpus = JSON.parse(fs.readFileSync('tests/fixtures/bg-removal-corpus/corpus.json', 'utf-8'));
          
          // Check version
          if (corpus.version !== 2) {
            console.error('ERROR: corpus version must be 2, got', corpus.version);
            process.exit(1);
          }
          
          // Check mask classification definitions exist
          if (!corpus.maskClassification || !corpus.maskClassification.groundTruth) {
            console.error('ERROR: corpus missing maskClassification definitions');
            process.exit(1);
          }
          
          // Check metrics configuration
          if (!corpus.metrics || !corpus.metrics.perCategory) {
            console.error('ERROR: corpus missing metrics configuration');
            process.exit(1);
          }
          
          // Check every image has required fields
          let errors = 0;
          const validClassifications = ['groundTruth', 'humanReviewed', 'referenceModel', 'synthetic'];
          for (const image of corpus.images) {
            if (!image.id || !image.file || !image.category) {
              console.error('ERROR: image missing required fields:', image.id);
              errors++;
            }
            if (!validClassifications.includes(image.maskClassification)) {
              console.error('ERROR:', image.id, 'invalid maskClassification:', image.maskClassification);
              errors++;
            }
            if (image.maskClassification === 'groundTruth' && !image.reviewer) {
              console.error('ERROR:', image.id, 'groundTruth mask has no reviewer');
              errors++;
            }
            if (image.maskClassification === 'referenceModel' && !image.maskProvenance?.modelId) {
              console.error('ERROR:', image.id, 'referenceModel mask has no modelId');
              errors++;
            }
          }
          
          if (errors > 0) {
            console.error(errors, 'corpus error(s)');
            process.exit(1);
          }
          console.log('Corpus manifest OK:', corpus.images.length, 'images,', corpus.syntheticFixtures?.length ?? 0, 'synthetic fixtures');
          "

      - name: Verify fixture files exist
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const corpus = JSON.parse(fs.readFileSync('tests/fixtures/bg-removal-corpus/corpus.json', 'utf-8'));
          
          let errors = 0;
          for (const image of corpus.images) {
            const filePath = path.join(corpus.corpusDir, image.file);
            if (!fs.existsSync(filePath)) {
              console.error('ERROR: fixture not found:', filePath);
              errors++;
            }
          }
          
          if (errors > 0) {
            console.error(errors, 'fixture file(s) missing');
            process.exit(1);
          }
          console.log('All fixture files present');
          "
