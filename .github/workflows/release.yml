# Varve release pipeline.
#
# Replaces publish.yml, which could never reach its `release` job: that job
# declared `needs: [bundle, aur-validate]`, and `aur-validate` chowns `dist/aur`
# — a directory that does not exist and is gitignored. See
# docs/release/release-readiness-audit.md RB-2.
#
# Design rules this workflow enforces:
#   - A tag never releases anything by itself. It builds a DRAFT; a human
#     publishes.
#   - The tag and the application version must agree before anything is built.
#   - Signing credentials are validated in `signing-preflight` BEFORE any
#     platform build starts. When signing is required, missing credentials fail
#     there; permitted unsigned builds retain truthful labels.
#   - An artifact is never labelled signed unless the post-build cryptographic
#     verification report (verify-windows-signature.ps1 /
#     verify-macos-signature.sh) confirms it on the actual bytes.
#   - `verify` is the fail-closed trust gate: it merges the per-platform
#     reports into the release manifest, enforces the channel policy, and only
#     THEN generates the final checksums and attests the final bytes.
#   - Every artifact is renamed to one predictable scheme, hashed, and verified
#     against the bytes that will actually be uploaded.
#
# Third-party actions are pinned to full commit SHAs (enforced by
# scripts/pin-github-actions.mjs). To update one, run `just pin-actions-fix`.
name: Release

on:
  push:
    tags:
      # Stable and prerelease tags both match; the channel is derived from the
      # tag shape in the `preflight` job rather than from a separate trigger, so
      # a prerelease can never overwrite a stable release by accident.
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.1.0)'
        required: true
      platforms:
        description: 'Which platforms to build'
        required: true
        # A manually dispatched release must be complete by default. Linux-only
        # rehearsals remain available as an explicit opt-in.
        default: 'all'
        type: choice
        options: [linux, linux-windows, all]
      publish:
        description: 'Explicitly publish the existing draft for this tag (never auto-runs)'
        required: false
        default: 'no'
        type: choice
        # Quote these values: YAML 1.1 treats bare `no`/`yes` as booleans,
        # which makes GitHub reject the documented `publish=yes` dispatch.
        options: ['no', 'yes']
      # Installer-size gate override. The gate compares the NSIS installer
      # against scripts/release/installer-size-baseline.json and blocks
      # unexplained growth (warn 1.2x / block 1.35x of expected). Provide a
      # reason here ONLY for intentional growth (e.g. bundling a new model or
      # changing the WebView2 install mode); update the baseline in the same
      # commit that ships the change. Tag-triggered releases default to no
      # override, so growth has to be accepted deliberately per release.
      size_gate_override:
        description: 'Reason to accept an installer size above the hard threshold (leave empty to enforce)'
        required: false
        default: ''
        type: string

concurrency:
  # Never cancel a release build in flight — a half-uploaded draft is worse than
  # a slow one.
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  checks: read

env:
  PNPM_VERSION: '11.9.0'
  NODE_VERSION: '26'

jobs:
  # ── 1. Preflight: refuse to build the wrong thing ───────────────────────────
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      channel: ${{ steps.resolve.outputs.channel }}
      build_windows: ${{ steps.resolve.outputs.build_windows }}
      build_macos: ${{ steps.resolve.outputs.build_macos }}
      tag_sha: ${{ steps.certification.outputs.tag_sha }}
      policy_hash: ${{ steps.certification.outputs.policy_hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Full history: the provenance gate below runs merge-base against
          # the default branch, which needs real ancestry (a depth-1 clone
          # would reject every valid release tag).
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Resolve tag, version and channel
        id: resolve
        env:
          RELEASE_TAG_INPUT: ${{ inputs.tag || github.ref_name }}
          RELEASE_PLATFORMS_INPUT: ${{ inputs.platforms || 'all' }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG_INPUT"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '${TAG}' is not a valid vMAJOR.MINOR.PATCH tag."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # Anything with a hyphen after the patch number is a prerelease
          # (v0.1.0-alpha.1). Stable tags are bare (v0.1.0).
          if [[ "${TAG}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "channel=${TAG#*-}" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi

          VERSION="$(node scripts/release/version.mjs get)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          PLATFORMS="$RELEASE_PLATFORMS_INPUT"
          BUILD_WINDOWS=true
          BUILD_MACOS=true
          if [[ "${PLATFORMS}" == "linux" ]]; then
            BUILD_WINDOWS=false
            BUILD_MACOS=false
          elif [[ "${PLATFORMS}" == "linux-windows" ]]; then
            BUILD_MACOS=false
          fi
          echo "build_windows=${BUILD_WINDOWS}" >> "$GITHUB_OUTPUT"
          echo "build_macos=${BUILD_MACOS}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches application version
        # The whole point of the gate: a v0.1.0 tag must not produce installers
        # that identify themselves as 0.0.0 (audit RB-3).
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: node scripts/release/version.mjs verify "$RELEASE_TAG"

      - name: Verify tag points at an approved source commit
        # A version-looking tag is not sufficient to ship code. The tagged
        # commit must be reachable from the protected default branch; a
        # workflow_dispatch input can name any existing tag, and without this
        # gate it could release a commit that was never part of the default
        # branch history. Fail closed.
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'master' }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          TAG_COMMIT="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          BASE_COMMIT="$(git rev-parse "origin/${DEFAULT_BRANCH}^{commit}")"
          if ! git merge-base --is-ancestor "${TAG_COMMIT}" "${BASE_COMMIT}"; then
            echo "::error::Tag ${RELEASE_TAG} points at commit ${TAG_COMMIT}, which is not reachable"
            echo "from the default branch (${DEFAULT_BRANCH} at ${BASE_COMMIT})."
            echo "Release tags must point at a commit in the protected default branch history."
            exit 1
          fi
          echo "Tag ${RELEASE_TAG} (${TAG_COMMIT}) is reachable from ${DEFAULT_BRANCH} — provenance OK."

      - name: Verify changelog has an entry for this version
        # Uses the same extractor that generates the notes, so the gate cannot
        # pass on something the generator would choke on. A plain grep matched
        # the commented-out `## [0.1.0]` template at the bottom of the file and
        # would have shipped bare "### Added" headings — and a stray "-->" — as
        # the public release notes.
        env:
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          if [[ ! -f CHANGELOG.md ]]; then
            echo "::error::CHANGELOG.md is missing. Release notes are generated from it."
            exit 1
          fi
          if ! node scripts/release/release-notes.mjs --check "$RELEASE_VERSION"; then
            echo "::error::CHANGELOG.md has no usable '## [${RELEASE_VERSION}]' section."
            echo "Add one before tagging — release notes are generated from the changelog,"
            echo "not from commit messages."
            exit 1
          fi

      # Recovery tooling belongs to this immutable workflow revision. Product
      # bytes and the certification policy below still come from the tag.
      # This lets a manual master dispatch repair orchestration without moving
      # an already-created release tag or using its broken verifier again.
      - name: Check out workflow certification tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tooling
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/release/certification.mjs
            /scripts/release/verify-certification.mjs
            /scripts/quality/validation-policy.mjs

      # This is intentionally before pnpm/Rust setup and before any platform
      # build. A tag is not a release candidate: the exact tag commit must have
      # both required remote certifications and the matching policy hash.
      - name: Verify exact-SHA integration and release-candidate certification
        id: certification
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          TAG_SHA="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          POLICY_HASH="$(node -e "import('./scripts/quality/validation-policy.mjs').then(({computePolicyHash}) => process.stdout.write(computePolicyHash()))")"
          echo "tag_sha=${TAG_SHA}" >> "$GITHUB_OUTPUT"
          echo "policy_hash=${POLICY_HASH}" >> "$GITHUB_OUTPUT"
          node release-tooling/scripts/release/verify-certification.mjs --sha "${TAG_SHA}" --repo "${GITHUB_REPOSITORY}" --policy-hash "${POLICY_HASH}"

  # ── 2. Certified-source gate ────────────────────────────────────────────────
  gate:
    name: Certified source gate
    needs: preflight
    # A publish-only dispatch operates on an already verified draft. Keep the
    # expensive build graph out of that path; tag pushes and normal build
    # dispatches still run the complete release validation.
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish != 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/release/certification.mjs
            /scripts/release/verify-certification.mjs
            /scripts/quality/validation-policy.mjs
      - name: Recheck exact certification identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/release/verify-certification.mjs \
            --sha "${{ needs.preflight.outputs.tag_sha }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --policy-hash "${{ needs.preflight.outputs.policy_hash }}"

  # ── 2b. Signing preflight: validate credentials BEFORE any build ────────────
  # The fail-closed principle, enforced before a single platform compiles:
  # a stable release (or any release with RELEASE_EXPECT_SIGNED=true) whose
  # signing credentials are missing stops HERE, not after packaging.
  # Only PRESENCE BOOLEANS reach this job — secret values never enter it.
  signing-preflight:
    name: Signing preflight
    needs: preflight
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish != 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      windows_mode: ${{ steps.policy.outputs.windows_mode }}
      macos_mode: ${{ steps.policy.outputs.macos_mode }}
      signing_required: ${{ steps.policy.outputs.signing_required }}
      updater_mode: ${{ steps.policy.outputs.updater_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.tag }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/release/resolve-signing-policy.mjs
            /scripts/release/signing-policy.mjs
            /scripts/release/targets.mjs

      - name: Resolve signing policy (presence booleans only)
        id: policy
        shell: bash
        env:
          CHANNEL: ${{ needs.preflight.outputs.channel }}
          EXPECT_SIGNED: ${{ vars.RELEASE_EXPECT_SIGNED }}
          PLATFORMS: >-
            linux${{ needs.preflight.outputs.build_windows == 'true' && ' windows' || '' }}${{ needs.preflight.outputs.build_macos == 'true' && ' macos' || '' }}
          P_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          P_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          P_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
          P_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
          P_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
          P_APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 != '' }}
          P_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          P_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD != '' }}
          P_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          P_AZURE_SIGNING_CLIENT_ID: ${{ secrets.AZURE_SIGNING_CLIENT_ID != '' }}
          P_AZURE_SIGNING_CLIENT_SECRET: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET != '' }}
          P_AZURE_SIGNING_TENANT_ID: ${{ secrets.AZURE_SIGNING_TENANT_ID != '' }}
          P_AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
          P_AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE != '' }}
          P_AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT != '' }}
          # Tauri updater signing is a separate trust layer from platform
          # signing. Only its presence boolean reaches the policy resolver.
          P_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          POLICY="$(node scripts/release/resolve-signing-policy.mjs)"
          echo "policy=${POLICY}"
          echo "windows_mode=$(echo "${POLICY}" | node -e "process.stdin.on('data',d=>{const p=JSON.parse(d);process.stdout.write(p.windows)})")" >> "$GITHUB_OUTPUT"
          echo "macos_mode=$(echo "${POLICY}" | node -e "process.stdin.on('data',d=>{const p=JSON.parse(d);process.stdout.write(p.macos)})")" >> "$GITHUB_OUTPUT"
          W="$(echo "${POLICY}" | node -e "process.stdin.on('data',d=>{const p=JSON.parse(d);process.stdout.write(String(p.windows==='signed'||p.macos==='signed'))})")"
          echo "signing_required=${W}" >> "$GITHUB_OUTPUT"
          if [[ "${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}" == "true" ]]; then
            echo "updater_mode=signed" >> "$GITHUB_OUTPUT"
          else
            echo "updater_mode=manual-only" >> "$GITHUB_OUTPUT"
          fi

      - name: Report policy outcome
        shell: bash
        run: |
          {
            echo "### Signing policy"
            echo ""
            echo "- Windows: **${{ steps.policy.outputs.windows_mode }}**"
            echo "- macOS: **${{ steps.policy.outputs.macos_mode }}**"
            echo "- Channel: ${{ needs.preflight.outputs.channel }}"
            echo "- RELEASE_EXPECT_SIGNED: ${{ vars.RELEASE_EXPECT_SIGNED || '(unset)' }}"
            echo "- Updater: **${{ steps.policy.outputs.updater_mode }}**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record manual-update contingency
        shell: bash
        env:
          TAURI_KEY_PRESENT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [[ "${TAURI_KEY_PRESENT}" != "true" ]]; then
            echo "::warning::Updater signing key is absent; publishing manual-download installers without an updater feed."
            echo "Platform signedness remains independently governed by RELEASE_EXPECT_SIGNED."
          else
            echo "Tauri updater signing key present (value never printed)."
          fi

  # ── 3. Platform bundles on native runners ───────────────────────────────────
  bundle:
    name: Bundle (${{ matrix.name }})
    needs: [preflight, gate, signing-preflight]
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish != 'yes'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          # ubuntu-22.04, NOT ubuntu-latest. This is the whole ballgame for Linux
          # compatibility: a binary inherits the glibc symbol versions of the
          # machine that linked it, and glibc is forward- but not
          # backward-compatible.
          #
          # Measured against a real build (podman, ubuntu:22.04):
          #   built on CachyOS (glibc 2.44) -> requires GLIBC_2.39 -> refuses to
          #   exec on Ubuntu 22.04 with "version `GLIBC_2.39' not found".
          #
          # ubuntu-latest is 24.04 (glibc 2.39), so building there would produce
          # exactly the same floor and silently exclude Ubuntu 22.04 LTS,
          # Debian 12 and Fedora 38 — while the docs claimed 22.04 support.
          # Building on 22.04 sets the floor at glibc 2.35 and those all work.
          - name: linux-x86_64
            os: ubuntu-22.04
            os_slug: linux
            arch_slug: x86_64
            rust_target: x86_64-unknown-linux-gnu
            executable: varve-desktop
            bundles: appimage,deb,rpm
            enabled: true
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            os_slug: linux
            arch_slug: aarch64
            rust_target: aarch64-unknown-linux-gnu
            executable: varve-desktop
            # AppImage cannot be cross-compiled by linuxdeploy; this must stay
            # on a native ARM64 runner rather than being moved to QEMU.
            bundles: appimage,deb,rpm
            enabled: true
          - name: windows-x86_64
            os: windows-latest
            os_slug: windows
            arch_slug: x86_64
            rust_target: x86_64-pc-windows-msvc
            executable: varve-desktop.exe
            bundles: nsis
            enabled: ${{ needs.preflight.outputs.build_windows == 'true' }}
          - name: windows-aarch64
            os: windows-11-arm
            os_slug: windows
            arch_slug: aarch64
            rust_target: aarch64-pc-windows-msvc
            executable: varve-desktop.exe
            # Tauri's NSIS bootstrapper is x86 and runs under emulation, but
            # the installed Varve executable is native ARM64.
            bundles: nsis
            enabled: ${{ needs.preflight.outputs.build_windows == 'true' }}
          - name: macos-aarch64
            os: macos-latest
            os_slug: macos
            arch_slug: aarch64
            rust_target: aarch64-apple-darwin
            executable: varve-desktop
            # ARM64 only, not universal: the bundled ONNX Runtime dylib has no
            # macOS Intel build (scripts/fetch-onnxruntime.mjs PLATFORMS), so a
            # "universal" DMG would be half-degraded. Audit H-3.
            bundles: app,dmg
            enabled: ${{ needs.preflight.outputs.build_macos == 'true' }}
    runs-on: ${{ matrix.os }}
    env:
      # Public build-time configuration. App usage/diagnostics consent remains
      # unknown until the user enables each category in Settings.
      # Trust-boundary canary: present on the frontend build steps, then
      # asserted absent from the final dist (see
      # docs/security/trust-boundaries.md §Canary tests). Benign value with
      # no credential meaning.
      VARVE_PRIVATE_TEST_CANARY: VARVE_PRIVATE_TEST_CANARY_DO_NOT_SHIP
      VITE_VARVE_ANALYTICS_DOMAIN: 'varve.studio'
      TAURI_TARGET_DIR: apps/desktop/src-tauri/target/${{ matrix.rust_target }}
      TAURI_BUNDLE_DIR: apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: matrix.enabled
        with:
          # Bundled models (u2netp.onnx, realesr-general-x4v3.onnx) are
          # committed directly, not Git LFS (LFS was retired 2026-08-20 —
          # see .gitattributes — after the 980 MB ddcolor source exhausted
          # the free-tier LFS bandwidth quota), so a normal checkout gets
          # real weights. The large on-demand models (ddcolor 980 MB,
          # ddcolor-tiny 220 MB, font-classify 64 MB) are downloaded at
          # runtime and never touched here. The pointer guard below still
          # fails the build loudly if a stray LFS pointer ever gets
          # committed instead of real content.
          ref: ${{ needs.preflight.outputs.tag }}

      - name: Verify no bundled asset is a Git LFS pointer
        if: matrix.enabled
        run: node scripts/release/check-bundled-assets.mjs

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        if: matrix.enabled
        with:
          toolchain: 1.97.1

      - name: Install Linux system deps
        if: matrix.enabled && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libfontconfig1-dev libglib2.0-dev libsoup-3.0-dev \
            libgdk-pixbuf2.0-dev libcairo2-dev libpango1.0-dev \
            cmake pkg-config patchelf \
            squashfs-tools xdg-utils

      - name: Add Rust target
        if: matrix.enabled
        run: rustup target add ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: matrix.enabled
        with:
          key: bundle-${{ matrix.name }}-${{ needs.preflight.outputs.tag }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        if: matrix.enabled
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: matrix.enabled
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        if: matrix.enabled

      - name: Build frontend
        if: matrix.enabled
        run: pnpm build
        working-directory: apps/desktop

      - name: Verify built dist has no LFS pointers
        if: matrix.enabled
        run: node scripts/release/check-bundled-assets.mjs --dist

      # tauri.conf.json bundles onnxruntime-libs/** wholesale. A CI runner only
      # fetches its own platform, so this is usually a no-op here — but it makes
      # the bundle contents independent of what happens to be staged, which is
      # what stops a 74 MB .deb from carrying 53.9 MB of macOS and Windows
      # libraries the way a local build did.
      - name: Fetch ONNX Runtime for target platform
        if: matrix.enabled
        run: node scripts/fetch-onnxruntime.mjs

      - name: Prune foreign ONNX runtimes
        if: matrix.enabled
        run: node scripts/release/prune-foreign-runtimes.mjs

      # ── macOS: import the Developer ID certificate into a temp keychain ──
      # Only runs when the signing preflight resolved macos -> signed. The
      # temporary keychain dies with the runner; nothing is uploaded.
      # NOTE: the identity is matched exactly (APPLE_SIGNING_IDENTITY), never
      # "the first codesigning identity in the keychain" — a wrong certificate
      # type (e.g. Apple Development) must fail loudly here.
      - name: Import Apple Developer ID certificate (temporary keychain)
        if: matrix.enabled && runner.os == 'macOS' && needs.signing-preflight.outputs.macos_mode == 'signed'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "${APPLE_CERTIFICATE}" | base64 --decode > /tmp/apple-certificate.p12
          security create-keychain -p "${KEYCHAIN_PASSWORD}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import /tmp/apple-certificate.p12 -k build.keychain \
            -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASSWORD}" build.keychain
          rm -f /tmp/apple-certificate.p12
          IDENTITIES="$(security find-identity -v -p codesigning build.keychain)"
          echo "${IDENTITIES}"
          if ! echo "${IDENTITIES}" | grep -q "${APPLE_SIGNING_IDENTITY}"; then
            echo "::error::APPLE_SIGNING_IDENTITY not found in the temporary keychain."
            echo "Expected: ${APPLE_SIGNING_IDENTITY}"
            echo "This is usually a wrong certificate type (Developer ID Application is required for"
            echo "direct distribution; Apple Development / Apple Distribution will not work)."
            exit 1
          fi
          if ! echo "${APPLE_SIGNING_IDENTITY}" | grep -q '^Developer ID Application:'; then
            echo "::error::APPLE_SIGNING_IDENTITY must start with 'Developer ID Application:' —"
            echo "direct DMG distribution cannot use Apple Development or Apple Distribution identities."
            exit 1
          fi

      # ── Windows: prepare the Artifact Signing sign command ──────────────
      # Tauri runs bundle.windows.signCommand against the NSIS installer with
      # the credentials in the process environment. The command itself contains
      # NO secrets (endpoint/account/profile are non-secret configuration), so
      # it is generated in CI from repository variables and merged at build time
      # via `--config`. It is never committed (see .gitignore).
      - name: Prepare Windows signing configuration
        if: matrix.enabled && runner.os == 'Windows' && needs.signing-preflight.outputs.windows_mode == 'signed'
        shell: bash
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          set -euo pipefail
          cat > apps/desktop/src-tauri/tauri.signing.windows.json <<EOF
          {
            "bundle": {
              "windows": {
                "signCommand": "artifact-signing-cli -e \"${AZURE_SIGNING_ENDPOINT}\" -a \"${AZURE_SIGNING_ACCOUNT}\" -c \"${AZURE_SIGNING_PROFILE}\" -d \"Varve installer\" %1"
              }
            }
          }
          EOF

      - name: Install artifact-signing-cli (crates.io, pinned)
        if: matrix.enabled && runner.os == 'Windows' && needs.signing-preflight.outputs.windows_mode == 'signed'
        run: cargo install artifact-signing-cli --version 0.11.0 --locked

      # The App Store Connect API key (.p8) is decoded to a file BEFORE the
      # build so APPLE_API_KEY_PATH resolves when Tauri notarizes.
      - name: Write App Store Connect API key file
        if: matrix.enabled && runner.os == 'macOS' && needs.signing-preflight.outputs.macos_mode == 'signed'
        shell: bash
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          echo "${APPLE_API_KEY_P8_BASE64}" | base64 --decode > /tmp/varve-apple-api-key.p8
          chmod 600 /tmp/varve-apple-api-key.p8

      - name: Prepare updater channel configuration
        if: matrix.enabled
        shell: bash
        env:
          CHANNEL: ${{ needs.preflight.outputs.channel }}
          UPDATER_MODE: ${{ needs.signing-preflight.outputs.updater_mode }}
        run: |
          node scripts/release/write-updater-config.mjs \
            --channel "${CHANNEL}" \
            --mode "${UPDATER_MODE}" \
            --output apps/desktop/src-tauri/tauri.update.channel.json

      - name: Tauri build (signed platforms)
        if: matrix.enabled && (needs.signing-preflight.outputs.macos_mode == 'signed' || needs.signing-preflight.outputs.windows_mode == 'signed')
        shell: bash
        env:
          # Signing credentials are scoped to THIS step only — nothing is
          # persisted through $GITHUB_ENV, so no later step (SBOM, checksums,
          # artifact upload, failure diagnostics) can observe them.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: /tmp/varve-apple-api-key.p8
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
          # This step legitimately holds signing credentials in the process
          # environment (Tauri re-runs the frontend build via beforeBuildCommand).
          # The client-env guard yields for the signing family ONLY with this
          # flag set — it may appear in no other workflow (enforced by
          # scripts/security/workflow-policy.mjs), and the resulting dist is
          # re-scanned by the artifact scan step below.
          VARVE_SIGNING_STEP_ALLOWED: '1'
          NO_STRIP: '1'
          VARVE_UPDATER_MODE: ${{ needs.signing-preflight.outputs.updater_mode }}
          VARVE_UPDATE_CHANNEL: ${{ needs.preflight.outputs.channel }}
        run: |
          TAURI_EXTRA_ARGS="--config ${{ github.workspace }}/apps/desktop/src-tauri/tauri.update.channel.json"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            TAURI_EXTRA_ARGS+=" --config ${{ github.workspace }}/apps/desktop/src-tauri/tauri.signing.windows.json"
          fi
          pnpm tauri build --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }} --ci ${TAURI_EXTRA_ARGS}
        working-directory: apps/desktop

      # Platform-unsigned builds still need the updater private key when the
      # updater channel is signed. Platform signing and updater signing are
      # separate trust layers: an unsigned Linux/Windows/macOS installer may
      # still carry a verified Tauri updater signature. Keep OS certificate
      # variables out of this step — Tauri treats a set APPLE_CERTIFICATE as a
      # certificate to import, and an empty value would abort the macOS bundle
      # (SecKeychainItemImport).
      - name: Tauri build (unsigned platforms with signed updater)
        if: matrix.enabled && needs.signing-preflight.outputs.macos_mode != 'signed' && needs.signing-preflight.outputs.windows_mode != 'signed' && needs.signing-preflight.outputs.updater_mode == 'signed'
        shell: bash
        env:
          # linuxdeploy bundles an old binutils `strip` that cannot parse the
          # SHT_RELR (.relr.dyn) sections modern toolchains emit, and aborts the
          # whole AppImage build with only "failed to run linuxdeploy" to show
          # for it. Harmless to set everywhere: the Varve binary is stripped by
          # [profile.release] strip = true, and distro libraries ship stripped.
          NO_STRIP: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The updater key is needed by Tauri's beforeBuildCommand, which
          # rebuilds the frontend in this process. The guard permits this
          # exact signing family only for this short-lived build step, and the
          # resulting dist is scanned again before collection.
          VARVE_SIGNING_STEP_ALLOWED: '1'
          VARVE_UPDATER_MODE: ${{ needs.signing-preflight.outputs.updater_mode }}
          VARVE_UPDATE_CHANNEL: ${{ needs.preflight.outputs.channel }}
        run: |
          TAURI_EXTRA_ARGS="--config ${{ github.workspace }}/apps/desktop/src-tauri/tauri.update.channel.json"
          pnpm tauri build --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }} --ci ${TAURI_EXTRA_ARGS}
        working-directory: apps/desktop

      # With no updater key, write the schema-valid inactive updater config and
      # build a genuinely manual-download artifact. No signing material is
      # present in this step at all.
      - name: Tauri build (unsigned platforms, manual updates)
        if: matrix.enabled && needs.signing-preflight.outputs.macos_mode != 'signed' && needs.signing-preflight.outputs.windows_mode != 'signed' && needs.signing-preflight.outputs.updater_mode != 'signed'
        shell: bash
        env:
          NO_STRIP: '1'
          VARVE_UPDATER_MODE: ${{ needs.signing-preflight.outputs.updater_mode }}
          VARVE_UPDATE_CHANNEL: ${{ needs.preflight.outputs.channel }}
        run: |
          TAURI_EXTRA_ARGS="--config ${{ github.workspace }}/apps/desktop/src-tauri/tauri.update.channel.json"
          pnpm tauri build --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }} --ci ${TAURI_EXTRA_ARGS}
        working-directory: apps/desktop

      # ── Collect, rename, checksum, SBOM ────────────────────────────────
      # The frontend dist embedded in the bundles was last produced by the
      # Tauri build step above (beforeBuildCommand re-runs `pnpm build`).
      # This is the definitive client artifact: it must never contain private
      # configuration or the CI canary. Scan it before collection.
      - name: Scan frontend dist (secret + canary)
        if: matrix.enabled
        run: |
          node scripts/secret-scan.mjs --dir apps/desktop/dist --canary "$VARVE_PRIVATE_TEST_CANARY"

      # The AppImage's bundled WebKit/GTK/GStreamer closure (from the
      # ubuntu-22.04 build baseline) fails EGL display creation on newer
      # Mesa/EGL stacks and renders a blank window — see
      # scripts/release/prune-appimage-bundled-libs.mjs for the measured
      # reproduction and fix. Prune it BEFORE collection so the artifact,
      # manifest and checksums describe the shipped bytes.
      - name: Prune bundled libraries from AppImage
        if: matrix.enabled && runner.os == 'Linux'
        run: |
          node scripts/release/prune-appimage-bundled-libs.mjs \
            --bundle-dir "${TAURI_BUNDLE_DIR}" \
            --arch ${{ matrix.arch_slug }} \
            --tools-dir "$HOME/.cache/tauri"

      # linuxdeploy re-assembles the AppImage from a fresh squashfs, so
      # the .sig produced by Tauri's build step is no longer valid.
      # Re-sign the pruned AppImage so collect-artifacts.mjs ships a
      # signature that matches the published bytes.
      - name: Re-sign pruned AppImage for updater
        if: matrix.enabled && runner.os == 'Linux' && needs.signing-preflight.outputs.updater_mode == 'signed'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: apps/desktop
        run: |
          # This step runs from apps/desktop while TAURI_BUNDLE_DIR is rooted
          # at the repository checkout. Resolve it explicitly so ARM64 Linux
          # builds do not search under apps/desktop/apps/desktop/... .
          APPIMAGE=$(find "${GITHUB_WORKSPACE}/${TAURI_BUNDLE_DIR}/appimage" -maxdepth 1 -name '*.AppImage' -print -quit)
          if [ -n "$APPIMAGE" ]; then
            echo "Re-signing pruned AppImage for updater: $APPIMAGE"
            pnpm tauri signer sign "$APPIMAGE" --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          else
            echo "::warning::No AppImage found to re-sign after pruning."
          fi

      - name: Verify native executable architecture
        if: matrix.enabled
        shell: bash
        run: |
          node scripts/release/verify-binary-architecture.mjs \
            --path "${TAURI_TARGET_DIR}/release/${{ matrix.executable }}" \
            --architecture ${{ matrix.arch_slug }}

      - name: Collect artifacts
        if: matrix.enabled
        run: |
          node scripts/release/collect-artifacts.mjs \
            --bundle-dir "${TAURI_BUNDLE_DIR}" \
            --out dist/release \
            --os ${{ matrix.os_slug }} \
            --arch ${{ matrix.arch_slug }} \
            --updater-signatures "${{ needs.signing-preflight.outputs.updater_mode == 'signed' }}"
        shell: bash

      # Installer composition + size gate. Decomposes the NSIS installer
      # (7-Zip is preinstalled on GitHub Windows runners) and compares total
      # size against scripts/release/installer-size-baseline.json. Blocks
      # only on measured growth above the hard threshold without an explicit
      # override; the report JSON and baseline live alongside the artifacts
      # and feed the historical trend.
      - name: Report installer size (Windows)
        if: matrix.enabled && runner.os == 'Windows'
        shell: bash
        env:
          SIZE_GATE_OVERRIDE: ${{ github.event.inputs.size_gate_override || '' }}
        run: |
          node scripts/release/report-installer-size.mjs \
            --installer dist/release/*-windows-*.exe \
            --out-report dist/release/installer-size-report-${{ matrix.os_slug }}-${{ matrix.arch_slug }}.json \
            --override-reason "$SIZE_GATE_OVERRIDE"

      # Platform-specific SBOM: the bundle contents differ per platform (the
      # ONNX Runtime shared library and models are platform-native), so each
      # runner emits the SBOM for the bytes it actually bundled.
      - name: Generate platform SBOM
        if: matrix.enabled
        shell: bash
        run: |
          node scripts/release/generate-sbom.mjs \
            --out dist/release/varve-${{ needs.preflight.outputs.version }}-sbom-${{ matrix.os_slug }}-${{ matrix.arch_slug }}.cdx.json \
            --os ${{ matrix.os_slug }} \
            --arch ${{ matrix.arch_slug }}

      - name: Validate platform SBOM
        if: matrix.enabled
        shell: bash
        run: |
          node scripts/release/validate-sbom.mjs \
            dist/release/varve-${{ needs.preflight.outputs.version }}-sbom-${{ matrix.os_slug }}-${{ matrix.arch_slug }}.cdx.json

      # ── Signing verification: measure the actual artifact bytes ─────────
      # These are the evidence the release manifest's signing block is derived
      # from. They run on the renamed, collected artifact — the exact bytes
      # that will be uploaded. A missing report or a failed verification stops
      # the release in the `verify` trust gate.
      - name: Verify Windows Authenticode signature
        if: matrix.enabled && runner.os == 'Windows'
        shell: pwsh
        env:
          EXPECT_SIGNED: ${{ needs.signing-preflight.outputs.windows_mode == 'signed' }}
        run: |
          $exe = Get-ChildItem -Path dist/release -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'No .exe installer found in dist/release' }
          $report = Join-Path (Split-Path $exe.FullName) 'signing-report-windows-${{ matrix.arch_slug }}.json'
          # Switch parameters do not survive the pwsh -> Windows PowerShell 5.1
          # boundary with a computed value; branch explicitly instead.
          if ($env:EXPECT_SIGNED -eq 'true') {
            powershell -File scripts/release/verify-windows-signature.ps1 `
              -Path $exe.FullName -ExpectSigned -ReportPath $report
          } else {
            powershell -File scripts/release/verify-windows-signature.ps1 `
              -Path $exe.FullName -ReportPath $report
          }

      - name: Verify macOS signature, notarization and staple
        if: matrix.enabled && runner.os == 'macOS'
        shell: bash
        env:
          EXPECT_SIGNED: ${{ needs.signing-preflight.outputs.macos_mode == 'signed' }}
        run: |
          set -euo pipefail
          DMG="$(find dist/release -name '*.dmg' | head -1)"
          if [[ -z "${DMG}" ]]; then
            echo "::error::No DMG found in dist/release"
            exit 1
          fi
          if [[ "${EXPECT_SIGNED}" == "true" ]]; then
            bash scripts/release/verify-macos-signature.sh --dmg "${DMG}" --expect-signed --report dist/release/signing-report-macos.json
          else
            bash scripts/release/verify-macos-signature.sh --dmg "${DMG}" --report dist/release/signing-report-macos.json
          fi

      # Every platform upload carries a sidecar binding its bytes to the exact
      # tagged commit and validation-policy hash. A later resume may reuse a
      # successful platform artifact only when this identity and its digest
      # still match; missing/failed platforms can then be rebuilt alone.
      - name: Write exact-SHA artifact provenance
        if: matrix.enabled
        shell: bash
        run: |
          node scripts/release/write-artifact-provenance.mjs \
            --dir dist/release \
            --version '${{ needs.preflight.outputs.version }}' \
            --sha '${{ needs.preflight.outputs.tag_sha }}' \
            --policy-hash '${{ needs.preflight.outputs.policy_hash }}' \
            --platform '${{ matrix.os_slug }}-${{ matrix.arch_slug }}'

      - name: Upload release artifacts
        if: matrix.enabled
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ matrix.name }}-attempt-${{ github.run_attempt }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

      # Kept out of the public release: useful for symbolicating a crash report,
      # but it is an unstripped binary and there is no reason to hand it to
      # everyone who downloads the app. NOTE: [profile.release] sets
      # strip = true, so this is currently of limited value — see
      # docs/release/production-build.md for the debug-symbol plan.
      - name: Upload unstripped binary for crash triage
        if: matrix.enabled && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: debug-binary-${{ matrix.name }}-attempt-${{ github.run_attempt }}
          path: ${{ env.TAURI_TARGET_DIR }}/release/varve-desktop
          if-no-files-found: warn
          retention-days: 90

  # ── 3b. Native package smoke (clean containers + headless launch) ─────────
  # The container tests answer the compatibility-baseline question nothing
  # else can: installability, dependency resolution, glibc floor, desktop
  # entry, icons, MIME registration and clean uninstall on Ubuntu 22.04 and
  # Fedora 38. The AppImage step launches the real bundled app headlessly
  # under Xvfb — a launch smoke, not a GUI usability test. Both are explicit
  # gates between "built" and "draft" for the Linux platform.
  package-smoke:
    name: Linux package smoke (${{ matrix.name }})
    needs: [preflight, bundle]
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish != 'yes'
    runs-on: ${{ matrix.os }}
    # Driver install (8m) + old/new production flows (9m each), plus existing package checks.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: x86_64
            os: ubuntu-22.04
            arch_slug: x86_64
            node_arch: x64
            artifact: release-linux-x86_64
            enabled: true
          - name: aarch64
            os: ubuntu-22.04-arm
            arch_slug: aarch64
            node_arch: arm64
            artifact: release-linux-aarch64
            enabled: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        if: matrix.enabled
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: matrix.enabled
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install native qualification tooling dependencies
        if: matrix.enabled
        run: pnpm install --frozen-lockfile
      - name: Native qualification adapter contracts
        if: matrix.enabled
        run: |
          node scripts/release/production/dialog-forwarding.test.mjs
          node scripts/release/production/webdriver-dom.test.mjs
          node scripts/release/production/macos-ax-controls.test.mjs
          node scripts/release/production/published-upgrade.test.mjs
          node scripts/release/production/workflow.test.mjs

      - name: Select successful Linux producer artifact
        if: matrix.enabled
        id: artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/select-run-artifacts.mjs select
          --repo '${{ github.repository }}' --run-id '${{ github.run_id }}'
          --sha '${{ github.sha }}' --attempt '${{ github.run_attempt }}'
          --targets 'linux-${{ matrix.arch_slug }}'

      - name: Download Linux artifacts
        if: matrix.enabled
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.artifacts.outputs.artifact_ids }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: staged/linux-${{ matrix.arch_slug }}

      - name: Verify downloaded Linux source and bytes
        if: matrix.enabled
        run: node scripts/release/select-run-artifacts.mjs verify
          --dir 'staged/linux-${{ matrix.arch_slug }}' --version '${{ needs.preflight.outputs.version }}'
          --sha '${{ needs.preflight.outputs.tag_sha }}' --policy-hash '${{ needs.preflight.outputs.policy_hash }}'
          --targets '${{ steps.artifacts.outputs.targets }}'

      - name: Install container runtime
        if: matrix.enabled
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            podman fuse xvfb dbus-x11 at-spi2-core \
            libegl1 libgl1 libgles2 libgbm1 libxkbcommon0 \
            libwebkit2gtk-4.1-0 libgtk-3-0 gstreamer1.0-plugins-base \
            librsvg2-2
          podman info >/dev/null 2>&1 || echo "::warning::podman info failed — install tests will fail fast"

      - name: Install-test .deb and .rpm in clean containers
        if: matrix.enabled
        run: |
          bash scripts/release/verify-package-install.sh \
            --bundle-dir "$(pwd)/staged/linux-${{ matrix.arch_slug }}"

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        if: matrix.enabled
        with:
          toolchain: 1.97.1
      - name: Install pinned external Linux WebDriver
        if: matrix.enabled
        run: |
          sudo apt-get install -y --no-install-recommends webkit2gtk-driver
          node scripts/quality/run-bounded-command.mjs 480000 "$PWD" cargo install tauri-driver --version 2.1.0 --locked
      - name: Actual published Linux install, disk seed, upgrade and production UI qualification
        if: matrix.enabled
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VARVE_RELEASE_SHA: ${{ needs.preflight.outputs.tag_sha }}
        run: |
          set -euo pipefail
          QUALIFIED="$HOME/varve-qualified/linux-${{ matrix.arch_slug }}"
          PROFILE="$QUALIFIED/profile"
          mkdir -p "$QUALIFIED"
          node scripts/release/production/published-upgrade.mjs --repo '${{ github.repository }}' --target 'linux-${{ matrix.arch_slug }}' --format deb --out "$QUALIFIED/old-installer"
          OLD="$QUALIFIED/old-installer/Varve-0.2.1-linux-${{ matrix.arch_slug }}.deb"
          sudo apt-get install -y --no-install-recommends "$OLD"
          node scripts/quality/run-bounded-command.mjs 540000 "$PWD" node scripts/quality/heavy-lease.mjs "Published Linux production disk seed" -- dbus-run-session -- xvfb-run --auto-servernum bash scripts/release/production/linux-session.sh /usr/bin/varve-desktop "$QUALIFIED/old-document" "$PROFILE" 0.2.1 '${{ matrix.node_arch }}' "$PWD/tests/e2e/fixtures/published-v021/poster-embedded.varve" 2.21 true
          mapfile -t PACKAGES < <(find 'staged/linux-${{ matrix.arch_slug }}' -name '*.deb' -type f)
          [[ "${#PACKAGES[@]}" == 1 ]] || { echo 'Exactly one verified current DEB required'; exit 1; }
          CURRENT="$(realpath "${PACKAGES[0]}")"
          # Upgrade over the old installation, retaining the same native XDG profile.
          sudo apt-get install -y --no-install-recommends "$CURRENT"
          node scripts/quality/run-bounded-command.mjs 540000 "$PWD" node scripts/quality/heavy-lease.mjs "Actual upgraded Linux production qualification" -- dbus-run-session -- xvfb-run --auto-servernum bash scripts/release/production/linux-session.sh /usr/bin/varve-desktop "$QUALIFIED/current-document" "$PROFILE" '${{ needs.preflight.outputs.version }}' '${{ matrix.node_arch }}' "$QUALIFIED/old-document/Migrated save β.varve" 2.33 false
          node --input-type=module -e 'import assert from "node:assert/strict";import{readFileSync}from"node:fs";const[a,b]=process.argv.slice(1).map(p=>JSON.parse(readFileSync(p)));assert.equal(a.appDataDirectory,b.appDataDirectory,"Actual Linux native profile changed during upgrade");' "$QUALIFIED/old-document/qualification.json" "$QUALIFIED/current-document/qualification.json"
          sudo apt-get remove -y "$(dpkg-deb -f "$CURRENT" Package)"

      - name: Launch smoke (AppImage under Xvfb)
        if: matrix.enabled
        run: |
          set -euo pipefail
          IMG="$(find staged/linux-${{ matrix.arch_slug }} -name '*.AppImage' | head -1)"
          if [[ -z "${IMG}" ]]; then
            echo "::error::No AppImage found in staged/linux-${{ matrix.arch_slug }}"
            exit 1
          fi
          chmod +x "${IMG}"
          EXTRACT_ROOT="$(mktemp -d "${RUNNER_TEMP:-/tmp}/varve-appimage-resources.XXXXXX")"
          trap 'rm -rf "${EXTRACT_ROOT}"' EXIT
          (
            cd "${EXTRACT_ROOT}"
            "${IMG}" --appimage-extract >/dev/null
          )
          node scripts/release/verify-license-payload.mjs \
            --resource-root "${EXTRACT_ROOT}/squashfs-root/usr/lib/Varve"
          LOG="$(mktemp)"
          echo "Launching ${IMG} headlessly for a bounded smoke test..."
          dbus-run-session -- xvfb-run --auto-servernum \
            timeout 60 "${IMG}" --appimage-extract-and-run >"${LOG}" 2>&1 &
          PID=$!
          sleep 25
          if kill -0 "${PID}" 2>/dev/null; then
            # The main process survives, but a white screen does too — the
            # WebKit web process aborts on EGL init failure while the window
            # stays open. Fail the smoke on the abort signature or a missing
            # web process instead of trusting process liveness.
            if rg -qi 'EGL|Aborting|entry point|segmentation' "${LOG}"; then
              echo "::error::WebKit failure detected in app output:"
              rg -i 'EGL|Aborting|entry point|segmentation' "${LOG}" | head -5
              kill "${PID}" 2>/dev/null || true
              exit 1
            fi
            WEB_PROCS="$(pgrep -fc 'WebKitWebProcess|WebKitNetworkProcess' || true)"
            if [[ "${WEB_PROCS}" -lt 1 ]]; then
              echo "::error::No WebKit web process after 25s — the window is almost certainly blank."
              kill "${PID}" 2>/dev/null || true
              exit 1
            fi
            kill "${PID}" 2>/dev/null || true
            wait "${PID}" 2>/dev/null || true
            echo "AppImage launch smoke PASSED (web process alive, no EGL errors)"
          else
            wait "${PID}"
            echo "::error::AppImage exited early (code $?)"
            cat "${LOG}" | head -20
            exit 1
          fi

  # ── 3c. Native runner smoke (Windows NSIS, macOS DMG) ──────────────────────
  # The matrix builds the packages; these jobs prove the packaged artifacts
  # install/mount and launch far enough to run a bounded smoke test on the
  # platform itself. Installed production save/reopen/edit/undo/export and
  # published-version upgrade checks gate draft verification alongside package
  # structure, signatures and launch checks. Human usability review remains useful.
      - name: Preserve actual native qualification evidence
        if: always() && matrix.enabled
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-production-${{ matrix.artifact }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ~/varve-qualified/
          if-no-files-found: warn
          retention-days: 90


  platform-smoke:
    name: ${{ matrix.name }} runner smoke
    needs: [preflight, bundle]
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish != 'yes'
    runs-on: ${{ matrix.os }}
    # Pinned driver setup + old/new bounded production GUI/disk flows and existing smoke.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: windows
            os: windows-latest
            artifact: windows-x86_64
            node_arch: x64
            enabled: ${{ needs.preflight.outputs.build_windows == 'true' }}
          - name: windows-aarch64
            os: windows-11-arm
            artifact: windows-aarch64
            node_arch: arm64
            enabled: ${{ needs.preflight.outputs.build_windows == 'true' }}
          - name: macos
            os: macos-latest
            artifact: macos-aarch64
            enabled: ${{ needs.preflight.outputs.build_macos == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: matrix.enabled
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: matrix.enabled && runner.os == 'macOS'
        with:
          python-version: '3.12'
      - name: Verify safe macOS updater archive extraction
        if: matrix.enabled && runner.os == 'macOS'
        run: python scripts/release/test_extract_updater_archive.py

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        if: matrix.enabled
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: matrix.enabled
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install native qualification tooling dependencies
        if: matrix.enabled
        run: pnpm install --frozen-lockfile
      - name: Native qualification adapter contracts
        if: matrix.enabled
        run: |
          node scripts/release/production/dialog-forwarding.test.mjs
          node scripts/release/production/webdriver-dom.test.mjs
          node scripts/release/production/macos-ax-controls.test.mjs
          node scripts/release/production/published-upgrade.test.mjs
          node scripts/release/production/workflow.test.mjs

      - name: Select successful platform producer artifact
        if: matrix.enabled
        id: artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/select-run-artifacts.mjs select
          --repo '${{ github.repository }}' --run-id '${{ github.run_id }}'
          --sha '${{ github.sha }}' --attempt '${{ github.run_attempt }}'
          --targets '${{ matrix.artifact }}'

      - name: Download platform artifacts
        if: matrix.enabled
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.artifacts.outputs.artifact_ids }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: staged

      - name: Verify downloaded platform source and bytes
        if: matrix.enabled
        run: node scripts/release/select-run-artifacts.mjs verify
          --dir staged --version '${{ needs.preflight.outputs.version }}'
          --sha '${{ needs.preflight.outputs.tag_sha }}' --policy-hash '${{ needs.preflight.outputs.policy_hash }}'
          --targets '${{ steps.artifacts.outputs.targets }}'

      - name: Install pinned external macOS Accessibility driver
        if: matrix.enabled && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          xcode-select --print-path
          export APPIUM_HOME="$RUNNER_TEMP/varve-appium-home"
          node scripts/quality/run-bounded-command.mjs 240000 "$PWD" npm install --prefix "$RUNNER_TEMP/varve-appium" --no-audit --no-fund appium@3.8.0
          node scripts/quality/run-bounded-command.mjs 240000 "$PWD" "$RUNNER_TEMP/varve-appium/node_modules/.bin/appium" driver install mac2@4.3.6
          "$RUNNER_TEMP/varve-appium/node_modules/.bin/appium" driver doctor mac2
          # Use normal hosted-runner Accessibility authorization. Missing permission
          # fails the AX probe with evidence; no TCC edits, SIP changes or app plugin.

      - name: Windows — silent install, payload signature, launch smoke, uninstall
        if: matrix.enabled && runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VARVE_RELEASE_SHA: ${{ needs.preflight.outputs.tag_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path staged -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'No NSIS installer found in staged/' }
          $qualified = Join-Path $env:USERPROFILE 'varve-qualified/windows-${{ matrix.node_arch }}'
          $profile = Join-Path $qualified 'profile'
          node scripts/release/production/published-upgrade.mjs --repo '${{ github.repository }}' --target '${{ matrix.artifact }}' --format nsis --out (Join-Path $qualified 'old-installer')
          if ($LASTEXITCODE -ne 0) { throw 'Published installer verification failed' }
          $oldInstaller = Get-ChildItem (Join-Path $qualified 'old-installer') -Filter '*.exe'
          if (@($oldInstaller).Count -ne 1) { throw 'Exactly one published NSIS installer required' }
          Start-Process -FilePath $oldInstaller.FullName -ArgumentList '/S' -Wait
          $oldInstalled = Get-ChildItem -Path $env:LOCALAPPDATA -Recurse -Filter 'varve-desktop.exe' -ErrorAction SilentlyContinue
          if (@($oldInstalled).Count -ne 1) { throw 'One actual old installed payload required' }
          node scripts/quality/run-bounded-command.mjs 540000 $PWD.Path node scripts/quality/heavy-lease.mjs "Published Windows production disk seed" -- node scripts/release/production/windows-production.mjs --exe $oldInstalled.FullName --input tests/e2e/fixtures/published-v021/poster-embedded.varve --out (Join-Path $qualified 'old-document') --profile $profile --version 0.2.1 --schema 2.21 --arch '${{ matrix.node_arch }}' --seed
          if ($LASTEXITCODE -ne 0) { throw 'Old production disk seed failed' }
          # Current installer upgrades the existing install; native profile remains.
          Write-Host "Installing $($exe.Name) silently..."
          Start-Process -FilePath $exe.FullName -ArgumentList '/S' -Wait
          $installed = Get-ChildItem -Path $env:LOCALAPPDATA -Recurse -Filter 'varve-desktop.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installed) { throw 'varve-desktop.exe not found after silent install' }
          node scripts/release/verify-license-payload.mjs --resource-root $installed.DirectoryName
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows license payload verification failed' }
          $version = $installed.VersionInfo
          Write-Host "Installed: $($installed.FullName)  product=$($version.ProductName)  version=$($version.FileVersion)"
          # Observe the actual payload before uninstall removes it. This is a
          # report, separate from the fail-closed installer signature gate.
          $sig = Get-AuthenticodeSignature -LiteralPath $installed.FullName
          Write-Host "Installed executable signature status: $($sig.Status)"
          if ($sig.Status -eq [System.Management.Automation.SignatureStatus]::Valid) {
            Write-Host "  Signer: $($sig.SignerCertificate.Subject)"
          } else {
            Write-Host '  (expected unsigned for NSIS payloads — see docs/release/signing-decision-record.md)'
          }
          node scripts/quality/run-bounded-command.mjs 540000 $PWD.Path node scripts/quality/heavy-lease.mjs "Actual upgraded Windows production qualification" -- node scripts/release/production/windows-production.mjs --exe $installed.FullName --input (Join-Path $qualified 'old-document/Migrated save β.varve') --out (Join-Path $qualified 'current-document') --profile $profile --version '${{ needs.preflight.outputs.version }}' --schema 2.33 --arch '${{ matrix.node_arch }}'
          if ($LASTEXITCODE -ne 0) { throw 'Current production save/reopen/export/upgrade qualification failed' }
          $oldReceipt = Get-Content (Join-Path $qualified 'old-document/qualification.json') -Raw | ConvertFrom-Json
          $newReceipt = Get-Content (Join-Path $qualified 'current-document/qualification.json') -Raw | ConvertFrom-Json
          if ($oldReceipt.appDataDirectory -ne $newReceipt.appDataDirectory) { throw 'Actual Windows native profile changed during upgrade' }
          $proc = Start-Process -FilePath $installed.FullName -PassThru
          Start-Sleep -Seconds 20
          if ($proc.HasExited) { throw "App exited early with code $($proc.ExitCode)" }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Write-Host 'Launch smoke PASSED (process stayed alive 20s)'
          $uninstallKey = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like 'Varve*' } | Select-Object -First 1
          if (-not $uninstallKey) { throw 'No uninstall entry found in registry' }
          Write-Host "Uninstall entry: $($uninstallKey.DisplayName)"
          Start-Process -FilePath $uninstallKey.UninstallString -ArgumentList '/S' -Wait
          if (Test-Path $installed.DirectoryName) { throw 'Installed files remain after uninstall' }
          Write-Host 'Uninstall PASSED'

      - name: macOS — mount DMG, structure/arch checks, launch smoke, unmount
        if: matrix.enabled && runner.os == 'macOS'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VARVE_RELEASE_SHA: ${{ needs.preflight.outputs.tag_sha }}
        run: |
          set -euo pipefail
          DMG="$(find staged -name '*.dmg' | head -1)"
          if [[ -z "${DMG}" ]]; then echo "::error::No DMG found in staged/"; exit 1; fi
          MOUNT_POINT="$(mktemp -d /tmp/varve-dmg.XXXXXX)"
          hdiutil attach "${DMG}" -nobrowse -mountpoint "${MOUNT_POINT}" >/dev/null
          APP="$(find "${MOUNT_POINT}" -maxdepth 1 -name '*.app' | head -1)"
          if [[ -z "${APP}" ]]; then echo "::error::No .app bundle inside DMG"; hdiutil detach "${MOUNT_POINT}" >/dev/null 2>&1 || true; exit 1; fi
          QUALIFIED="$HOME/varve-qualified/macos-aarch64"
          INSTALL="$QUALIFIED/installed/Varve.app"
          mkdir -p "$QUALIFIED/installed"
          node scripts/release/production/published-upgrade.mjs --repo '${{ github.repository }}' --target macos-aarch64 --format dmg --out "$QUALIFIED/old-installer"
          OLD_MOUNT="$(mktemp -d /tmp/varve-old-dmg.XXXXXX)"
          hdiutil attach "$QUALIFIED/old-installer/Varve-0.2.1-macos-aarch64.dmg" -nobrowse -mountpoint "$OLD_MOUNT" >/dev/null
          OLD_APP="$(find "$OLD_MOUNT" -maxdepth 1 -name '*.app' | head -1)"
          [[ -n "$OLD_APP" ]] || { echo 'Old DMG must contain actual app'; exit 1; }
          ditto "$OLD_APP" "$INSTALL"
          hdiutil detach "$OLD_MOUNT" >/dev/null
          node scripts/quality/run-bounded-command.mjs 720000 "$PWD" node scripts/quality/heavy-lease.mjs "Published macOS production disk seed" -- bash scripts/release/production/macos-session.sh "$INSTALL" "$QUALIFIED/old-document" 0.2.1 "$PWD/tests/e2e/fixtures/published-v021/poster-embedded.varve" 2.21 true
          # Replace the old app at the same installation path; preserve real app data.
          rm -rf "$INSTALL"
          ditto "$APP" "$INSTALL"
          node scripts/release/verify-license-payload.mjs \
            --resource-root "$INSTALL/Contents/Resources"
          UPDATER_TMP="$(mktemp -d /tmp/varve-updater-license.XXXXXX)"
          trap 'rm -rf "${UPDATER_TMP}"' EXIT
          UPDATER_ARCHIVE="$(find staged -type f -name '*.app.tar.gz' -print -quit)"
          if [[ -n "${UPDATER_ARCHIVE}" ]]; then
            UPDATER_APP="$(python scripts/release/extract_updater_archive.py "${UPDATER_ARCHIVE}" "${UPDATER_TMP}")"
            node scripts/release/verify-license-payload.mjs \
              --resource-root "${UPDATER_APP}/Contents/Resources"
          else
            echo 'No macOS updater archive was staged; manual-download release mode is checked by the final trust gate.'
          fi
          rm -rf "${UPDATER_TMP}"
          trap - EXIT
          node scripts/quality/run-bounded-command.mjs 720000 "$PWD" node scripts/quality/heavy-lease.mjs "Actual upgraded macOS production qualification" -- bash scripts/release/production/macos-session.sh "$INSTALL" "$QUALIFIED/current-document" '${{ needs.preflight.outputs.version }}' "$QUALIFIED/old-document/functional/Migrated save β.varve" 2.33 false
          node --input-type=module -e 'import assert from "node:assert/strict";import{readFileSync}from"node:fs";const[a,b]=process.argv.slice(1).map(p=>JSON.parse(readFileSync(p)));assert.equal(a.appDataDirectory,b.appDataDirectory,"Native macOS profile changed during upgrade");' "$QUALIFIED/old-document/functional/qualification.json" "$QUALIFIED/current-document/functional/qualification.json"
          BIN="${APP}/Contents/MacOS/varve-desktop"
          [[ -x "${BIN}" ]] || { echo "::error::Executable missing in bundle"; exit 1; }
          echo "Bundle identifier: $(plutil -extract CFBundleIdentifier raw "${APP}/Contents/Info.plist")"
          echo "Executable arch:   $(file "${BIN}" | grep -oE 'arm64|x86_64' | head -1)"
          echo "Bundle structure:  $(ls "${APP}/Contents/" | tr '\n' ' ')"
          if [[ -f "${APP}/Contents/Resources/icon.icns" ]]; then echo "Icon resource:      present"; fi
          # Launch the .app bundle rather than invoking its inner executable.
          # Tauri resolves packaged resources through the macOS bundle context;
          # launching Contents/MacOS/varve-desktop directly makes that context
          # unavailable and produces a false smoke-test failure.
          OPEN_LOG="$(mktemp /tmp/varve-open.XXXXXX.log)"
          open -n "${APP}" >"${OPEN_LOG}" 2>&1
          sleep 20
          APP_PID="$(pgrep -f -- "${BIN}" | head -1 || true)"
          if [[ -n "${APP_PID}" ]]; then
            echo "Launch smoke PASSED (process stayed alive 20s)"
            kill "${APP_PID}" 2>/dev/null || true
          else
            echo "::error::App exited before the 20s launch smoke window"
            cat "${OPEN_LOG}" || true
            hdiutil detach "${MOUNT_POINT}" >/dev/null 2>&1 || true
            rm -f "${OPEN_LOG}"
            exit 1
          fi
          hdiutil detach "${MOUNT_POINT}" >/dev/null
          rm -rf "${MOUNT_POINT}"
          rm -f "${OPEN_LOG}"
          echo "DMG mounted, app launched, unmounted cleanly."

      # Re-verify the signature on the DOWNLOADED bytes (the same artifacts the
      # trust gate will merge). A tampered or truncated upload fails here even
      # though the build runner verified its local copy.
      - name: macOS — verify signature on downloaded bytes
        if: matrix.enabled && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          DMG="$(find staged -name '*.dmg' | head -1)"
          if [[ -z "${DMG}" ]]; then echo "::error::No DMG found in staged/"; exit 1; fi
          bash scripts/release/verify-macos-signature.sh --dmg "${DMG}" --report staged/signing-report-macos-smoke.json

  # ── 4. Verify: trust gate, checksums, attestation, final bytes ─────────────
  # Everything converges here:
  #   1. merge per-runner manifests + signing reports -> release-manifest.json
  #   2. verify-release-trust enforces the fail-closed channel policy
  #   3. combined SBOM + artifact verification
  #   4. FINAL SHA256SUMS.txt (after every byte is verified)
  #   5. GitHub artifact attestation of the final bytes
  #   6. upload the verified set for the draft job
  # Any step failing stops the release before a draft exists.
      - name: Preserve actual native qualification evidence
        if: always() && matrix.enabled
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-production-${{ matrix.artifact }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ~/varve-qualified/
          if-no-files-found: warn
          retention-days: 90


  verify:
    name: Verify, attest and finalize
    needs: [preflight, signing-preflight, bundle, package-smoke, platform-smoke]
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish != 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # Untouched successful matrix legs may come from an earlier attempt of
      # this same run. Never merge multiple attempts or reuse stale success
      # after a newer producer failed or omitted its upload.
      - name: Select successful platform producer artifacts
        id: artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/select-run-artifacts.mjs select
          --repo '${{ github.repository }}' --run-id '${{ github.run_id }}'
          --sha '${{ github.sha }}' --attempt '${{ github.run_attempt }}'
          --targets all --windows '${{ needs.preflight.outputs.build_windows }}'
          --macos '${{ needs.preflight.outputs.build_macos }}'

      - name: Download all platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.artifacts.outputs.artifact_ids }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: staged
          merge-multiple: false

      - name: Verify downloaded platform source and bytes
        run: node scripts/release/select-run-artifacts.mjs verify
          --dir staged --version '${{ needs.preflight.outputs.version }}'
          --sha '${{ needs.preflight.outputs.tag_sha }}' --policy-hash '${{ needs.preflight.outputs.policy_hash }}'
          --targets '${{ steps.artifacts.outputs.targets }}'

      - name: Merge into one release directory
        shell: bash
        run: |
          mkdir -p dist/release
          # Each runner produced its own release-manifest.json + SHA256SUMS.txt
          # covering only its platform. Copy the binaries first, then
          # verify-release-trust rebuilds the combined manifest (including the
          # signing block derived from the verification reports) from the
          # merged set so it describes exactly what is about to be uploaded.
          find staged -type f ! -name 'release-manifest.json' ! -name 'SHA256SUMS.txt' \
            -exec cp {} dist/release/ \;

      - name: Trust gate (fail-closed signing policy)
        shell: bash
        env:
          EXPECT_SIGNED: ${{ vars.RELEASE_EXPECT_SIGNED }}
        run: |
          EXPECT="false"
          if [[ "${EXPECT_SIGNED}" == "true" ]]; then EXPECT="true"; fi
          node scripts/release/verify-release-trust.mjs \
            --staged staged \
            --out dist/release \
            --channel ${{ needs.preflight.outputs.channel }} \
            --expect-signed "${EXPECT}"

      - name: Generate signed updater feed
        if: needs.signing-preflight.outputs.updater_mode == 'signed'
        shell: bash
        run: |
          node scripts/release/generate-updater-feed.mjs \
            --dir dist/release \
            --version '${{ needs.preflight.outputs.version }}' \
            --channel '${{ needs.preflight.outputs.channel }}' \
            --base-url 'https://github.com/K-Arthur/varve/releases/download/${{ needs.preflight.outputs.tag }}'

      # Verify every feed entry's cryptographic signature against the
      # embedded pubkey and the on-disk artifacts.  This catches the class
      # of bug where a post-build step (e.g. AppImage pruning) invalidates
      # the Tauri-bundler-produced signature before the feed is published.
      - name: Verify updater feed signatures
        if: needs.signing-preflight.outputs.updater_mode == 'signed'
        run: node scripts/release/verify-updater-feed-signatures.mjs --dir dist/release

      - name: Record manual update fallback
        if: needs.signing-preflight.outputs.updater_mode != 'signed'
        run: |
          {
            echo "### Manual update fallback"
            echo ""
            echo "Updater signatures were not available; no updater feed was generated."
            echo "Installers remain available for manual download and are labelled with their verified platform signing state."
          } >> "$GITHUB_STEP_SUMMARY"

      # The combined SBOM describes the whole multi-platform release; its scope
      # is declared explicitly in its metadata. Platform-specific SBOMs arrived
      # with the bundle artifacts.
      - name: Generate combined SBOM
        run: |
          node scripts/release/generate-sbom.mjs \
            --out dist/release/varve-${{ needs.preflight.outputs.version }}-sbom.cdx.json \
            --scope all-platforms

      - name: Validate SBOMs
        run: |
          node scripts/release/validate-sbom.mjs dist/release/*.cdx.json

      # The checksum file is generated from the full release directory (after
      # the trust gate passed and every byte is in place), then verify-artifacts
      # checks the manifest, the checksums and the bytes against each other.
      # The trust gate always runs BEFORE this step, so the published hashes
      # describe the final verified bytes — never pre-signing intermediates.
      - name: Generate final SHA256SUMS.txt
        run: |
          node scripts/release/generate-final-checksums.mjs --dir dist/release

      - name: Verify artifacts and checksums against the bytes
        run: |
          node scripts/release/verify-artifacts.mjs \
            --dir dist/release \
            --expect-version ${{ needs.preflight.outputs.version }}

      # GitHub artifact attestation: provenance for the FINAL verified bytes
      # (post-signing, post-checksum). This is build provenance, NOT a Windows
      # Authenticode signature and NOT Apple notarization — verification
      # instructions for advanced users live in docs/release/website.md.
      - name: Attest final release bytes
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/release/*

      - name: Build release notes
        id: notes
        run: |
          node scripts/release/release-notes.mjs \
            --version ${{ needs.preflight.outputs.version }} \
            --manifest dist/release/release-manifest.json \
            --out RELEASE_NOTES.md
          echo "Generated $(wc -l < RELEASE_NOTES.md) lines of release notes."

      - name: Upload verified release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-final-attempt-${{ github.run_attempt }}
          path: |
            dist/release/
            RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14

  # ── 5. Draft — create the GitHub release, then verify the uploaded bytes ───
  draft:
    name: Draft Release
    # signing-preflight is required for its outputs, which the release notes
    # report. It carries the same `if:` as this job and already completes
    # upstream via bundle -> verify, so naming it here adds no wait.
    needs: [preflight, verify, signing-preflight]
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish != 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Select successful final producer artifact
        id: artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/select-run-artifacts.mjs select
          --repo '${{ github.repository }}' --run-id '${{ github.run_id }}'
          --sha '${{ github.sha }}' --attempt '${{ github.run_attempt }}' --targets final

      - name: Download the verified release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.artifacts.outputs.artifact_ids }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: staged-final

      # The release-final artifact stores the assets under a workspace-
      # relative dist/release/ prefix (upload-artifact v4 keeps the paths
      # given to it), with RELEASE_NOTES.md at the artifact root. Flatten the
      # assets into a bare dist/release/ and keep the notes at the workspace
      # root — the layout the v0.1.0 draft used successfully.
      - name: Stage release directory
        run: |
          mkdir -p dist/release
          find staged-final -type f ! -name 'RELEASE_NOTES.md' -exec cp {} dist/release/ \;
          cp staged-final/RELEASE_NOTES.md RELEASE_NOTES.md

      - name: Verify final downloaded source and bytes
        run: node scripts/release/select-run-artifacts.mjs verify
          --dir dist/release --version '${{ needs.preflight.outputs.version }}'
          --sha '${{ needs.preflight.outputs.tag_sha }}' --policy-hash '${{ needs.preflight.outputs.policy_hash }}'
          --targets all --windows '${{ needs.preflight.outputs.build_windows }}'
          --macos '${{ needs.preflight.outputs.build_macos }}'

      - name: Create draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          name: Varve ${{ needs.preflight.outputs.tag }}
          # Always a draft. Publication is a separate, human decision — see the
          # `publish` job below.
          draft: true
          prerelease: ${{ needs.preflight.outputs.prerelease }}
          body_path: RELEASE_NOTES.md
          # NOTE: no negated patterns here. softprops/action-gh-release v2
          # globs each `files` entry with the npm `glob` package, where a
          # standalone `!pattern` matches nothing; with
          # fail_on_unmatched_files: true the negation is a guaranteed
          # failure (v0.1.1 draft). Keeping RELEASE_NOTES.md outside
          # dist/release (see the Stage step above) makes the negation
          # unnecessary.
          files: dist/release/*
          fail_on_unmatched_files: true

      # The last gate before a human can publish: download the draft's assets
      # and recompute every hash from the bytes GitHub actually serves. A
      # truncated or substituted upload fails here, not after publication.
      - name: Download and verify the uploaded bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p verify-download
          gh release download "${{ needs.preflight.outputs.tag }}" \
            --dir verify-download --pattern '*'
          node scripts/release/verify-downloaded.mjs \
            --dir verify-download \
            --checksums dist/release/SHA256SUMS.txt

      - name: Summary
        run: |
          SIGNED="$(node -e "const m=require('./dist/release/release-manifest.json');process.stdout.write(String(m.signed === true))")"
          {
            echo "### Draft release created"
            echo ""
            echo "- **Tag:** ${{ needs.preflight.outputs.tag }}"
            echo "- **Version:** ${{ needs.preflight.outputs.version }}"
            echo "- **Channel:** ${{ needs.preflight.outputs.channel }}"
            echo "- **Signed:** ${SIGNED}"
            echo "- **Windows:** ${{ needs.signing-preflight.outputs.windows_mode }}"
            echo "- **macOS:** ${{ needs.signing-preflight.outputs.macos_mode }}"
            echo "- **Upload bytes verified:** yes"
            echo ""
            echo "Smoke-test the artifacts, then run the \`publish\` job to make it public."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 6. Publish — explicit authorization and fresh draft verification ──────
  # A tag push builds a draft and stops. Explicit publish=yes dispatches must
  # reauthenticate the actual draft assets against the certified tag SHA before
  # changing draft=false. The named environment adds reviewer approval only
  # when repository settings configure it; see docs/release/ci-secrets.md.
  publish:
    name: Verify draft and publish (explicit dispatch)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'yes'
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: release-publish
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify actual draft assets before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_SHA: ${{ needs.preflight.outputs.tag_sha }}
          RELEASE_POLICY_HASH: ${{ needs.preflight.outputs.policy_hash }}
          RELEASE_CHANNEL: ${{ needs.preflight.outputs.channel }}
          RELEASE_PLATFORMS: ${{ github.event.inputs.platforms || 'all' }}
          EXPECT_SIGNED: ${{ vars.RELEASE_EXPECT_SIGNED || 'false' }}
          UPDATER_REQUIRED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          node scripts/release/verify-draft-release.mjs \
            --repo "$RELEASE_REPOSITORY" --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA" --policy-hash "$RELEASE_POLICY_HASH" \
            --channel "$RELEASE_CHANNEL" --platforms "$RELEASE_PLATFORMS" \
            --expect-signed "$EXPECT_SIGNED" --require-updater "$UPDATER_REQUIRED" \
            --dir "$RUNNER_TEMP/publish-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_SHA: ${{ needs.preflight.outputs.tag_sha }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --draft=false
          # Pages deployment is intentionally triggered only after the human
          # publish action has completed. Draft-producing Release runs still
          # emit workflow_run, but never emit this publication dispatch.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type='varve-release-published' \
            -f "client_payload[tag]=${RELEASE_TAG}" \
            -f "client_payload[sha]=${RELEASE_SHA}"
          echo "::notice::Published ${RELEASE_TAG}; release-data deployment dispatched."
