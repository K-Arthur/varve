name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact master commit SHA to certify
        required: true
        type: string
      mode:
        description: Triage collects bounded failures; final is the release gate
        required: true
        default: final
        type: choice
        options: [triage, final]

permissions:
  contents: read
  actions: read
  checks: read

# A candidate is frozen. A repair gets a new SHA and a new candidate; an
# in-flight candidate is never silently cancelled by a later dispatch.
concurrency:
  group: release-candidate-${{ inputs.sha }}
  cancel-in-progress: false

env:
  PNPM_VERSION: '11.9.0'
  NODE_VERSION: '26'
  VARVE_CI_CANDIDATE_MODE: ${{ inputs.mode }}

jobs:
  changes:
    name: Candidate plan (exact SHA)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit_sha: ${{ steps.plan.outputs.commit_sha }}
      plan_hash: ${{ steps.plan.outputs.plan_hash }}
      policy_hash: ${{ steps.plan.outputs.policy_hash }}
      full: ${{ steps.plan.outputs.full }}
      mode: ${{ steps.plan.outputs.candidate_mode }}
      plan_artifact_id: ${{ steps.upload-plan.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse --verify 'HEAD^{commit}')"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          git merge-base --is-ancestor "$ACTUAL_SHA" origin/master
          node scripts/quality/ci-plan.mjs --base "$ACTUAL_SHA" --head "$ACTUAL_SHA" \
            --force-full --profile candidate --mode "${{ inputs.mode }}" \
            --output ci-plan.json --github-output "$GITHUB_OUTPUT"
      - name: Verify prior exact-SHA integration certification
        if: ${{ inputs.mode == 'final' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/release/verify-certification.mjs --integration-only \
          --sha "${{ steps.plan.outputs.commit_sha }}" --repo "${GITHUB_REPOSITORY}" \
          --policy-hash "${{ steps.plan.outputs.policy_hash }}"
      - name: Upload exact candidate plan
        id: upload-plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-candidate-plan-${{ inputs.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ci-plan.json
          retention-days: 90

  attribution-check:
    name: Candidate commit metadata
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.changes.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Scan candidate history policy
        env:
          VARVE_HISTORY_BASE: origin/master
          VARVE_HISTORY_HEAD: HEAD
        run: node scripts/quality/history-policy.mjs --metadata --secrets

  pipeline-validate:
    name: Candidate preflight policy
    runs-on: ubuntu-latest
    # Match the CI pipeline gate: pnpm bootstrap latency is external to the
    # validation work and must not cancel candidate certification prematurely.
    timeout-minutes: 20
    needs: changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.changes.outputs.commit_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install pinned advisory scanner (verified)
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172
        with:
          tool: cargo-audit@0.22.2
          checksum: true
          fallback: none
      - name: Audit production npm and both Cargo dependency graphs
        run: node scripts/security/dependency-advisories.mjs
      - name: Upload sanitized dependency advisory reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-dependency-advisories-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: reports/dependency-advisories/
          if-no-files-found: ignore
          retention-days: 14
      - name: Validate workflows and action pins
        run: |
          node scripts/validate-workflows.mjs
          node scripts/pin-github-actions.mjs --check
          node scripts/release/version.mjs verify
          node scripts/release/linux-package-metadata.test.mjs
          node scripts/release/verify-product-truth.mjs
          node scripts/secret-scan.mjs
          node scripts/security/workflow-policy.mjs
      - name: CI tooling regression suite
        run: pnpm test:ci:tools
      - name: Validation policy regression tests
        run: pnpm exec vitest run tests/unit/validationPolicy.test.ts --maxWorkers=1
      - name: Write pipeline execution receipt
        if: always()
        env:
          VARVE_CI_COMMIT_SHA: ${{ needs.changes.outputs.commit_sha }}
          VARVE_CI_PLAN_HASH: ${{ needs.changes.outputs.plan_hash }}
          VARVE_CI_POLICY_HASH: ${{ needs.changes.outputs.policy_hash }}
          VARVE_CI_STATUS: ${{ job.status }}
          VARVE_VALIDATION_PROFILE: candidate
        run: node scripts/quality/ci-execution-report.mjs --category pipeline --lanes pipeline-validate,ci-tools,policy --matrix ubuntu-latest --status "${{ job.status }}" --output ci-execution/pipeline.json
      - name: Upload pipeline execution receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-ci-execution-${{ github.run_id }}-pipeline-attempt-${{ github.run_attempt }}
          path: ci-execution/
          if-no-files-found: ignore

  js:
    name: Candidate JS and unit certification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [changes, pipeline-validate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.changes.outputs.commit_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Write JavaScript execution receipt
        if: always()
        env:
          VARVE_CI_COMMIT_SHA: ${{ needs.changes.outputs.commit_sha }}
          VARVE_CI_PLAN_HASH: ${{ needs.changes.outputs.plan_hash }}
          VARVE_CI_POLICY_HASH: ${{ needs.changes.outputs.policy_hash }}
          VARVE_CI_STATUS: ${{ job.status }}
          VARVE_VALIDATION_PROFILE: candidate
        run: node scripts/quality/ci-execution-report.mjs --category js --lanes js-unit:all,typecheck:all,lint:all --matrix ubuntu-latest --status "${{ job.status }}" --output ci-execution/js.json
      - name: Upload JavaScript execution receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-ci-execution-${{ github.run_id }}-js-attempt-${{ github.run_attempt }}
          path: ci-execution/
          if-no-files-found: ignore

  rust:
    name: Candidate Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: [changes, pipeline-validate]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.changes.outputs.commit_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt --all -- --check
      - run: node scripts/cargo-with-generative-bindgen.mjs clippy --workspace --all-targets -- -D warnings
      - run: node scripts/cargo-with-generative-bindgen.mjs test --workspace --all-targets
      - name: Write Rust execution receipt
        if: always()
        env:
          VARVE_CI_COMMIT_SHA: ${{ needs.changes.outputs.commit_sha }}
          VARVE_CI_PLAN_HASH: ${{ needs.changes.outputs.plan_hash }}
          VARVE_CI_POLICY_HASH: ${{ needs.changes.outputs.policy_hash }}
          VARVE_CI_STATUS: ${{ job.status }}
          VARVE_VALIDATION_PROFILE: candidate
        run: node scripts/quality/ci-execution-report.mjs --category rust --lanes rust-test:all,rust-clippy:all,cargo-fmt --matrix "${{ matrix.os }}" --status "${{ job.status }}" --output "ci-execution/rust-${{ matrix.os }}.json"
      - name: Upload Rust execution receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-ci-execution-${{ github.run_id }}-rust-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: ci-execution/
          if-no-files-found: ignore

  wasm:
    name: Candidate WASM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes, pipeline-validate]
    outputs:
      artifact_id: ${{ steps.upload-wasm.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.changes.outputs.commit_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install just
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172
        with:
          tool: just@1.54.0
      - name: WASM check
        run: just wasm-check
      - name: Install wasm-pack (pinned, verified)
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172
        with:
          tool: wasm-pack@0.13.1
          checksum: true
          fallback: none
      - name: Build WASM (base + SIMD + colour)
        run: just wasm-build-all
      - name: Upload candidate WASM artifact
        id: upload-wasm
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-candidate-wasm-${{ inputs.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: apps/desktop/public/wasm/
      - name: Write WASM execution receipt
        if: always()
        env:
          VARVE_CI_COMMIT_SHA: ${{ needs.changes.outputs.commit_sha }}
          VARVE_CI_PLAN_HASH: ${{ needs.changes.outputs.plan_hash }}
          VARVE_CI_POLICY_HASH: ${{ needs.changes.outputs.policy_hash }}
          VARVE_CI_STATUS: ${{ job.status }}
          VARVE_VALIDATION_PROFILE: candidate
        run: node scripts/quality/ci-execution-report.mjs --category wasm --lanes wasm --matrix ubuntu-latest --status "${{ job.status }}" --output ci-execution/wasm.json
      - name: Upload WASM execution receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-ci-execution-${{ github.run_id }}-wasm-attempt-${{ github.run_attempt }}
          path: ci-execution/
          if-no-files-found: ignore

  website-e2e:
    name: Candidate website functional and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, pipeline-validate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.changes.outputs.commit_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:website
      - run: pnpm build:website
      - run: pnpm build:website:pages
      - run: pnpm exec playwright install --with-deps chromium
      - name: Website E2E (candidate)
        run: |
          if [[ '${{ inputs.mode }}' == 'triage' ]]; then
            node scripts/quality/heavy-lease.mjs "Candidate website E2E triage" -- pnpm exec playwright test -c playwright.website.config.ts --max-failures=5 --workers=1 --retries=0 --update-snapshots=none --fail-on-flaky-tests --trace=retain-on-failure
          else
            node scripts/quality/heavy-lease.mjs "Candidate website E2E final" -- pnpm exec playwright test -c playwright.website.config.ts --workers=1 --retries=0 --update-snapshots=none --fail-on-flaky-tests --trace=retain-on-failure
          fi
        env:
          VARVE_VALIDATION_PROFILE: candidate
          VARVE_CI_PLAYWRIGHT_REPORT: test-results/ci-browser/website.json
      - name: Upload website diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-candidate-website-${{ inputs.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Write website execution receipt
        if: always()
        env:
          VARVE_CI_COMMIT_SHA: ${{ needs.changes.outputs.commit_sha }}
          VARVE_CI_PLAN_HASH: ${{ needs.changes.outputs.plan_hash }}
          VARVE_CI_POLICY_HASH: ${{ needs.changes.outputs.policy_hash }}
          VARVE_CI_STATUS: ${{ job.status }}
          VARVE_VALIDATION_PROFILE: candidate
        run: node scripts/quality/ci-execution-report.mjs --category website --lanes website-unit,website-e2e --matrix ubuntu-latest --status "${{ job.status }}" --output ci-execution/website.json --playwright-report website-e2e=test-results/ci-browser/website.json
      - name: Upload website execution receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-ci-execution-${{ github.run_id }}-website-attempt-${{ github.run_attempt }}
          path: ci-execution/
          if-no-files-found: ignore

  e2e:
    name: Candidate browser E2E ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [changes, pipeline-validate, wasm]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      VARVE_CI_PLAYWRIGHT_REPORT: test-results/ci-browser/e2e.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.changes.outputs.commit_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Download candidate WASM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ needs.wasm.outputs.artifact_id }}
          path: apps/desktop/public/wasm/
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser E2E (candidate)
        run: |
          if [[ '${{ inputs.mode }}' == 'triage' ]]; then
            node scripts/quality/heavy-lease.mjs "Candidate browser E2E triage" -- pnpm exec playwright test --project=chromium --shard=${{ matrix.shard }}/8 --max-failures=5 --workers=1 --retries=0 --update-snapshots=none --fail-on-flaky-tests --trace=retain-on-failure
          else
            node scripts/quality/heavy-lease.mjs "Candidate browser E2E final" -- pnpm exec playwright test --project=chromium --shard=${{ matrix.shard }}/8 --workers=1 --retries=0 --update-snapshots=none --fail-on-flaky-tests --trace=retain-on-failure
          fi
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-candidate-e2e-${{ inputs.sha }}-${{ matrix.shard }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Write browser execution receipt
        if: always()
        env:
          VARVE_CI_COMMIT_SHA: ${{ needs.changes.outputs.commit_sha }}
          VARVE_CI_PLAN_HASH: ${{ needs.changes.outputs.plan_hash }}
          VARVE_CI_POLICY_HASH: ${{ needs.changes.outputs.policy_hash }}
          VARVE_CI_STATUS: ${{ job.status }}
          VARVE_VALIDATION_PROFILE: candidate
        run: node scripts/quality/ci-execution-report.mjs --category e2e --lanes e2e:all --matrix ubuntu-latest --shard "${{ matrix.shard }}/8" --status "${{ job.status }}" --output "ci-execution/e2e-${{ matrix.shard }}.json" --playwright-report e2e:all=test-results/ci-browser/e2e.json
      - name: Upload browser execution receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-ci-execution-${{ github.run_id }}-e2e-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ci-execution/
          if-no-files-found: ignore

  e2e-visual:
    name: Candidate visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [changes, pipeline-validate, wasm]
    env:
      VARVE_CI_PLAYWRIGHT_REPORT: test-results/ci-browser/visual.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.changes.outputs.commit_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Download candidate WASM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ needs.wasm.outputs.artifact_id }}
          path: apps/desktop/public/wasm/
      - run: pnpm exec playwright install --with-deps chromium
      - name: Visual E2E (candidate)
        run: |
          if [[ '${{ inputs.mode }}' == 'triage' ]]; then
            node scripts/quality/heavy-lease.mjs "Candidate visual E2E triage" -- pnpm exec playwright test --project=chromium-visual-1x --project=chromium-visual-2x --max-failures=5 --workers=1 --retries=0 --update-snapshots=none --fail-on-flaky-tests --trace=retain-on-failure
          else
            node scripts/quality/heavy-lease.mjs "Candidate visual E2E final" -- pnpm e2e:visual --workers=1 --retries=0 --update-snapshots=none --fail-on-flaky-tests --trace=retain-on-failure
          fi
      - name: Upload visual diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-candidate-visual-${{ inputs.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            visual-diff-report/
          if-no-files-found: ignore
      - name: Write visual execution receipt
        if: always()
        env:
          VARVE_CI_COMMIT_SHA: ${{ needs.changes.outputs.commit_sha }}
          VARVE_CI_PLAN_HASH: ${{ needs.changes.outputs.plan_hash }}
          VARVE_CI_POLICY_HASH: ${{ needs.changes.outputs.policy_hash }}
          VARVE_CI_STATUS: ${{ job.status }}
          VARVE_VALIDATION_PROFILE: candidate
        run: node scripts/quality/ci-execution-report.mjs --category visual --lanes e2e:visual --matrix ubuntu-latest --status "${{ job.status }}" --output ci-execution/visual.json --playwright-report e2e:visual=test-results/ci-browser/visual.json
      - name: Upload visual execution receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-ci-execution-${{ github.run_id }}-visual-attempt-${{ github.run_attempt }}
          path: ci-execution/
          if-no-files-found: ignore

  desktop-e2e:
    name: Candidate native desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    needs: [changes, pipeline-validate, rust, wasm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest }
          - { name: macos, os: macos-latest }
          - { name: windows, os: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.changes.outputs.commit_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Download candidate WASM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ needs.wasm.outputs.artifact_id }}
          path: apps/desktop/public/wasm/
      - name: Native desktop smoke
        run: pnpm test:desktop:native
      - name: Write desktop execution receipt
        if: always()
        env:
          VARVE_CI_COMMIT_SHA: ${{ needs.changes.outputs.commit_sha }}
          VARVE_CI_PLAN_HASH: ${{ needs.changes.outputs.plan_hash }}
          VARVE_CI_POLICY_HASH: ${{ needs.changes.outputs.policy_hash }}
          VARVE_CI_STATUS: ${{ job.status }}
          VARVE_VALIDATION_PROFILE: candidate
        run: node scripts/quality/ci-execution-report.mjs --category desktop --lanes desktop-native --matrix "${{ matrix.name }}" --status "${{ job.status }}" --output "ci-execution/desktop-${{ matrix.name }}.json"
      - name: Upload desktop execution receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-ci-execution-${{ github.run_id }}-desktop-${{ matrix.name }}-attempt-${{ github.run_attempt }}
          path: ci-execution/
          if-no-files-found: ignore

  models:
    name: Candidate model policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, pipeline-validate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.changes.outputs.commit_sha }}
          persist-credentials: false
      - run: node scripts/models/validate-manifest.mjs
      - name: Write model execution receipt
        if: always()
        env:
          VARVE_CI_COMMIT_SHA: ${{ needs.changes.outputs.commit_sha }}
          VARVE_CI_PLAN_HASH: ${{ needs.changes.outputs.plan_hash }}
          VARVE_CI_POLICY_HASH: ${{ needs.changes.outputs.policy_hash }}
          VARVE_CI_STATUS: ${{ job.status }}
          VARVE_VALIDATION_PROFILE: candidate
        run: node scripts/quality/ci-execution-report.mjs --category models --lanes models --matrix ubuntu-latest --status "${{ job.status }}" --output ci-execution/models.json
      - name: Upload model execution receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-ci-execution-${{ github.run_id }}-models-attempt-${{ github.run_attempt }}
          path: ci-execution/
          if-no-files-found: ignore

  bench:
    name: Candidate benchmark corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, pipeline-validate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.changes.outputs.commit_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Candidate benchmark corpus
        run: pnpm bench
      - name: Write benchmark execution receipt
        if: always()
        env:
          VARVE_CI_COMMIT_SHA: ${{ needs.changes.outputs.commit_sha }}
          VARVE_CI_PLAN_HASH: ${{ needs.changes.outputs.plan_hash }}
          VARVE_CI_POLICY_HASH: ${{ needs.changes.outputs.policy_hash }}
          VARVE_CI_STATUS: ${{ job.status }}
          VARVE_VALIDATION_PROFILE: candidate
        run: node scripts/quality/ci-execution-report.mjs --category bench --lanes bench:render --matrix ubuntu-latest --status "${{ job.status }}" --output ci-execution/bench.json
      - name: Upload benchmark execution receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-ci-execution-${{ github.run_id }}-bench-attempt-${{ github.run_attempt }}
          path: ci-execution/
          if-no-files-found: ignore
      - name: Upload benchmark diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-candidate-bench-${{ inputs.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            reports/
            test-results/
          if-no-files-found: ignore

  certification:
    name: Release Candidate / certification
    permissions:
      contents: read
      actions: read
      checks: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [changes, attribution-check, pipeline-validate, rust, wasm, js, website-e2e, e2e, e2e-visual, desktop-e2e, bench, models]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.changes.outputs.commit_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ needs.changes.outputs.plan_artifact_id }}
          path: candidate-plan
      - name: Download execution receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          pattern: varve-ci-execution-${{ github.run_id }}-*
          path: ci-execution
          merge-multiple: false
      - name: Aggregate frozen candidate evidence
        id: aggregate
        if: always()
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          printf '%s' "$NEEDS_JSON" > ci-needs.json
          if node scripts/quality/aggregate-ci.mjs --needs ci-needs.json \
            --plan candidate-plan/ci-plan.json --execution-dir ci-execution \
            --output ci-certification.json; then
            aggregate_status=0
          else
            aggregate_status=$?
          fi
          # Triage is a bounded diagnostic run. Preserve its failure set and
          # publish a neutral check, but reserve a red job for final mode.
          if [[ '${{ inputs.mode }}' == 'triage' ]]; then
            exit 0
          fi
          exit "$aggregate_status"
      - name: Write exact-SHA candidate evidence
        id: evidence
        if: always()
        run: node scripts/release/write-candidate-evidence.mjs \
          --plan candidate-plan/ci-plan.json --aggregate ci-certification.json \
          --output candidate-certification.json
      - name: Upload immutable candidate evidence
        id: upload-evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-release-candidate-${{ needs.changes.outputs.commit_sha }}-${{ needs.changes.outputs.policy_hash }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            candidate-certification.json
            ci-certification.json
          retention-days: 90
      - name: Publish exact-SHA candidate check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.changes.outputs.commit_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          CONCLUSION=neutral
          if [[ '${{ inputs.mode }}' == 'final' ]]; then
            CONCLUSION=failure
            if [[ "${{ steps.aggregate.outcome }}" == "success" && "${{ steps.evidence.outcome }}" == "success" && "${{ steps.upload-evidence.outcome }}" == "success" ]]; then CONCLUSION=success; fi
          fi
          gh api --method POST "repos/${REPOSITORY}/check-runs" \
            -f name='Release Candidate / certification' \
            -f external_id="${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            -f details_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f head_sha="${CANDIDATE_SHA}" \
            -f status=completed \
            -f conclusion="${CONCLUSION}" \
            -f 'output[title]=Frozen exact-SHA candidate' \
            -f "output[summary]=${CONCLUSION}: ${CANDIDATE_SHA}"
      - name: Fail candidate certification when any required evidence failed
        if: >-
          always() &&
          inputs.mode == 'final' &&
          (steps.aggregate.outcome != 'success' ||
           steps.evidence.outcome != 'success' ||
           steps.upload-evidence.outcome != 'success')
        run: exit 1
