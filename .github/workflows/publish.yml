# Research basis: tauri-apps/tauri-action v0 — https://github.com/tauri-apps/tauri-action
# Arch Linux AUR CI pattern: archlinux:base-devel container + useradd/makepkg.
# AppImage: bundled by Tauri 2 on Linux; fuse2 required on host to run it.
# deb/rpm: Tauri 2 produces these natively on Linux; no external tooling needed.
# dmg: Tauri 2 on macos-latest; no notarisation in this stub (add secrets later).
# msi/nsis: Tauri 2 on windows-latest.
name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Quality gate (Linux, fastest runner) ────────────────────────────────────
  gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@a5ac7e51b41094c92402da3b243b9e2b7c2e1d6f

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@a2758e4818c2e4f4493a1d255f4662f19b65acf2
        with:
          components: rustfmt, clippy

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libfontconfig1-dev libglib2.0-dev libsoup-3.0-dev \
            libgdk-pixbuf2.0-dev libcairo2-dev libpango1.0-dev \
            cmake pkg-config

      - uses: Swatinem/rust-cache@f74c8cc5f54c0e3f1e043d6a4685b8489aee9c1b

      - uses: pnpm/action-setup@v4.0.0
        with:
          version: 11.9.0

      - uses: actions/setup-node@1a4442cda7143948ae1d52f1a60fd880ff95df6a
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: cargo fmt check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (workspace)
        run: cargo test --workspace --all-targets

      - name: cargo test (desktop)
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --features custom-protocol

      - name: pnpm typecheck
        run: pnpm typecheck

      - name: pnpm lint
        run: pnpm lint

      - name: pnpm test
        run: pnpm test

      - name: token gate
        run: pnpm audit:tokens

      - name: emoji gate
        run: pnpm audit:emoji

      - name: Automated failure debug
        if: failure()
        run: node scripts/ci-debug.mjs --run-id ${{ github.run_id }} --output ci-debug-report.md || true

      - name: Upload debug report
        if: failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0bbc538f
        with:
          name: strata-debug-publish-gate-${{ github.run_id }}
          path: ci-debug-report.md
          if-no-files-found: ignore

  # ── Platform bundles ─────────────────────────────────────────────────────────
  bundle:
    name: Bundle (${{ matrix.name }})
    needs: gate
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: AppImage + deb (single runner; both outputs captured)
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
            artifact_glob: |
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
              apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm

          # macOS: universal dmg (Intel + Apple Silicon)
          - name: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            bundles: dmg
            artifact_glob: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

          # Windows: msi + nsis installer
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
            artifact_glob: |
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@a5ac7e51b41094c92402da3b243b9e2b7c2e1d6f

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@a2758e4818c2e4f4493a1d255f4662f19b65acf2
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libfontconfig1-dev libglib2.0-dev libsoup-3.0-dev \
            libgdk-pixbuf2.0-dev libcairo2-dev libpango1.0-dev \
            cmake pkg-config patchelf

      - name: Install macOS Rust targets (universal)
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Install Windows Rust target
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@f74c8cc5f54c0e3f1e043d6a4685b8489aee9c1b
        with:
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@v4.0.0
        with:
          version: 11.9.0

      - uses: actions/setup-node@1a4442cda7143948ae1d52f1a60fd880ff95df6a
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build
        working-directory: apps/desktop

      - name: Tauri build (Linux / Windows)
        if: runner.os != 'macOS'
        run: pnpm tauri build --bundles ${{ matrix.bundles }} --ci
        working-directory: apps/desktop

      - name: Tauri build (macOS universal)
        if: runner.os == 'macOS'
        run: pnpm tauri build --bundles ${{ matrix.bundles }} --target universal-apple-darwin --ci
        working-directory: apps/desktop

      - name: Automated failure debug
        if: failure()
        run: node scripts/ci-debug.mjs --run-id ${{ github.run_id }} --output ci-debug-report.md || true

      - name: Upload debug report
        if: failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0bbc538f
        with:
          name: strata-debug-publish-${{ matrix.name }}-${{ github.run_id }}
          path: ci-debug-report.md
          if-no-files-found: ignore

      - name: Upload artifacts
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0bbc538f
        with:
          name: strata-${{ matrix.name }}
          path: |
            apps/desktop/src-tauri/target/**/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/**/bundle/deb/*.deb
            apps/desktop/src-tauri/target/**/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/**/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/bundle/msi/*.msi
            apps/desktop/src-tauri/target/**/bundle/nsis/*.exe
          if-no-files-found: error

  # ── AUR PKGBUILD validation (Arch Linux container) ───────────────────────────
  # Standard AUR CI pattern: useradd non-root builder + makepkg inside the container.
  # makepkg prohibits running as root; --skipinteg skips network-fetched checksums
  # so the container doesn't need internet access to sources at validate time.
  aur-validate:
    name: AUR PKGBUILD validate
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@a5ac7e51b41094c92402da3b243b9e2b7c2e1d6f

      - name: Set up non-root builder
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder dist/aur

      - name: Update pacman keyring
        run: pacman -Sy --noconfirm archlinux-keyring

      - name: Validate source PKGBUILD
        run: |
          cd dist/aur/strata-desktop
          su -c "makepkg --printsrcinfo > .SRCINFO" builder
          su -c "namcap PKGBUILD" builder || true

      - name: Validate bin PKGBUILD
        run: |
          cd dist/aur/strata-desktop-bin
          su -c "makepkg --printsrcinfo > .SRCINFO" builder
          su -c "namcap PKGBUILD" builder || true

      - name: Automated failure debug
        if: failure()
        run: node scripts/ci-debug.mjs --run-id ${{ github.run_id }} --output ci-debug-report.md || true

      - name: Upload debug report
        if: failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0bbc538f
        with:
          name: strata-debug-aur-${{ github.run_id }}
          path: ci-debug-report.md
          if-no-files-found: ignore

  # ── GitHub Release ────────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    needs: [bundle, aur-validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@a5ac7e51b41094c92402da3b243b9e2b7c2e1d6f

      - name: Download all artifacts
        uses: actions/download-artifact@65a9edc535144f24f5bb5979b6c2cd39a097d35d
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@a93c152f95b7f9419e123c1ff5b8e06c1a8f5a9a
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: Strata ${{ github.ref_name || inputs.tag }}
          draft: true
          generate_release_notes: true
          files: release-artifacts/**/*
          body: |
            ## Strata ${{ github.ref_name || inputs.tag }}

            ### Download

            | Platform | Package | Notes |
            |---|---|---|
            | Linux x86_64 | `.AppImage` | Universal — runs on any x86_64 Linux with fuse2 |
            | Linux x86_64 | `.deb` | Debian / Ubuntu 22.04+ |
            | Linux x86_64 | `.rpm` | Fedora / RHEL |
            | Arch / CachyOS | AUR: `strata-desktop-bin` | AppImage wrapper via AUR |
            | macOS (Universal) | `.dmg` | macOS 13 Ventura+ — Intel + Apple Silicon |
            | Windows x86_64 | `.msi` | Windows 10/11 |
            | Windows x86_64 | `.exe` | NSIS installer |

            ### Arch Linux (AUR)

            ```sh
            # Binary package (fast — uses the AppImage above)
            yay -S strata-desktop-bin

            # Or build from source (~10-30 min)
            yay -S strata-desktop
            ```

            > **Note:** This is a draft release. Edit and publish after smoke-testing artifacts.
            > CI has no real GPU access (see `docs/architecture/render-pipeline.md` Known Gaps) —
            > run the [WebGPU manual verification checklist](https://github.com/${{ github.repository }}/blob/${{ github.ref_name || inputs.tag }}/docs/architecture/webgpu-manual-verification.md)
            > on real hardware before publishing if the WebGPU compositor path changed this release.

      - name: Automated failure debug
        if: failure()
        run: node scripts/ci-debug.mjs --run-id ${{ github.run_id }} --output ci-debug-report.md || true

      - name: Upload debug report
        if: failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0bbc538f
        with:
          name: strata-debug-release-${{ github.run_id }}
          path: ci-debug-report.md
          if-no-files-found: ignore
