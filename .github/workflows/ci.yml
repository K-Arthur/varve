name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Limit simultaneous runner acquisitions: firing all three OS cells at
      # once is what starves the hosted runner pool during Actions incidents.
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy
      - name: Install Linux system deps (Tauri / wgpu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libfontconfig1-dev libglib2.0-dev cmake pkg-config
      - uses: Swatinem/rust-cache@3cf7f8cc28d1b4e7d01e3783be10a97d55d483c8
      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 11.9.0
      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch onnxruntime native libs
        run: node scripts/fetch-onnxruntime.mjs
      - name: Build frontend (required by tauri generate_context!)
        run: pnpm build
        working-directory: apps/desktop
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-targets
      - name: cargo test (desktop)
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --features custom-protocol
      # One-shot diagnosis for STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139) on the
      # Windows test harness: dumpbin lists the exe's actual import table.
      - name: Diagnose Windows entry-point failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem 'apps/desktop/src-tauri/target/debug/deps/varve_desktop_lib-*.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $exe) { Write-Host 'exe not found'; exit 0 }
          Write-Host "exe: $($exe.FullName) size=$($exe.Length)"
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' 2>$null |
            Select-Object -First 1
          if (-not $dumpbin) { Write-Host 'dumpbin not found'; exit 0 }
          Write-Host "dumpbin: $dumpbin"
          & $dumpbin /imports $exe.FullName 2>&1 |
            Select-String -Pattern '\.dll' |
            ForEach-Object { $_.Line.Trim() } |
            Sort-Object -Unique
          Write-Host '--- runtime versions ---'
          Get-Item C:\Windows\System32\VCRUNTIME140.dll, C:\Windows\System32\VCRUNTIME140D.dll, C:\Windows\System32\MSVCP140.dll, C:\Windows\System32\ucrtbase.dll, C:\Windows\System32\api-ms-win-core-synch-l1-2-0.dll -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "$($_.Name): $($_.VersionInfo.FileVersion)" }
      - name: Install cargo-llvm-cov
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf
        with:
          tool: cargo-llvm-cov
      - name: Install just
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf
        with:
          tool: just@1.54.0
      - name: Rust coverage (ratchet floor)
        if: runner.os == 'Linux'
        run: node scripts/audit-rust-coverage.mjs --ci
      - name: wasm check
        if: runner.os == 'Linux'
        run: just wasm-check
      - name: Install wasm-pack
        if: runner.os == 'Linux'
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi
      - name: wasm build (base + simd)
        if: runner.os == 'Linux'
        run: just wasm-build-all
      - name: Upload wasm artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: varve-wasm
          path: apps/desktop/public/wasm/
      - name: Automated failure debug
        if: failure()
        run: node scripts/ci-debug.mjs --run-id ${{ github.run_id }} --output ci-debug-report.md || true
      - name: Upload debug report
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: varve-debug-rust-${{ matrix.os }}-${{ github.run_id }}
          path: ci-debug-report.md
          if-no-files-found: ignore
      - name: Post debug report to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pr-debug-comment.mjs --run-id ${{ github.run_id }} --repo ${{ github.repository }} --report ci-debug-report.md || true

  pipeline-validate:
    name: Pipeline validation (workflow + SHA pins)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Validate workflow YAML + structure
        run: node scripts/validate-workflows.mjs
      - name: Static pin check (no mutable refs)
        run: node scripts/pin-github-actions.mjs --check
      - name: Verify pinned SHAs resolve upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pin-github-actions.mjs --verify
      - name: Verify extractor logic
        run: node scripts/ci-debug.test.mjs
      - name: Verify health classifier
        run: node scripts/ci-health.test.mjs
      - name: Verify release version consistency
        # Version drift across the five manifests (package.json x2,
        # tauri.conf.json, workspace + desktop Cargo.toml) must never land on
        # master silently — release.yml only catches it at tag time, when a
        # fix means another commit + tag. Cheap and dependency-free.
        run: node scripts/release/version.mjs verify
      - name: Verify pin-table integrity
        run: node scripts/pin-github-actions.test.mjs
      - name: Verify CI shell scripts
        run: bash scripts/test-ci-shell-scripts.sh

  js:
    name: JS (pnpm)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 11.9.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      - name: token gate
        run: pnpm audit:tokens
      - name: emoji gate
        run: pnpm audit:emoji
      - name: test
        run: pnpm test
      - name: render-path perf gate (ratio-based, not absolute wall-clock)
        run: node scripts/audit-render-perf.mjs --ci
      - name: Automated failure debug
        if: failure()
        run: node scripts/ci-debug.mjs --run-id ${{ github.run_id }} --output ci-debug-report.md || true
      - name: Upload debug report
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: varve-debug-js-${{ github.run_id }}
          path: ci-debug-report.md
          if-no-files-found: ignore
      - name: Post debug report to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pr-debug-comment.mjs --run-id ${{ github.run_id }} --repo ${{ github.repository }} --report ci-debug-report.md || true

  website-e2e:
    name: Website E2E (dual deployment modes)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 11.9.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      # The website must build and pass its whole suite in BOTH deployment
      # modes from the same source: the /varve GitHub Pages project site and a
      # root custom domain. The e2e servers mount the project-site build beneath
      # an actual /varve/ path — a server at / alone cannot detect base-path
      # escapes.
      - name: Build project-site mode
        run: pnpm build:website
      - name: Build custom-domain (root) mode
        run: pnpm build:website:root
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Website E2E (both modes)
        run: pnpm exec playwright test -c playwright.website.config.ts

  e2e:
    name: E2E (Playwright)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 11.9.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Download wasm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: varve-wasm
          path: apps/desktop/public/wasm/
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E (chromium)
        run: pnpm exec playwright test --project=chromium
      - name: Visual regression (canvas replay)
        run: pnpm exec playwright test --project=chromium-visual-1x --project=chromium-visual-2x
      - name: Build visual diff report
        if: failure()
        run: node scripts/build-visual-diff-manifest.mjs
      - name: Upload visual diff report
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: varve-visual-diff-${{ github.run_id }}
          path: visual-diff-report/
          if-no-files-found: ignore
      - name: Automated failure debug
        if: failure()
        run: node scripts/ci-debug.mjs --run-id ${{ github.run_id }} --output ci-debug-report.md || true
      - name: Upload debug report
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: varve-debug-e2e-${{ github.run_id }}
          path: ci-debug-report.md
          if-no-files-found: ignore
      - name: Post debug report to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pr-debug-comment.mjs --run-id ${{ github.run_id }} --repo ${{ github.repository }} --report ci-debug-report.md || true

  desktop-e2e:
    name: Native desktop E2E (${{ matrix.name }})
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x11
            os: ubuntu-latest
            xvfb: true
          - name: windows-x64
            os: windows-latest
            xvfb: false
          - name: macos
            os: macos-latest
            xvfb: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 11.9.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Linux system deps (Tauri + WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libfontconfig1-dev libglib2.0-dev libsoup-3.0-dev \
            libgdk-pixbuf2.0-dev libcairo2-dev libpango1.0-dev \
            cmake pkg-config patchelf xvfb dbus-x11 at-spi2-core mesa-utils
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: Swatinem/rust-cache@3cf7f8cc28d1b4e7d01e3783be10a97d55d483c8
      - name: Download wasm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: varve-wasm
          path: apps/desktop/public/wasm/
      - name: Run native desktop E2E (Linux Xvfb)
        if: matrix.xvfb
        run: dbus-run-session -- xvfb-run --auto-servernum pnpm test:desktop:native
      - name: Run native desktop E2E (Windows/macOS)
        if: ${{ !matrix.xvfb }}
        run: pnpm test:desktop:native
      - name: Automated failure debug
        if: failure()
        run: node scripts/ci-debug.mjs --run-id ${{ github.run_id }} --output ci-debug-report.md || true
      - name: Upload debug report
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: varve-debug-desktop-e2e-${{ github.run_id }}
          path: ci-debug-report.md
          if-no-files-found: ignore
      - name: Post debug report to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pr-debug-comment.mjs --run-id ${{ github.run_id }} --repo ${{ github.repository }} --report ci-debug-report.md || true
      - name: Upload native GUI artifacts
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: varve-native-artifacts-${{ matrix.name }}-${{ github.run_id }}
          path: artifacts/desktop/
          if-no-files-found: ignore
