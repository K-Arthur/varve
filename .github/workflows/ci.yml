name: CI

on:
  push:
    # Integration work is pushed to an immutable, short-lived ref before it
    # is fast-forwarded to master. Run the same planner on that route so the
    # bootstrap path is exercised by CI rather than only documented.
    branches: [master, 'varve/integration-*']
  pull_request:
  workflow_dispatch:
  schedule:
    # Periodic full-suite safety net (see docs/quality/validation-strategy.md)
    - cron: '0 2 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR validation may cancel obsolete commits. Master, scheduled, and manual
  # certification runs are evidence for a stable ref and must not be silently
  # cancelled by a later push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Explicit least privilege: the repo default is read-only, and this block
# makes that durable against future settings changes. PR jobs never receive a
# write-capable token; the trusted workflow_run debug job owns PR comments.
permissions:
  contents: read
  actions: read
  checks: read

jobs:
  changes:
    name: Change lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      js: ${{ steps.lanes.outputs.js }}
      rust: ${{ steps.lanes.outputs.rust }}
      desktop: ${{ steps.lanes.outputs.desktop }}
      website: ${{ steps.lanes.outputs.website }}
      e2e: ${{ steps.lanes.outputs.e2e }}
      visual: ${{ steps.lanes.outputs.visual }}
      docs: ${{ steps.lanes.outputs.docs }}
      full: ${{ steps.lanes.outputs.full }}
      models: ${{ steps.lanes.outputs.models }}
      wasm: ${{ steps.lanes.outputs.wasm }}
      bench: ${{ steps.lanes.outputs.bench }}
      global: ${{ steps.lanes.outputs.global }}
      integration: ${{ steps.lanes.outputs.integration }}
      candidate: ${{ steps.lanes.outputs.candidate }}
      e2e_shards: ${{ steps.lanes.outputs.e2e_shards }}
      e2e_shard_count: ${{ steps.lanes.outputs.e2e_shard_count }}
      demo_dist: ${{ steps.lanes.outputs.demo_dist }}
      plan_hash: ${{ steps.lanes.outputs.plan_hash }}
      policy_hash: ${{ steps.lanes.outputs.policy_hash }}
      commit_sha: ${{ steps.lanes.outputs.commit_sha }}
      plan_artifact_id: ${{ steps.upload-plan.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Checkout's default ref is the immutable event SHA. Keeping the
          # checkout on that ref avoids routing a source ref through a job
          # output, which CodeQL correctly treats as an unsafe checkout input
          # in scheduled/manual runs. The generated plan records and validates
          # the exact commit that this checkout resolves to.
          fetch-depth: 0
      - id: lanes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          HEAD="$(git rev-parse --verify 'HEAD^{commit}')"
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # Scheduled/manual runs are deliberate certification runs. The
            # canonical planner still writes the plan, but force-full makes
            # every promised category explicit rather than relying on regexes.
            node scripts/quality/ci-plan.mjs --base "$HEAD" --head "$HEAD" --force-full \
              --profile integration --output ci-plan.json --github-output "$GITHUB_OUTPUT"
          else
            BASE="$PR_BASE"
            if [[ -z "$BASE" || "$BASE" == "null" ]]; then BASE="$EVENT_BEFORE"; fi
            if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
              echo "No safe event comparison base was supplied by GitHub." >&2
              exit 2
            fi
            node scripts/quality/ci-plan.mjs --base "$BASE" --head "$HEAD" \
              --profile integration --output ci-plan.json --github-output "$GITHUB_OUTPUT"
          fi
      - name: Upload canonical CI plan
        id: upload-plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-ci-plan-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ci-plan.json
          retention-days: 14

  attribution-check:
    name: AI attribution guard
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: changes
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Scan PR commits for prohibited AI attribution
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          FOUND=0
          while IFS= read -r sha; do
            MSG=$(git log -1 --format='%B' "$sha")
            if echo "$MSG" | grep -qiE '^Co-authored-by:.*(claude|anthropic|devin|cognition|copilot|codex|chatgpt|openai|gemini|cursor|windsurf|opencode|strata.agent|cascade)'; then
              echo "::error file=.githooks/commit-msg::Commit $sha contains AI Co-authored-by trailer"
              FOUND=1
            fi
            if echo "$MSG" | grep -qiE '(Generated with \[Devin\]|Generated by Claude|Generated with Claude|Created with Devin|Written with Copilot|Generated by Codex|AI-generated commit|AI-assisted commit)'; then
              echo "::error file=.githooks/commit-msg::Commit $sha contains AI generation attribution"
              FOUND=1
            fi
            if echo "$MSG" | grep -qiE '^Co-authored-by:.*<<[A-Z_]+>>'; then
              echo "::error file=.githooks/commit-msg::Commit $sha contains placeholder co-author trailer"
              FOUND=1
            fi
          done < <(git rev-list "$BASE".."$HEAD" 2>/dev/null || true)
          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "Commit messages contain prohibited AI tool attribution."
            echo "See AGENTS.md §Hard rules for policy."
            exit 1
          fi
          echo "No prohibited AI attribution found in PR commits."

  rust:
    permissions:
      contents: read
      actions: read
      checks: read
    name: Rust (${{ matrix.os }})
    timeout-minutes: 60
    needs: [changes, pipeline-validate]
    if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.full == 'true' }}
    strategy:
      fail-fast: false
      # Limit simultaneous runner acquisitions: firing all three OS cells at
      # once is what starves the hosted runner pool during Actions incidents.
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install Linux system deps (Tauri / wgpu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libfontconfig1-dev libglib2.0-dev cmake pkg-config
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Download canonical CI plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ needs.changes.outputs.plan_artifact_id }}
          path: ci-plan-artifact
      - name: Run selected Rust crate lanes
        run: node scripts/quality/ci-run-lanes.mjs --plan ci-plan-artifact/ci-plan.json --category rust --profile integration --matrix "${{ matrix.os }}" --report "ci-execution/rust-${{ matrix.os }}.json"
      - name: Upload Rust execution receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-ci-execution-${{ github.run_id }}-rust-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: ci-execution/
          if-no-files-found: ignore
      # One-shot diagnosis for STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139) on the
      # Windows test harness: compares imports against runner DLL exports.
      - name: Diagnose Windows entry-point failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: pwsh -File "$env:GITHUB_WORKSPACE/scripts/ci/diagnose-entrypoint.ps1"
      - name: Install cargo-llvm-cov for full integration certification
        if: runner.os == 'Linux' && needs.changes.outputs.full == 'true'
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172
        with:
          tool: cargo-llvm-cov
      - name: Stage ONNX Runtime for desktop coverage
        if: runner.os == 'Linux' && needs.changes.outputs.full == 'true'
        run: node scripts/fetch-onnxruntime.mjs
      - name: Rust coverage (ratchet floor)
        if: runner.os == 'Linux' && needs.changes.outputs.full == 'true'
        run: node scripts/audit-rust-coverage.mjs --ci
      # Failure diagnostics are produced once per failed run by the ci-debug.yml
      # workflow_run, which sees every job's finalized logs. Generating the
      # report inside each job duplicated the whole-run log download (16 copies
      # for the sharded E2E lane) and every copy was partial because sibling
      # shards were still running.

  # WASM is a first-class producer. Keeping it separate from the three-OS Rust
  # matrix makes the artifact dependency explicit and lets browser/native jobs
  # wait for the exact producer rather than relying on a Linux matrix cell's
  # side effect.
  wasm:
    name: WASM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes, pipeline-validate]
    if: ${{ needs.changes.outputs.wasm == 'true' || needs.changes.outputs.e2e == 'true' || needs.changes.outputs.visual == 'true' || needs.changes.outputs.desktop == 'true' || needs.changes.outputs.full == 'true' }}
    outputs:
      artifact_id: ${{ steps.upload-wasm.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install just
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172
        with:
          tool: just@1.54.0
      - name: WASM check
        run: just wasm-check
      - name: Install wasm-pack (pinned, verified)
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172
        with:
          tool: wasm-pack@0.13.1
          checksum: true
          fallback: none
      - name: Build WASM (base + SIMD + colour)
        run: just wasm-build-all
      - name: Upload WASM artifact
        id: upload-wasm
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-wasm-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: apps/desktop/public/wasm/
      - name: Write WASM execution receipt
        if: always()
        env:
          VARVE_CI_COMMIT_SHA: ${{ needs.changes.outputs.commit_sha }}
          VARVE_CI_PLAN_HASH: ${{ needs.changes.outputs.plan_hash }}
          VARVE_CI_POLICY_HASH: ${{ needs.changes.outputs.policy_hash }}
          VARVE_CI_STATUS: ${{ job.status }}
        run: node scripts/quality/ci-execution-report.mjs --category wasm --lanes wasm --matrix ubuntu-latest --status "${{ job.status }}" --output ci-execution/wasm.json
      - name: Upload WASM execution receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-ci-execution-${{ github.run_id }}-wasm-attempt-${{ github.run_attempt }}
          path: ci-execution/
          if-no-files-found: ignore
      # Diagnostics come from ci-debug.yml (workflow_run) — see the Rust job.

  pipeline-validate:
    name: Pipeline validation (workflow + SHA pins)
    runs-on: ubuntu-latest
    # This gate installs the workspace and runs the exact-SHA preflight plus
    # all CI tooling/security checks. Hosted pnpm bootstrap can occasionally
    # consume several minutes before the gate itself starts; leave enough
    # budget for validation rather than converting a slow setup into a
    # cancelled certification.
    timeout-minutes: 20
    needs: changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # The workflow security policy audit parses YAML structurally (js-yaml,
      # a devDependency), so this job now installs once. The install is small
      # and cached; the job stays cheap.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install JS dependencies (frozen)
        run: pnpm install --frozen-lockfile
      - name: Install pinned advisory scanner (verified)
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172
        with:
          tool: cargo-audit@0.22.2
          checksum: true
          fallback: none
      - name: Audit production npm and both Cargo dependency graphs
        run: node scripts/security/dependency-advisories.mjs
      - name: Upload sanitized dependency advisory reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-dependency-advisories-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: reports/dependency-advisories/
          if-no-files-found: ignore
          retention-days: 14
      - name: Download canonical CI plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ needs.changes.outputs.plan_artifact_id }}
          path: ci-plan-artifact
      - name: Fast exact-SHA preflight
        run: node scripts/quality/ci-preflight.mjs --plan ci-plan-artifact/ci-plan.json
      # Pinned release + checksum rather than a third-party action: this job
      # is the workflow supply-chain gate, so it should not take on another
      # action dependency to do its work. validate-workflows.mjs runs
      # actionlint when it is on PATH and skips it when it is not.
      - name: Install actionlint (pinned + checksummed)
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" actionlint
          install -m 0755 actionlint /usr/local/bin/actionlint
          rm -f "$archive" actionlint
          actionlint -version
          # actionlint runs shellcheck over `run:` blocks only when shellcheck
          # is present. Runners ship it; assert that so a runner image change
          # cannot silently downgrade this job to structure-only checks.
          shellcheck --version | head -2
      - name: Validate workflow YAML + structure
        run: node scripts/validate-workflows.mjs
      - name: Static pin check (no mutable refs)
        run: node scripts/pin-github-actions.mjs --check
      - name: Verify pinned SHAs resolve upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pin-github-actions.mjs --verify
      - name: CI tooling regression suite
        # This is the concrete consumer for the canonical `ci-tools` lane. It
        # includes the push-plan, receipt, aggregator, release, workflow, and
        # security regression tests without starting product/browser suites.
        run: pnpm test:ci:tools
      - name: Validation policy regression tests
        # The policy lane is intentionally explicit: it is a TypeScript test
        # and is not part of the dependency-light Node tooling suite above.
        run: pnpm exec vitest run tests/unit/validationPolicy.test.ts --maxWorkers=1
      - name: Verify release version consistency
        # Version drift across all manifests (package.json x2,
        # tauri.conf.json, workspace + desktop Cargo.toml) must never land on
        # master silently — release.yml only catches it at tag time, when a
        # fix means another commit + tag. Cheap and dependency-free.
        run: node scripts/release/version.mjs verify
      - name: Validate AUR PKGBUILD syntax
        run: bash -n packaging/aur/varve-desktop-bin/PKGBUILD
      - name: Validate Flatpak manifest YAML
        run: node scripts/packaging/validate-flatpak-manifest.mjs
      - name: Validate Linux package metadata consistency
        run: node scripts/release/linux-package-metadata.test.mjs
      - name: Verify product truth (cross-source contradiction check)
        # Detects contradictions between canonical sources (version, platforms,
        # signing, document extension, changelog) and user-facing claims.
        run: node scripts/release/verify-product-truth.mjs
      - name: Secret scan (tracked tree)
        run: node scripts/secret-scan.mjs
      - name: Secret scan regression tests (canaries)
        run: node scripts/secret-scan.test.mjs
      - name: Workflow security policy audit
        run: node scripts/security/workflow-policy.mjs
      - name: Client environment guard (CI baseline)
        run: |
          node scripts/security/validate-client-env.mjs --app website
          node scripts/security/validate-client-env.mjs --app desktop
      - name: Import-boundary audit
        run: node scripts/security/import-boundaries.mjs
      - name: Write pipeline execution receipt
        if: always()
        env:
          VARVE_CI_COMMIT_SHA: ${{ needs.changes.outputs.commit_sha }}
          VARVE_CI_PLAN_HASH: ${{ needs.changes.outputs.plan_hash }}
          VARVE_CI_POLICY_HASH: ${{ needs.changes.outputs.policy_hash }}
          VARVE_CI_STATUS: ${{ job.status }}
        run: node scripts/quality/ci-execution-report.mjs --category pipeline --lanes pipeline-validate,ci-tools,policy --matrix ubuntu-latest --status "${{ job.status }}" --output ci-execution/pipeline.json
      - name: Upload pipeline execution receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-ci-execution-${{ github.run_id }}-pipeline-attempt-${{ github.run_attempt }}
          path: ci-execution/
          if-no-files-found: ignore

  js:
    permissions:
      contents: read
      actions: read
      checks: read
    name: JS (pnpm)
    timeout-minutes: 30
    needs: [changes, pipeline-validate]
    if: ${{ needs.changes.outputs.js == 'true' || needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Download canonical CI plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ needs.changes.outputs.plan_artifact_id }}
          path: ci-plan-artifact
      - name: Run selected JavaScript package lanes
        run: node scripts/quality/ci-run-lanes.mjs --plan ci-plan-artifact/ci-plan.json --category js --profile integration --matrix ubuntu-latest --report ci-execution/js.json
      - name: Upload JavaScript execution receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-ci-execution-${{ github.run_id }}-js-attempt-${{ github.run_attempt }}
          path: ci-execution/
          if-no-files-found: ignore
      # Diagnostics come from ci-debug.yml (workflow_run) — see the Rust job.

  website-e2e:
    name: Website E2E (dual deployment modes)
    timeout-minutes: 30
    needs: [changes, pipeline-validate]
    if: ${{ needs.changes.outputs.website == 'true' || needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    env:
      # Trust-boundary canary: present on every build step in this job, then
      # asserted ABSENT from the built artifacts below (see
      # docs/security/trust-boundaries.md §Canary tests).
      VARVE_PRIVATE_TEST_CANARY: VARVE_PRIVATE_TEST_CANARY_DO_NOT_SHIP
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Website unit tests
        run: pnpm test:website
      # The website must build and pass its whole suite in BOTH deployment
      # modes from the same source: the /varve GitHub Pages project site and a
      # root custom domain. The e2e servers mount the project-site build beneath
      # an actual /varve/ path — a server at / alone cannot detect base-path
      # escapes.
      - name: Build project-site mode (base /varve)
        run: pnpm build:website:pages
      - name: Build custom-domain (root) mode
        run: pnpm build:website
      - name: Scan website artifacts (secret + canary)
        run: |
          node scripts/secret-scan.mjs --dir apps/website/dist --canary "$VARVE_PRIVATE_TEST_CANARY"
          node scripts/secret-scan.mjs --dir apps/website/dist-pages --canary "$VARVE_PRIVATE_TEST_CANARY"
      - name: Restore Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Discover complete website case inventory
        env:
          VARVE_CI_COMMIT_SHA: ${{ needs.changes.outputs.commit_sha }}
          VARVE_CI_PLAN_HASH: ${{ needs.changes.outputs.plan_hash }}
          VARVE_CI_POLICY_HASH: ${{ needs.changes.outputs.policy_hash }}
        run: node scripts/quality/browser-inventory.mjs --lane website-e2e --config playwright.website.config.ts --output test-results/browser-inventory/website.json
      - name: Website E2E (both modes)
        env:
          VARVE_CI_PLAYWRIGHT_REPORT: test-results/ci-browser/website.json
        run: node scripts/quality/heavy-lease.mjs "CI website E2E" -- pnpm exec playwright test -c playwright.website.config.ts --workers=1 --retries=0 --update-snapshots=none --fail-on-flaky-tests --trace=retain-on-failure
      - name: Write website execution receipt
        if: always()
        env:
          VARVE_CI_COMMIT_SHA: ${{ needs.changes.outputs.commit_sha }}
          VARVE_CI_PLAN_HASH: ${{ needs.changes.outputs.plan_hash }}
          VARVE_CI_POLICY_HASH: ${{ needs.changes.outputs.policy_hash }}
          VARVE_CI_STATUS: ${{ job.status }}
        run: node scripts/quality/ci-execution-report.mjs --category website --lanes website-unit,website-e2e --matrix ubuntu-latest --status "${{ job.status }}" --output ci-execution/website.json --playwright-report website-e2e=test-results/ci-browser/website.json --playwright-inventory test-results/ci-browser/website.json=test-results/browser-inventory/website.json
      - name: Upload website execution receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-ci-execution-${{ github.run_id }}-website-attempt-${{ github.run_attempt }}
          path: ci-execution/
          if-no-files-found: ignore
      - name: Upload immutable website inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-browser-inventory-${{ github.run_id }}-website-attempt-${{ github.run_attempt }}
          path: test-results/browser-inventory/
          if-no-files-found: error
          retention-days: 14

  e2e:
    permissions:
      contents: read
      actions: read
      checks: read
    # One browser worker per hosted job prevents canvas/model resource contention.
    # The canonical policy uses twenty-four shards for the 1,907-case release
    # suite; complete discovered inventories prove the disjoint union of every
    # case. Timing receipts expose skew before it silently consumes the job
    # deadline.
    name: E2E (Playwright) ${{ matrix.shard }}/${{ needs.changes.outputs.e2e_shard_count }}
    # Sixteen shards ran 30-40 minutes each and the slowest twice hit this
    # ceiling (shard 11 in runs 37380722267 and 37391728360), losing the shard
    # and failing certification for its missing receipt. Twenty-four shards keep
    # every cell inside the ceiling; the 40m bound still stops a runaway cell.
    timeout-minutes: 40
    runs-on: ubuntu-latest
    needs: [changes, pipeline-validate, wasm]
    if: ${{ needs.changes.outputs.e2e == 'true' || needs.changes.outputs.full == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.e2e_shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Download wasm artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ needs.wasm.outputs.artifact_id }}
          path: apps/desktop/public/wasm/
      - name: Restore Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Download canonical CI plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ needs.changes.outputs.plan_artifact_id }}
          path: ci-plan-artifact
      - name: Build website for production-demo E2E
        if: needs.changes.outputs.demo_dist == 'true' && matrix.shard == 1
        run: pnpm --filter @varve/website build
        env:
          ANALYTICS_DOMAIN: varve.studio
      - name: Build production browser demo for E2E
        if: needs.changes.outputs.demo_dist == 'true' && matrix.shard == 1
        run: pnpm --filter @varve/desktop build:try
        env:
          VITE_VARVE_ANALYTICS_DOMAIN: varve.studio
      - name: Stage production demo for E2E
        if: needs.changes.outputs.demo_dist == 'true' && matrix.shard == 1
        run: node scripts/website/stage-demo.mjs
      - name: Scan staged production demo
        if: needs.changes.outputs.demo_dist == 'true' && matrix.shard == 1
        run: node scripts/secret-scan.mjs --dir apps/website/dist/try
      - name: Prepare disposable production-demo dist
        id: demo-input
        if: needs.changes.outputs.demo_dist == 'true' && matrix.shard == 1
        run: node scripts/website/demo-dist-validation.mjs prepare
        env:
          VARVE_DEMO_EXPECTED_SHA: ${{ needs.changes.outputs.commit_sha }}
          VARVE_DEMO_DIST_URL: http://127.0.0.1:15645
          VARVE_DEMO_E2E_OUTPUT_DIR: ci-demo-${{ github.run_id }}-${{ github.run_attempt }}
      - name: List complete production-demo inventory
        if: needs.changes.outputs.demo_dist == 'true' && matrix.shard == 1
        run: >-
          node scripts/quality/heavy-lease.mjs "CI: production-demo inventory" --
          pnpm exec playwright test -c playwright.demo-dist.config.mts --list
          --workers=1 --retries=0 --update-snapshots=none --fail-on-flaky-tests
          --trace=retain-on-failure
        env:
          VARVE_DEMO_EXPECTED_SHA: ${{ needs.changes.outputs.commit_sha }}
          VARVE_DEMO_DIST_URL: http://127.0.0.1:15645
          VARVE_DEMO_E2E_OUTPUT_DIR: ci-demo-${{ github.run_id }}-${{ github.run_attempt }}
          VARVE_CI_PLAYWRIGHT_REPORT: test-results/ci-demo-${{ github.run_id }}-${{ github.run_attempt }}/expected-cases.json
      - name: E2E (chromium)
        run: node scripts/quality/ci-run-lanes.mjs --plan ci-plan-artifact/ci-plan.json --category e2e --profile integration --shard "${{ matrix.shard }}/${{ needs.changes.outputs.e2e_shard_count }}" --matrix ubuntu-latest --report "ci-execution/e2e-${{ matrix.shard }}.json"
        env:
          VARVE_DEMO_EXPECTED_SHA: ${{ needs.changes.outputs.commit_sha }}
          VARVE_DEMO_DIST_URL: http://127.0.0.1:15645
          VARVE_DEMO_E2E_OUTPUT_DIR: ci-demo-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify complete production-demo browser evidence
        if: always() && needs.changes.outputs.demo_dist == 'true' && matrix.shard == 1 && steps.demo-input.outcome == 'success'
        run: node scripts/website/demo-dist-validation.mjs verify-report
        env:
          VARVE_DEMO_EXPECTED_SHA: ${{ needs.changes.outputs.commit_sha }}
          VARVE_DEMO_DIST_URL: http://127.0.0.1:15645
          VARVE_DEMO_E2E_OUTPUT_DIR: ci-demo-${{ github.run_id }}-${{ github.run_attempt }}
          VARVE_CI_PLAYWRIGHT_REPORT: test-results/ci-demo-${{ github.run_id }}-${{ github.run_attempt }}/playwright.json
      - name: Verify production-demo source artifact unchanged
        if: always() && needs.changes.outputs.demo_dist == 'true' && matrix.shard == 1 && steps.demo-input.outcome == 'success'
        run: node scripts/website/demo-dist-validation.mjs assert-unchanged
        env:
          VARVE_DEMO_EXPECTED_SHA: ${{ needs.changes.outputs.commit_sha }}
          VARVE_DEMO_DIST_URL: http://127.0.0.1:15645
          VARVE_DEMO_E2E_OUTPUT_DIR: ci-demo-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload E2E execution receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-ci-execution-${{ github.run_id }}-e2e-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ci-execution/
          if-no-files-found: ignore
      # always(): a job that exceeds timeout-minutes is cancelled, not failed,
      # so `if: failure()` steps are skipped and a timed-out run used to leave
      # nothing at all behind to diagnose.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-e2e-report-${{ github.run_id }}-shard${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      # Diagnostics come from ci-debug.yml (workflow_run), not per shard — see
      # the Rust job for why.

      - name: Upload immutable complete browser inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-browser-inventory-${{ github.run_id }}-e2e-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            test-results/ci-browser-${{ github.run_id }}-${{ github.run_attempt }}/*.inventory.json
            test-results/ci-demo-${{ github.run_id }}-${{ github.run_attempt }}/playwright.json.inventory.json
          if-no-files-found: error
          retention-days: 14

  # Split out of e2e so the snapshot projects run once rather than per shard.
  e2e-visual:
    permissions:
      contents: read
      actions: read
      checks: read
    name: Visual regression (canvas replay)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: [changes, pipeline-validate, wasm]
    if: ${{ needs.changes.outputs.visual == 'true' || needs.changes.outputs.full == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Download wasm artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ needs.wasm.outputs.artifact_id }}
          path: apps/desktop/public/wasm/
      - name: Restore Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Discover CPU visual case inventory
        env:
          VARVE_CI_COMMIT_SHA: ${{ needs.changes.outputs.commit_sha }}
          VARVE_CI_PLAN_HASH: ${{ needs.changes.outputs.plan_hash }}
          VARVE_CI_POLICY_HASH: ${{ needs.changes.outputs.policy_hash }}
        run: node scripts/quality/browser-inventory.mjs --lane e2e:visual --project chromium-visual-1x --project chromium-visual-2x --project chromium-visual-3x --output test-results/browser-inventory/visual-cpu.json
      - name: Visual regression (canvas replay)
        env:
          VARVE_VISUAL_HARNESS_ONLY: '1'
          VARVE_CI_PLAYWRIGHT_REPORT: test-results/ci-browser/visual-cpu.json
        run: node scripts/quality/heavy-lease.mjs "CI canvas visual E2E" -- pnpm exec playwright test --project=chromium-visual-1x --project=chromium-visual-2x --project=chromium-visual-3x --workers=1 --retries=0 --update-snapshots=none --fail-on-flaky-tests --trace=retain-on-failure
      - name: Discover GPU visual case inventory
        env:
          VARVE_CI_COMMIT_SHA: ${{ needs.changes.outputs.commit_sha }}
          VARVE_CI_PLAN_HASH: ${{ needs.changes.outputs.plan_hash }}
          VARVE_CI_POLICY_HASH: ${{ needs.changes.outputs.policy_hash }}
          VARVE_VISUAL_GPU: '1'
        run: node scripts/quality/browser-inventory.mjs --lane e2e:visual --project chromium-visual-gpu --output test-results/browser-inventory/visual-gpu.json
      - name: Visual regression (GPU-backed Chromium)
        env:
          VARVE_VISUAL_HARNESS_ONLY: '1'
          VARVE_VISUAL_GPU: '1'
          VARVE_CI_PLAYWRIGHT_REPORT: test-results/ci-browser/visual-gpu.json
        run: node scripts/quality/heavy-lease.mjs "CI GPU visual E2E" -- pnpm exec playwright test --project=chromium-visual-gpu --workers=1 --retries=0 --update-snapshots=none --fail-on-flaky-tests --trace=retain-on-failure
      - name: Build visual diff report
        if: failure()
        run: node scripts/build-visual-diff-manifest.mjs
      - name: Upload visual diff report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-visual-diff-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: visual-diff-report/
          if-no-files-found: ignore
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-e2e-visual-report-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Write visual execution receipt
        if: always()
        env:
          VARVE_CI_COMMIT_SHA: ${{ needs.changes.outputs.commit_sha }}
          VARVE_CI_PLAN_HASH: ${{ needs.changes.outputs.plan_hash }}
          VARVE_CI_POLICY_HASH: ${{ needs.changes.outputs.policy_hash }}
          VARVE_CI_STATUS: ${{ job.status }}
        run: node scripts/quality/ci-execution-report.mjs --category visual --lanes e2e:visual --matrix ubuntu-latest --status "${{ job.status }}" --output ci-execution/visual.json --playwright-report e2e:visual=test-results/ci-browser/visual-cpu.json --playwright-report e2e:visual=test-results/ci-browser/visual-gpu.json --playwright-inventory test-results/ci-browser/visual-cpu.json=test-results/browser-inventory/visual-cpu.json --playwright-inventory test-results/ci-browser/visual-gpu.json=test-results/browser-inventory/visual-gpu.json
      - name: Upload visual execution receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-ci-execution-${{ github.run_id }}-visual-attempt-${{ github.run_attempt }}
          path: ci-execution/
          if-no-files-found: ignore
      # Diagnostics come from ci-debug.yml (workflow_run) — see the Rust job.

      - name: Upload immutable visual inventories
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-browser-inventory-${{ github.run_id }}-visual-attempt-${{ github.run_attempt }}
          path: test-results/browser-inventory/
          if-no-files-found: error
          retention-days: 14

  desktop-e2e:
    permissions:
      contents: read
      actions: read
      checks: read
    name: Native desktop E2E (${{ matrix.name }})
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    needs: [changes, pipeline-validate, wasm]
    if: ${{ needs.changes.outputs.desktop == 'true' || needs.changes.outputs.full == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x11
            os: ubuntu-latest
            xvfb: true
          - name: windows-x64
            os: windows-latest
            xvfb: false
          - name: macos
            os: macos-latest
            xvfb: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Linux system deps (Tauri + WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libfontconfig1-dev libglib2.0-dev libsoup-3.0-dev \
            libgdk-pixbuf2.0-dev libcairo2-dev libpango1.0-dev \
            cmake pkg-config patchelf xvfb dbus-x11 at-spi2-core mesa-utils
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Download wasm artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ needs.wasm.outputs.artifact_id }}
          path: apps/desktop/public/wasm/
      - name: Run native desktop E2E (Linux Xvfb)
        if: matrix.xvfb
        run: dbus-run-session -- xvfb-run --auto-servernum pnpm test:desktop:native
      - name: Run native desktop E2E (Windows/macOS)
        if: ${{ !matrix.xvfb }}
        run: pnpm test:desktop:native
      - name: Write desktop execution receipt
        if: always()
        env:
          VARVE_CI_COMMIT_SHA: ${{ needs.changes.outputs.commit_sha }}
          VARVE_CI_PLAN_HASH: ${{ needs.changes.outputs.plan_hash }}
          VARVE_CI_POLICY_HASH: ${{ needs.changes.outputs.policy_hash }}
          VARVE_CI_STATUS: ${{ job.status }}
        run: node scripts/quality/ci-execution-report.mjs --category desktop --lanes desktop-native --matrix "${{ matrix.name }}" --status "${{ job.status }}" --output "ci-execution/desktop-${{ matrix.name }}.json"
      - name: Upload desktop execution receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-ci-execution-${{ github.run_id }}-desktop-${{ matrix.name }}-attempt-${{ github.run_attempt }}
          path: ci-execution/
          if-no-files-found: ignore
      # Diagnostics come from ci-debug.yml (workflow_run) — see the Rust job.
      - name: Upload native GUI artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-native-artifacts-${{ matrix.name }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/desktop/
          if-no-files-found: ignore

  bench:
    name: Render benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, pipeline-validate]
    if: ${{ needs.changes.outputs.bench == 'true' || needs.changes.outputs.full == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Render benchmark gate
        run: pnpm bench:canvas
      - name: Write benchmark execution receipt
        if: always()
        env:
          VARVE_CI_COMMIT_SHA: ${{ needs.changes.outputs.commit_sha }}
          VARVE_CI_PLAN_HASH: ${{ needs.changes.outputs.plan_hash }}
          VARVE_CI_POLICY_HASH: ${{ needs.changes.outputs.policy_hash }}
          VARVE_CI_STATUS: ${{ job.status }}
        run: node scripts/quality/ci-execution-report.mjs --category bench --lanes bench:render --matrix ubuntu-latest --status "${{ job.status }}" --output ci-execution/bench.json
      - name: Upload benchmark execution receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-ci-execution-${{ github.run_id }}-bench-attempt-${{ github.run_attempt }}
          path: ci-execution/
          if-no-files-found: ignore
      - name: Upload benchmark diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-bench-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            reports/
            test-results/
          if-no-files-found: ignore

  models:
    name: Model manifest and checksum policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, pipeline-validate]
    if: ${{ needs.changes.outputs.models == 'true' || needs.changes.outputs.full == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate model manifest and checksums
        run: node scripts/models/validate-manifest.mjs
      - name: Write model execution receipt
        if: always()
        env:
          VARVE_CI_COMMIT_SHA: ${{ needs.changes.outputs.commit_sha }}
          VARVE_CI_PLAN_HASH: ${{ needs.changes.outputs.plan_hash }}
          VARVE_CI_POLICY_HASH: ${{ needs.changes.outputs.policy_hash }}
          VARVE_CI_STATUS: ${{ job.status }}
        run: node scripts/quality/ci-execution-report.mjs --category models --lanes models --matrix ubuntu-latest --status "${{ job.status }}" --output ci-execution/models.json
      - name: Upload model execution receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-ci-execution-${{ github.run_id }}-models-attempt-${{ github.run_attempt }}
          path: ci-execution/
          if-no-files-found: ignore

  # This is the only required integration status. Dynamic jobs may be
  # deliberately skipped by the canonical plan, but a selected job that is
  # cancelled, timed out, missing, or failed is never flattened into green.
  certification:
    name: CI / certification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - changes
      - attribution-check
      - pipeline-validate
      - rust
      - wasm
      - js
      - website-e2e
      - e2e
      - e2e-visual
      - desktop-e2e
      - bench
      - models
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Download canonical plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ needs.changes.outputs.plan_artifact_id }}
          path: ci-plan-artifact
      - name: Download execution receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          pattern: varve-ci-execution-${{ github.run_id }}-*
          path: ci-execution
          merge-multiple: false
      - name: Aggregate certification evidence
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          printf '%s' "$NEEDS_JSON" > ci-needs.json
          node scripts/quality/aggregate-ci.mjs \
            --needs ci-needs.json \
            --plan ci-plan-artifact/ci-plan.json \
            --execution-dir ci-execution \
            --output ci-certification.json
      # Timing telemetry is diagnostic, independent of certification. It must
      # neither turn failed evidence green nor block recovery when reports are absent.
      - name: Summarize test timing and shard diagnostics
        id: test-feedback
        if: always()
        continue-on-error: true
        run: node scripts/quality/test-feedback.mjs ci-execution --summary > ci-feedback.json
      - name: Upload test feedback diagnostics
        if: ${{ always() && steps.test-feedback.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-test-feedback-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ci-feedback.json
          retention-days: 14
          if-no-files-found: error
      - name: Upload certification summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
