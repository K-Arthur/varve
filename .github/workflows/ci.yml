name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Periodic full-suite safety net (see docs/quality/validation-strategy.md)
    - cron: '0 2 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Explicit least privilege: the repo default is read-only, and this block
# makes that durable against future settings changes. The four jobs that post
# PR debug comments (rust/js/e2e/desktop-e2e) escalate `issues: write` — the
# narrow scope needed to create a comment — nothing more.
permissions:
  contents: read
  actions: read
  checks: read

jobs:
  changes:
    name: Change lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      js: ${{ steps.lanes.outputs.js }}
      rust: ${{ steps.lanes.outputs.rust }}
      desktop: ${{ steps.lanes.outputs.desktop }}
      website: ${{ steps.lanes.outputs.website }}
      e2e: ${{ steps.lanes.outputs.e2e }}
      visual: ${{ steps.lanes.outputs.visual }}
      docs: ${{ steps.lanes.outputs.docs }}
      full: ${{ steps.lanes.outputs.full }}
      models: ${{ steps.lanes.outputs.models }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: lanes
        run: |
          # Default to full on scheduled runs and workflow_dispatch (safety net).
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "js=true" >> "$GITHUB_OUTPUT"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            echo "website=true" >> "$GITHUB_OUTPUT"
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            echo "visual=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "models=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # PR / push: classify by changed paths.
          BASE="${{ github.event.pull_request.base.sha }}"
          if [[ -z "$BASE" || "$BASE" == "null" ]]; then BASE="${{ github.event.before }}"; fi
          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then BASE="$(git rev-list --max-parents=0 HEAD | tail -1)"; fi
          CHANGED="$(git diff --name-only "$BASE"...HEAD || git diff --name-only "$BASE" HEAD)"
          touch /tmp/changed.txt
          echo "$CHANGED" | grep -v '^$' > /tmp/changed.txt
          # Lanes (conservative: any hit enables the lane)
          if grep -qE '^(packages/(engine|scene|shared|editor|ui|platform|import|codegen|print|prototype|layout|compositor|ai|collab|crash|help|history|home|tokens)/|apps/desktop/src/)' /tmp/changed.txt; then echo "js=true" >> "$GITHUB_OUTPUT"; fi
          if grep -qE '^crates/|^apps/desktop/src-tauri/' /tmp/changed.txt; then echo "rust=true" >> "$GITHUB_OUTPUT"; echo "desktop=true" >> "$GITHUB_OUTPUT"; fi
          # Native desktop test infrastructure compiles and launches the
          # Tauri test binary even when the application source is unchanged.
          # Keep its Rust prerequisite enabled so desktop-e2e cannot be
          # silently skipped after a WDIO/configuration-only repair.
          if grep -qE '^(tests/wdio/|wdio\.conf\.ts$|scripts/desktop/|apps/desktop/src-tauri/tauri\.test\.conf\.json$)' /tmp/changed.txt; then echo "rust=true" >> "$GITHUB_OUTPUT"; echo "desktop=true" >> "$GITHUB_OUTPUT"; fi
          if grep -qE '^apps/website/' /tmp/changed.txt; then echo "website=true" >> "$GITHUB_OUTPUT"; fi
          # The browser and visual lanes download the WASM artifact produced
          # by the Rust job, so a test-only change must still select Rust.
          # Shared fixtures/helpers and the Playwright config are browser
          # infrastructure changes too; select the browser lane explicitly.
          if grep -qE '^tests/e2e/(canvas|settings|export|menus|layers|motion|home|editor|startup|save|thumbnails|workspace|logo|effects|gradient-map|model-quality|icons|inspector|intelligence|crash|workflow|format|a11y|shared|helpers|fixtures)/|^tests/e2e/.*\.spec\.ts$|^playwright\.config\.ts$' /tmp/changed.txt; then echo "e2e=true" >> "$GITHUB_OUTPUT"; echo "rust=true" >> "$GITHUB_OUTPUT"; fi
          if grep -qE '^tests/e2e/visual/|^tests/e2e/canvas/.*visual.*spec\.ts$|^packages/ui/src/tokens/' /tmp/changed.txt; then echo "visual=true" >> "$GITHUB_OUTPUT"; echo "rust=true" >> "$GITHUB_OUTPUT"; fi
          if grep -qE '^docs/|\.md$' /tmp/changed.txt; then echo "docs=true" >> "$GITHUB_OUTPUT"; fi
          if grep -qE '^(package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig.base.json|vitest.config.ts|playwright.config.ts|Cargo.toml|Cargo.lock|biome.json|justfile|scripts/quality/|validation-impact.config.mjs)' /tmp/changed.txt; then echo "full=true" >> "$GITHUB_OUTPUT"; fi
          if grep -qE '^apps/desktop/public/models/|^models-source/' /tmp/changed.txt; then echo "models=true" >> "$GITHUB_OUTPUT"; fi
          # Log what we decided (agents/developers can see the classification)
          echo "changed files: $(wc -l < /tmp/changed.txt)"

  attribution-check:
    name: AI attribution guard
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Scan PR commits for prohibited AI attribution
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          FOUND=0
          while IFS= read -r sha; do
            MSG=$(git log -1 --format='%B' "$sha")
            if echo "$MSG" | grep -qiE '^Co-authored-by:.*(claude|anthropic|devin|cognition|copilot|codex|chatgpt|openai|gemini|cursor|windsurf|opencode|strata.agent|cascade)'; then
              echo "::error file=.githooks/commit-msg::Commit $sha contains AI Co-authored-by trailer"
              FOUND=1
            fi
            if echo "$MSG" | grep -qiE '(Generated with \[Devin\]|Generated by Claude|Generated with Claude|Created with Devin|Written with Copilot|Generated by Codex|AI-generated commit|AI-assisted commit)'; then
              echo "::error file=.githooks/commit-msg::Commit $sha contains AI generation attribution"
              FOUND=1
            fi
            if echo "$MSG" | grep -qiE '^Co-authored-by:.*<<[A-Z_]+>>'; then
              echo "::error file=.githooks/commit-msg::Commit $sha contains placeholder co-author trailer"
              FOUND=1
            fi
          done < <(git rev-list "$BASE".."$HEAD" 2>/dev/null || true)
          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "Commit messages contain prohibited AI tool attribution."
            echo "See AGENTS.md §Hard rules for policy."
            exit 1
          fi
          echo "No prohibited AI attribution found in PR commits."

  rust:
    permissions:
      contents: read
      actions: read
      checks: read
      issues: write
    name: Rust (${{ matrix.os }})
    timeout-minutes: 60
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.full == 'true' }}
    strategy:
      fail-fast: false
      # Limit simultaneous runner acquisitions: firing all three OS cells at
      # once is what starves the hosted runner pool during Actions incidents.
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install Linux system deps (Tauri / wgpu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libfontconfig1-dev libglib2.0-dev cmake pkg-config
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.9.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch onnxruntime native libs
        run: node scripts/fetch-onnxruntime.mjs
      - name: Build frontend (required by tauri generate_context!)
        run: pnpm build
        working-directory: apps/desktop
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-targets
      - name: cargo test (desktop)
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --features custom-protocol
      # One-shot diagnosis for STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139) on the
      # Windows test harness: compares imports against runner DLL exports.
      - name: Diagnose Windows entry-point failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: pwsh -File "$env:GITHUB_WORKSPACE/scripts/ci/diagnose-entrypoint.ps1"
      - name: Install cargo-llvm-cov
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026
        with:
          tool: cargo-llvm-cov
      - name: Install just
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026
        with:
          tool: just@1.54.0
      - name: Rust coverage (ratchet floor)
        if: runner.os == 'Linux'
        run: node scripts/audit-rust-coverage.mjs --ci
      - name: wasm check
        if: runner.os == 'Linux'
        run: just wasm-check
      - name: Install wasm-pack
        if: runner.os == 'Linux'
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi
      - name: wasm build (base + simd)
        if: runner.os == 'Linux'
        run: just wasm-build-all
      - name: Upload wasm artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-wasm
          path: apps/desktop/public/wasm/
      - name: Automated failure debug
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci-debug.mjs --run-id ${{ github.run_id }} --output ci-debug-report.md || true
      - name: Upload debug report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-debug-rust-${{ matrix.os }}-${{ github.run_id }}
          path: ci-debug-report.md
          if-no-files-found: ignore
      - name: Post debug report to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pr-debug-comment.mjs --run-id ${{ github.run_id }} --repo ${{ github.repository }} --report ci-debug-report.md || true

  pipeline-validate:
    name: Pipeline validation (workflow + SHA pins)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # The workflow security policy audit parses YAML structurally (js-yaml,
      # a devDependency), so this job now installs once. The install is small
      # and cached; the job stays cheap.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install JS dependencies (frozen)
        run: pnpm install --frozen-lockfile
      # Pinned release + checksum rather than a third-party action: this job
      # is the workflow supply-chain gate, so it should not take on another
      # action dependency to do its work. validate-workflows.mjs runs
      # actionlint when it is on PATH and skips it when it is not.
      - name: Install actionlint (pinned + checksummed)
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" actionlint
          install -m 0755 actionlint /usr/local/bin/actionlint
          rm -f "$archive" actionlint
          actionlint -version
          # actionlint runs shellcheck over `run:` blocks only when shellcheck
          # is present. Runners ship it; assert that so a runner image change
          # cannot silently downgrade this job to structure-only checks.
          shellcheck --version | head -2
      - name: Validate workflow YAML + structure
        run: node scripts/validate-workflows.mjs
      - name: Static pin check (no mutable refs)
        run: node scripts/pin-github-actions.mjs --check
      - name: Verify pinned SHAs resolve upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pin-github-actions.mjs --verify
      - name: Verify extractor logic
        run: node scripts/ci-debug.test.mjs
      - name: Verify simulated extractor scenario
        run: node scripts/test-ci-debug.mjs
      - name: Verify health classifier
        run: node scripts/ci-health.test.mjs
      - name: Verify release version consistency
        # Version drift across all manifests (package.json x2,
        # tauri.conf.json, workspace + desktop Cargo.toml) must never land on
        # master silently — release.yml only catches it at tag time, when a
        # fix means another commit + tag. Cheap and dependency-free.
        run: node scripts/release/version.mjs verify
      - name: Validate AUR PKGBUILD syntax
        run: bash -n packaging/aur/varve-desktop-bin/PKGBUILD
      - name: Validate Flatpak manifest YAML
        run: node scripts/packaging/validate-flatpak-manifest.mjs
      - name: Validate Linux package metadata consistency
        run: node scripts/release/linux-package-metadata.test.mjs
      - name: Verify product truth (cross-source contradiction check)
        # Detects contradictions between canonical sources (version, platforms,
        # signing, document extension, changelog) and user-facing claims.
        run: node scripts/release/verify-product-truth.mjs
      - name: Secret scan (tracked tree)
        run: node scripts/secret-scan.mjs
      - name: Secret scan regression tests (canaries)
        run: node scripts/secret-scan.test.mjs
      - name: Workflow security policy audit
        run: node scripts/security/workflow-policy.mjs
      - name: Workflow security policy regression tests
        run: node scripts/security/workflow-policy.test.mjs
      - name: Client environment guard (CI baseline)
        run: |
          node scripts/security/validate-client-env.mjs --app website
          node scripts/security/validate-client-env.mjs --app desktop
      - name: Client environment guard regression tests
        run: node scripts/security/validate-client-env.test.mjs
      - name: Import-boundary audit
        run: node scripts/security/import-boundaries.mjs
      - name: Import-boundary regression tests
        run: node scripts/security/import-boundaries.test.mjs
      - name: Verify pin-table integrity
        run: node scripts/pin-github-actions.test.mjs
      - name: Verify CI shell scripts
        run: bash scripts/test-ci-shell-scripts.sh

  js:
    permissions:
      contents: read
      actions: read
      checks: read
      issues: write
    name: JS (pnpm)
    timeout-minutes: 30
    needs: changes
    if: ${{ needs.changes.outputs.js == 'true' || needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      - name: token gate
        run: pnpm audit:tokens
      - name: emoji gate
        run: pnpm audit:emoji
      - name: test
        run: pnpm test
      - name: render-path perf gate (ratio-based, not absolute wall-clock)
        run: node scripts/audit-render-perf.mjs --ci
      - name: Automated failure debug
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci-debug.mjs --run-id ${{ github.run_id }} --output ci-debug-report.md || true
      - name: Upload debug report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-debug-js-${{ github.run_id }}
          path: ci-debug-report.md
          if-no-files-found: ignore
      - name: Post debug report to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pr-debug-comment.mjs --run-id ${{ github.run_id }} --repo ${{ github.repository }} --report ci-debug-report.md || true

  website-e2e:
    name: Website E2E (dual deployment modes)
    timeout-minutes: 30
    needs: changes
    if: ${{ needs.changes.outputs.website == 'true' }}
    runs-on: ubuntu-latest
    env:
      # Trust-boundary canary: present on every build step in this job, then
      # asserted ABSENT from the built artifacts below (see
      # docs/security/trust-boundaries.md §Canary tests).
      VARVE_PRIVATE_TEST_CANARY: VARVE_PRIVATE_TEST_CANARY_DO_NOT_SHIP
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      # The website must build and pass its whole suite in BOTH deployment
      # modes from the same source: the /varve GitHub Pages project site and a
      # root custom domain. The e2e servers mount the project-site build beneath
      # an actual /varve/ path — a server at / alone cannot detect base-path
      # escapes.
      - name: Build project-site mode (base /varve)
        run: pnpm build:website:pages
      - name: Build custom-domain (root) mode
        run: pnpm build:website
      - name: Scan website artifacts (secret + canary)
        run: |
          node scripts/secret-scan.mjs --dir apps/website/dist --canary "$VARVE_PRIVATE_TEST_CANARY"
          node scripts/secret-scan.mjs --dir apps/website/dist-pages --canary "$VARVE_PRIVATE_TEST_CANARY"
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Website E2E (both modes)
        run: pnpm exec playwright test -c playwright.website.config.ts

  e2e:
    permissions:
      contents: read
      actions: read
      checks: read
      issues: write
    # The chromium project is ~1030 tests and playwright.config.ts pins
    # workers to 1 on purpose (software-rendered canvas + on-device inference
    # contend badly when run in parallel). Shard across jobs instead of
    # raising the worker count, which keeps the documented serial-execution
    # guarantee inside each job.
    #
    # Shard count is measured, not guessed. Run 32888711333 sharded 4 ways and
    # every leg still hit the 30m ceiling; shard 1 was the only one to reach
    # its summary, at 241 tests in 27.0m — about 6.7s per test, so the whole
    # project is roughly 115 minutes of serial work. Eight shards puts each
    # leg near 15m of tests plus ~3m of setup, which leaves real headroom for
    # the retry cost of a failing test rather than sitting on the limit.
    name: E2E (Playwright) ${{ matrix.shard }}/8
    # 40, not 30: a test that exhausts the 180s per-test timeout costs 9
    # minutes with `retries: 2`, and Playwright shards by file rather than by
    # runtime, so one such test lands entirely in one shard. In run
    # 32894540118 that is exactly what happened — six shards finished in
    # 14.7-20.2m, while shard 5 (warp.spec.ts:168 hanging) was cancelled at
    # 30.3m with its results one test from the end. The ceiling still catches
    # a genuine runaway; it no longer throws away a shard's findings because
    # one known-broken test ate the budget.
    timeout-minutes: 40
    runs-on: ubuntu-latest
    needs: [rust, changes]
    if: ${{ needs.changes.outputs.e2e == 'true' || needs.changes.outputs.visual == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Download wasm artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: varve-wasm
          path: apps/desktop/public/wasm/
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E (chromium)
        run: pnpm exec playwright test --project=chromium --shard=${{ matrix.shard }}/8
      # always(): a job that exceeds timeout-minutes is cancelled, not failed,
      # so `if: failure()` steps are skipped and a timed-out run used to leave
      # nothing at all behind to diagnose.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-e2e-report-${{ github.run_id }}-shard${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Automated failure debug
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci-debug.mjs --run-id ${{ github.run_id }} --output ci-debug-report.md || true
      - name: Upload debug report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-debug-e2e-${{ github.run_id }}-shard${{ matrix.shard }}
          path: ci-debug-report.md
          if-no-files-found: ignore
      - name: Post debug report to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pr-debug-comment.mjs --run-id ${{ github.run_id }} --repo ${{ github.repository }} --report ci-debug-report.md || true

  # Split out of `e2e` so the snapshot projects run once rather than once per
  # shard, which would have made four jobs race over the same baselines.
  e2e-visual:
    permissions:
      contents: read
      actions: read
      checks: read
    name: Visual regression (canvas replay)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: [rust, changes]
    if: ${{ needs.changes.outputs.e2e == 'true' || needs.changes.outputs.visual == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Download wasm artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: varve-wasm
          path: apps/desktop/public/wasm/
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Visual regression (canvas replay)
        env:
          VARVE_VISUAL_HARNESS_ONLY: '1'
        run: pnpm exec playwright test --project=chromium-visual-1x --project=chromium-visual-2x --project=chromium-visual-3x
      - name: Visual regression (GPU-backed Chromium)
        env:
          VARVE_VISUAL_HARNESS_ONLY: '1'
          VARVE_VISUAL_GPU: '1'
        run: pnpm exec playwright test --project=chromium-visual-gpu
      - name: Build visual diff report
        if: failure()
        run: node scripts/build-visual-diff-manifest.mjs
      - name: Upload visual diff report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-visual-diff-${{ github.run_id }}
          path: visual-diff-report/
          if-no-files-found: ignore
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-e2e-visual-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Automated failure debug
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci-debug.mjs --run-id ${{ github.run_id }} --output ci-debug-report.md || true
      - name: Upload debug report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-debug-e2e-visual-${{ github.run_id }}
          path: ci-debug-report.md
          if-no-files-found: ignore

  desktop-e2e:
    permissions:
      contents: read
      actions: read
      checks: read
      issues: write
    name: Native desktop E2E (${{ matrix.name }})
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    needs: [rust, changes]
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x11
            os: ubuntu-latest
            xvfb: true
          - name: windows-x64
            os: windows-latest
            xvfb: false
          - name: macos
            os: macos-latest
            xvfb: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Linux system deps (Tauri + WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libfontconfig1-dev libglib2.0-dev libsoup-3.0-dev \
            libgdk-pixbuf2.0-dev libcairo2-dev libpango1.0-dev \
            cmake pkg-config patchelf xvfb dbus-x11 at-spi2-core mesa-utils
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Download wasm artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: varve-wasm
          path: apps/desktop/public/wasm/
      - name: Run native desktop E2E (Linux Xvfb)
        if: matrix.xvfb
        run: dbus-run-session -- xvfb-run --auto-servernum pnpm test:desktop:native
      - name: Run native desktop E2E (Windows/macOS)
        if: ${{ !matrix.xvfb }}
        run: pnpm test:desktop:native
      - name: Automated failure debug
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci-debug.mjs --run-id ${{ github.run_id }} --output ci-debug-report.md || true
      - name: Upload debug report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-debug-desktop-e2e-${{ github.run_id }}
          path: ci-debug-report.md
          if-no-files-found: ignore
      - name: Post debug report to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pr-debug-comment.mjs --run-id ${{ github.run_id }} --repo ${{ github.repository }} --report ci-debug-report.md || true
      - name: Upload native GUI artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-native-artifacts-${{ matrix.name }}-${{ github.run_id }}
          path: artifacts/desktop/
          if-no-files-found: ignore
