name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@a5ac7e51b41094c92402da3b243b9e2b7c2e1d6f
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@a2758e4818c2e4f4493a1d255f4662f19b65acf2
        with:
          components: rustfmt, clippy
      - name: Install Linux system deps (Tauri / wgpu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libfontconfig1-dev libglib2.0-dev cmake pkg-config
      - uses: Swatinem/rust-cache@f74c8cc5f54c0e3f1e043d6a4685b8489aee9c1b
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-targets
      - name: cargo test (desktop)
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --features custom-protocol
      - name: Install cargo-llvm-cov
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cargo-llvm-cov
      - uses: actions/setup-node@1a4442cda7143948ae1d52f1a60fd880ff95df6a
        if: runner.os == 'Linux'
        with:
          node-version: 26
      - name: Rust coverage (ratchet floor)
        if: runner.os == 'Linux'
        run: node scripts/audit-rust-coverage.mjs --ci
      - name: wasm check
        if: runner.os == 'Linux'
        run: just wasm-check
      - name: Install wasm-pack
        if: runner.os == 'Linux'
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi
      - name: wasm build (base + simd)
        if: runner.os == 'Linux'
        run: just wasm-build-all
      - name: Upload wasm artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0bbc538f
        with:
          name: strata-wasm
          path: apps/desktop/public/wasm/
      - name: Automated failure debug
        if: failure()
        run: node scripts/ci-debug.mjs --run-id ${{ github.run_id }} --output ci-debug-report.md || true
      - name: Upload debug report
        if: failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0bbc538f
        with:
          name: strata-debug-rust-${{ matrix.os }}-${{ github.run_id }}
          path: ci-debug-report.md
          if-no-files-found: ignore
      - name: Post debug report to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pr-debug-comment.mjs --run-id ${{ github.run_id }} --repo ${{ github.repository }} --report ci-debug-report.md || true

  js:
    name: JS (pnpm)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a5ac7e51b41094c92402da3b243b9e2b7c2e1d6f
      - uses: pnpm/action-setup@v4.0.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@1a4442cda7143948ae1d52f1a60fd880ff95df6a
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      - name: token gate
        run: pnpm audit:tokens
      - name: emoji gate
        run: pnpm audit:emoji
      - name: test
        run: pnpm test
      - name: render-path perf gate (ratio-based, not absolute wall-clock)
        run: node scripts/audit-render-perf.mjs --ci
      - name: Automated failure debug
        if: failure()
        run: node scripts/ci-debug.mjs --run-id ${{ github.run_id }} --output ci-debug-report.md || true
      - name: Upload debug report
        if: failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0bbc538f
        with:
          name: strata-debug-js-${{ github.run_id }}
          path: ci-debug-report.md
          if-no-files-found: ignore
      - name: Post debug report to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pr-debug-comment.mjs --run-id ${{ github.run_id }} --repo ${{ github.repository }} --report ci-debug-report.md || true

  e2e:
    name: E2E (Playwright)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@a5ac7e51b41094c92402da3b243b9e2b7c2e1d6f
      - uses: pnpm/action-setup@v4.0.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@1a4442cda7143948ae1d52f1a60fd880ff95df6a
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Download wasm artifact
        uses: actions/download-artifact@65a9edc535144f24f5bb5979b6c2cd39a097d35d
        with:
          name: strata-wasm
          path: apps/desktop/public/wasm/
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E (chromium)
        run: pnpm exec playwright test --project=chromium
      - name: Visual regression (canvas replay)
        run: pnpm exec playwright test --project=chromium-visual-1x --project=chromium-visual-2x
      - name: Build visual diff report
        if: failure()
        run: node scripts/build-visual-diff-manifest.mjs
      - name: Upload visual diff report
        if: failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0bbc538f
        with:
          name: strata-visual-diff-${{ github.run_id }}
          path: visual-diff-report/
          if-no-files-found: ignore
      - name: Automated failure debug
        if: failure()
        run: node scripts/ci-debug.mjs --run-id ${{ github.run_id }} --output ci-debug-report.md || true
      - name: Upload debug report
        if: failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0bbc538f
        with:
          name: strata-debug-e2e-${{ github.run_id }}
          path: ci-debug-report.md
          if-no-files-found: ignore
      - name: Post debug report to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pr-debug-comment.mjs --run-id ${{ github.run_id }} --repo ${{ github.repository }} --report ci-debug-report.md || true

  desktop-e2e:
    name: Native desktop E2E (${{ matrix.name }})
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x11
            os: ubuntu-latest
            xvfb: true
          - name: windows-x64
            os: windows-latest
            xvfb: false
          - name: macos
            os: macos-latest
            xvfb: false
    steps:
      - uses: actions/checkout@a5ac7e51b41094c92402da3b243b9e2b7c2e1d6f
      - uses: pnpm/action-setup@v4.0.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@1a4442cda7143948ae1d52f1a60fd880ff95df6a
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Linux system deps (Tauri + WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libfontconfig1-dev libglib2.0-dev libsoup-3.0-dev \
            libgdk-pixbuf2.0-dev libcairo2-dev libpango1.0-dev \
            cmake pkg-config patchelf xvfb dbus-x11 at-spi2-core mesa-utils
      - uses: dtolnay/rust-toolchain@a2758e4818c2e4f4493a1d255f4662f19b65acf2
      - uses: Swatinem/rust-cache@f74c8cc5f54c0e3f1e043d6a4685b8489aee9c1b
      - name: Download wasm artifact
        uses: actions/download-artifact@65a9edc535144f24f5bb5979b6c2cd39a097d35d
        with:
          name: strata-wasm
          path: apps/desktop/public/wasm/
      - name: Run native desktop E2E (Linux Xvfb)
        if: matrix.xvfb
        run: dbus-run-session -- xvfb-run --auto-servernum pnpm test:desktop:native
      - name: Run native desktop E2E (Windows/macOS)
        if: ${{ !matrix.xvfb }}
        run: pnpm test:desktop:native
      - name: Automated failure debug
        if: failure()
        run: node scripts/ci-debug.mjs --run-id ${{ github.run_id }} --output ci-debug-report.md || true
      - name: Upload debug report
        if: failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0bbc538f
        with:
          name: strata-debug-desktop-e2e-${{ github.run_id }}
          path: ci-debug-report.md
          if-no-files-found: ignore
      - name: Post debug report to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pr-debug-comment.mjs --run-id ${{ github.run_id }} --repo ${{ github.repository }} --report ci-debug-report.md || true
      - name: Upload native GUI artifacts
        if: failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0bbc538f
        with:
          name: strata-native-artifacts-${{ matrix.name }}-${{ github.run_id }}
          path: artifacts/desktop/
          if-no-files-found: ignore
