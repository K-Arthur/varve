name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux system deps (Tauri / wgpu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libfontconfig1-dev libglib2.0-dev cmake pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-targets
      - name: cargo test (desktop)
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --features custom-protocol
      - name: wasm check
        if: runner.os == 'Linux'
        run: just wasm-check
      - name: Install wasm-pack
        if: runner.os == 'Linux'
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi
      - name: wasm build (base + simd)
        if: runner.os == 'Linux'
        run: just wasm-build-all
      - name: Upload wasm artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: strata-wasm
          path: apps/desktop/public/wasm/
      - name: Automated failure debug
        if: failure()
        run: node scripts/ci-debug.mjs --run-id ${{ github.run_id }} --output ci-debug-report.md || true
      - name: Upload debug report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: strata-debug-rust-${{ matrix.os }}-${{ github.run_id }}
          path: ci-debug-report.md
          if-no-files-found: ignore

  js:
    name: JS (pnpm)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      - name: token gate
        run: pnpm audit:tokens
      - name: emoji gate
        run: pnpm audit:emoji
      - name: test
        run: pnpm test
      - name: Automated failure debug
        if: failure()
        run: node scripts/ci-debug.mjs --run-id ${{ github.run_id }} --output ci-debug-report.md || true
      - name: Upload debug report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: strata-debug-js-${{ github.run_id }}
          path: ci-debug-report.md
          if-no-files-found: ignore

  e2e:
    name: E2E (Playwright)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Download wasm artifact
        uses: actions/download-artifact@v4
        with:
          name: strata-wasm
          path: apps/desktop/public/wasm/
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E (chromium)
        run: pnpm exec playwright test --project=chromium
      - name: Automated failure debug
        if: failure()
        run: node scripts/ci-debug.mjs --run-id ${{ github.run_id }} --output ci-debug-report.md || true
      - name: Upload debug report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: strata-debug-e2e-${{ github.run_id }}
          path: ci-debug-report.md
          if-no-files-found: ignore

  desktop-e2e:
    name: Desktop E2E (Linux)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Install system deps (Tauri + WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libfontconfig1-dev libglib2.0-dev cmake pkg-config patchelf \
            webkit2gtk-driver
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download wasm artifact
        uses: actions/download-artifact@v4
        with:
          name: strata-wasm
          path: apps/desktop/public/wasm/
      - name: Build Tauri app (debug, wdio feature)
        run: pnpm tauri build --debug --features wdio
        working-directory: apps/desktop
      - name: Install Tauri WDIO browsers (xvfb)
        run: |
          sudo apt-get install -y --no-install-recommends xvfb
      - name: Run Desktop E2E (WDIO)
        run: |
          xvfb-run --auto-servernum pnpm test:wdio
      - name: Automated failure debug
        if: failure()
        run: node scripts/ci-debug.mjs --run-id ${{ github.run_id }} --output ci-debug-report.md || true
      - name: Upload debug report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: strata-debug-desktop-e2e-${{ github.run_id }}
          path: ci-debug-report.md
          if-no-files-found: ignore
