name: Website Deploy

on:
  push:
    branches:
      - master
    paths:
      - 'apps/website/**'
      - '.github/workflows/website-deploy.yml'
      - 'scripts/release/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  # A published release redeploys the site so the download page is rebuilt from
  # the exact published assets (see scripts/release/fetch-website-release.mjs).
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Never cancel a deployment halfway through — a half-published site is worse
  # than a slow one. The deploy job inherits the build's group via `needs`.
  group: "pages"
  cancel-in-progress: false

env:
  PNPM_VERSION: '11.9.0'
  NODE_VERSION: '26'

jobs:
  # ── 1. Quality gates: typecheck, unit tests, a11y scans, dual-mode builds ──
  test:
    name: Website quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          lfs: true

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Type check + unit tests (incl. release-data states)
        run: pnpm test:website

      # Both deployment modes must build from the same source: /varve project
      # mode and a root custom-domain mode. The e2e suite (link crawl, asset
      # existence, axe-core, canonical/sitemap/robots/404, mobile nav) runs
      # against both builds, served beneath the real /varve path.
      - name: Build project-site mode
        run: pnpm build:website

      - name: Build custom-domain (root) mode
        run: pnpm build:website:root

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E in both modes
        run: pnpm exec playwright test -c playwright.website.config.ts

  # ── 2. Release-driven build + upload ────────────────────────────────────────
  build:
    name: Build and upload Pages artifact
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          lfs: true
          ref: ${{ github.event.release && github.event.release.target_commitish || 'master' }}

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      # The download page is rebuilt from the published release (channel
      # policy: latest stable, else latest published prerelease; drafts never
      # appear). Without a token this step is skipped and the committed
      # no-release manifest is used. On `release: published` the token is
      # present and the page is regenerated from the exact release assets.
      - name: Fetch release data from GitHub
        if: env.GITHUB_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/fetch-website-release.mjs

      - name: Build website
        run: pnpm --filter @varve/website build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: apps/website/dist

  # ── 3. Deploy + post-deployment smoke check ─────────────────────────────────
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          lfs: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

      # Bounded-retry smoke check against the live URL: homepage, download,
      # docs, releases, sitemap, robots, favicons, 404 behaviour and the
      # /varve canonical prefix. A deployment that 404s is a failed deploy.
      - name: Smoke check the live deployment
        run: node scripts/website/smoke-pages.mjs "${{ steps.deployment.outputs.page_url }}" --expect-prefix /varve
