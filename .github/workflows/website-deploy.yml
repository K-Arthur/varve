name: Website Deploy

on:
  push:
    branches:
      - master
    paths:
      - 'apps/website/**'
      - '.github/workflows/website-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@a5ac7e51b41094c92402da3b243b9e2b7c2e1d6f

      - name: Install pnpm
        uses: pnpm/action-setup@v4.0.0
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@1a4442cda7143948ae1d52f1a60fd880ff95df6a
        with:
          node-version: 26
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm --filter "@strata/website..." install --frozen-lockfile

      - name: Build website
        run: pnpm --filter @strata/website build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609a6d36c6f4d523e46487649a8f387916e
        with:
          path: apps/website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db901e937bf07bc879f5e0e003a5b86184d9ae
