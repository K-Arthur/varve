name: CI Debug Report

on:
  workflow_run:
    workflows:
      - CI
      - Build + Package
      - Publish
      - Website Deploy
      - Model Supply Chain Validation
      - Model Quantization & Validation
      - E2E Keyboard Nav
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  debug-report:
    name: Debug Report
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Generate debug report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ci-debug.mjs is dependency-free (Node builtins only) — no pnpm
          # install needed. A full `pnpm install --frozen-lockfile` here is
          # wasted work AND a single point of failure (if deps are broken the
          # debug job itself dies). The report is fetched via the GitHub API.
          node scripts/ci-debug.mjs \
            --run-id ${{ github.event.workflow_run.id }} \
            --repo ${{ github.repository }} \
            --output ci-debug-report.md

      - name: Upload debug report
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: ci-debug-report-${{ github.event.workflow_run.id }}
          path: ci-debug-report.md
          if-no-files-found: ignore
