name: CI Debug Report

on:
  workflow_run:
    workflows:
      - CI
      - Build + Package
      - Release
      - Website Deploy
      - Model Supply Chain Validation
      - Model Quantization & Validation
      - E2E Keyboard Nav
      - Visual Baselines
    types:
      - completed

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  debug-report:
    name: Debug Report
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # workflow_run is privileged. Always execute the commenter and
          # report generator from the trusted default branch, never from the
          # failed PR's checkout.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # Probe first: when every failure in the triggering run is
      # infrastructure (billing block, runner never acquired, job stuck in
      # queue during an Actions outage), generating a debug report adds
      # nothing but another job to an already-starved runner pool. The probe
      # exits 0 only when at least one real (code-level) failure exists.
      - name: Probe for real (code-level) failures
        id: probe
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/ci-debug.mjs \
            --probe \
            --run-id ${{ github.event.workflow_run.id }} \
            --repo ${{ github.repository }}

      - name: Skip report (infrastructure-only failure)
        if: steps.probe.outcome == 'failure'
        run: |
          echo "All failures in run ${{ github.event.workflow_run.id }} are infrastructure"
          echo "(billing / runner starvation / stuck queue) — no debug report generated."
          echo "Check https://www.githubstatus.com and rerun when GitHub Actions recovers."

      - name: Generate debug report
        if: steps.probe.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # ci-debug.mjs is dependency-free (Node builtins only) — no pnpm
          # install needed. A full `pnpm install --frozen-lockfile` here is
          # wasted work AND a single point of failure (if deps are broken the
          # debug job itself dies). The report is fetched via the GitHub API.
          node scripts/ci-debug.mjs \
            --run-id ${{ github.event.workflow_run.id }} \
            --repo ${{ github.repository }} \
            --output ci-debug-report.md

      - name: Upload debug report
        if: always() && steps.probe.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-debug-report-${{ github.event.workflow_run.id }}
          path: ci-debug-report.md
          if-no-files-found: ignore

  # PR comments are deliberately posted here, after the failed workflow has
  # completed and from the trusted default-branch checkout. The ordinary PR
  # jobs run untrusted repository code and therefore never receive issues:write.
  post-pr-comment:
    name: Post PR debug comment
    needs: debug-report
    if: >-
      needs.debug-report.result == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      issues: write
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Download generated debug report
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: ci-debug-report-${{ github.event.workflow_run.id }}
          path: .
      - name: Post debug report to PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/pr-debug-comment.mjs \
            --run-id ${{ github.event.workflow_run.id }} \
            --repo ${{ github.repository }} \
            --report ci-debug-report.md
