name: CI Debug Report

on:
  workflow_run:
    workflows:
      - CI
      - Build + Package
      - Publish
      - Website Deploy
    types:
      - completed

permissions:
  contents: read
  actions: write
  checks: read

jobs:
  debug-report:
    name: Debug Report
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a5ac7e51b41094c92402da3b243b9e2b7c2e1d6f

      - uses: pnpm/action-setup@v4.0.0
        with:
          version: 11.9.0

      - uses: actions/setup-node@1a4442cda7143948ae1d52f1a60fd880ff95df6a
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate debug report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/ci-debug.mjs \
            --run-id ${{ github.event.workflow_run.id }} \
            --repo ${{ github.repository }} \
            --output ci-debug-report.md

      - name: Upload debug report
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0bbc538f
        with:
          name: ci-debug-report-${{ github.event.workflow_run.id }}
          path: ci-debug-report.md
          if-no-files-found: ignore
