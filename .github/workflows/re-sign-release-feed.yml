name: Re-sign release feed

# One-shot workflow to re-sign AppImage artifacts whose signatures were
# invalidated by post-build pruning.  Run this once after the pipeline
# fix lands, then delete the workflow file.
#
# Requires: TAURI_SIGNING_PRIVATE_KEY repository secret.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to re-sign (e.g. v0.2.0)'
        required: true
        type: string

jobs:
  re-sign:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Re-sign artifacts and regenerate feed
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/release/re-sign-release-feed.mjs --tag ${{ inputs.tag }}

      - name: Commit feed update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/website/public/updates/stable.json
          git commit -m "fix(updater): re-sign ${{ inputs.tag }} AppImage artifacts and regenerate feed"
          git push
