name: Visual Baselines

on:
  # Regenerate the website visual test baselines ON runner infrastructure.
  #
  # Why this exists: the committed PNGs are compared against rendering on
  # ubuntu-latest CI runners, and Playwright screenshots are pixel-exact —
  # fonts, fontconfig and subpixel rendering differ between machines, so a
  # baseline generated on a developer machine (e.g. CachyOS) fails on the
  # runner even for a visually identical site. Baselines must be produced by
  # the same platform that compares them.
  #
  # Run once in comparison mode, inspect expected/actual/diff artifacts, then
  # dispatch again in explicit reviewed update mode. The workflow never pushes
  # to master: the reviewed PNG artifact is committed by a human in a small,
  # reviewable change.
  workflow_dispatch:
    inputs:
      reviewed:
        description: "I inspected expected, actual, and diff images from a prior run"
        required: true
        type: boolean
        default: false
      update_snapshots:
        description: "Write the reviewed baseline update into the artifact"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: visual-baselines
  cancel-in-progress: false

env:
  PNPM_VERSION: '11.9.0'
  NODE_VERSION: '26'

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: master

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Build project-site mode (base /varve)
        run: pnpm build:website:pages

      - name: Build custom-domain (root) mode
        run: pnpm build:website

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Compare or update visual baselines
        env:
          VARVE_REVIEWED: ${{ inputs.reviewed }}
          VARVE_UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots }}
        run: |
          if [[ "$VARVE_REVIEWED" == "true" && "$VARVE_UPDATE_SNAPSHOTS" == "true" ]]; then
            echo "Explicit reviewed update mode enabled. The resulting PNGs still require a human-reviewed commit."
            pnpm exec playwright test -c playwright.website.config.ts \
              --project=ghpages apps/website/tests/e2e/visual.spec.ts \
              --update-snapshots
          else
            echo "Comparison mode: inspect expected, actual, and diff images before any update dispatch."
            pnpm exec playwright test -c playwright.website.config.ts \
              --project=ghpages apps/website/tests/e2e/visual.spec.ts
          fi

      - name: Upload reviewed comparison/update artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: visual-baseline-review-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
            apps/website/tests/e2e/visual.spec.ts-snapshots/
          if-no-files-found: ignore
          retention-days: 14
